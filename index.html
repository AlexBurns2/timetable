<!DOCTYPE html>
<html lang="en" data-skin="plain" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   The whole look is driven by these tokens. Each skin re-declares
   them, so the markup and layout never change between skins.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#faf7f0; --bg-img:none; --panel:#fff; --panel-2:#f2efe6;
  --line:#ddd6c6; --text:#241f18; --muted:#7d7364; --accent:#c2571f; --accent-ink:#fff;
  --radius:14px; --card-radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06);
  --shadow-hi:0 4px 10px rgba(0,0,0,.08), 0 14px 34px rgba(0,0,0,.1);
  --font-ui:"DM Sans",system-ui,sans-serif;
  --font-display:"Instrument Serif",Georgia,serif;
  --font-num:"DM Sans",system-ui,sans-serif;
  --tint:14%;            /* how much subject colour bleeds into a card */
  --card-border:1px solid var(--line);
  --card-accent:5px;     /* left colour bar width */
  --rot:0deg;
  --display-tt:normal; --display-ls:-.02em; --display-w:700;
}

/* ── PLAIN ─ the quiet default: white on white, grey on grey ────── */
[data-skin="plain"]{
  --bg:#ffffff; --bg-img:none; --panel:#ffffff; --panel-2:#f6f6f7;
  --line:#e5e5e8; --text:#18181b; --muted:#8b8b93; --accent:#4f4fd0; --accent-ink:#fff;
  --font-ui:"DM Sans",system-ui,sans-serif;
  --font-display:"DM Sans",system-ui,sans-serif;
  --font-num:"DM Sans",system-ui,sans-serif;
  --card-radius:10px; --tint:0%; --card-accent:3px;
  --card-border:1px solid var(--line);
  --shadow:none; --shadow-hi:0 1px 4px rgba(0,0,0,.09);
  --display-ls:-.015em; --display-w:600; --display-tt:normal;
}
[data-skin="plain"][data-mode="dark"]{
  --bg:#161618; --panel:#1f1f22; --panel-2:#27272b;
  --line:#303035; --text:#eaeaee; --muted:#87878f; --accent:#8f8ff2;
  --shadow-hi:0 1px 4px rgba(0,0,0,.55);
}

/* ── PAPER ─ ruled notebook, post-it lessons ───────────────────── */
[data-skin="paper"]{
  --bg:#f7f3e8;
  --bg-img:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(80,110,160,.13) 31px 32px);
  --panel:#fffdf6; --panel-2:#f0ead8; --line:#ded4bd;
  --text:#2c2519; --muted:#8a7f6a; --accent:#c2571f; --accent-ink:#fff;
  --font-ui:"Patrick Hand",'Comic Sans MS',cursive;
  --font-display:"Caveat",cursive;
  --font-num:"Patrick Hand",cursive;
  --card-radius:3px; --tint:44%; --card-accent:0px;
  --card-border:1px solid rgba(0,0,0,.09);
  --shadow:2px 3px 7px rgba(60,45,20,.16);
  --shadow-hi:4px 7px 16px rgba(60,45,20,.22);
  --display-w:700; --display-ls:0;
}
[data-skin="paper"][data-mode="dark"]{
  --bg:#221f1a;
  --bg-img:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(150,170,210,.09) 31px 32px);
  --panel:#2e2a23; --panel-2:#282420; --line:#413a30;
  --text:#f0e9db; --muted:#a2957f; --accent:#e8834a;
  --tint:30%;
}
/* the red margin rule */
[data-skin="paper"] .wrap::before{
  content:"";position:fixed;top:0;bottom:0;left:max(26px,calc(50% - 700px + 26px));
  width:2px;background:rgba(200,70,70,.42);pointer-events:none;z-index:0;
}
[data-skin="paper"] .lesson{transform:rotate(var(--rot))}
[data-skin="paper"] .lesson:hover{transform:rotate(0deg) translateY(-3px) scale(1.02)}
/* sticky-tape tab on each note */
[data-skin="paper"] .lesson::before{
  content:"";position:absolute;top:-7px;left:50%;translate:-50% 0;
  width:46px;height:15px;background:rgba(255,255,255,.55);
  border:1px solid rgba(0,0,0,.07);border-top:0;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
[data-skin="paper"][data-mode="dark"] .lesson::before{background:rgba(255,255,255,.14)}

/* ── GLASS ─ frosted tiles over a colour mesh ──────────────────── */
[data-skin="glass"]{
  --bg:#0d1220;
  --bg-img:
    radial-gradient(60vw 60vw at 12% 8%,rgba(120,90,255,.5),transparent 60%),
    radial-gradient(55vw 55vw at 88% 18%,rgba(0,190,220,.42),transparent 62%),
    radial-gradient(60vw 60vw at 50% 96%,rgba(255,80,160,.34),transparent 60%);
  --panel:rgba(255,255,255,.09); --panel-2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.2);
  --text:#f3f5fb; --muted:rgba(233,238,250,.66); --accent:#8ab4ff; --accent-ink:#0a1020;
  --font-ui:"Space Grotesk",system-ui,sans-serif;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-num:"Space Grotesk",system-ui,sans-serif;
  --card-radius:20px; --tint:26%; --card-accent:0px;
  --card-border:1px solid rgba(255,255,255,.22);
  --shadow:0 4px 24px rgba(0,0,0,.3);
  --shadow-hi:0 10px 40px rgba(0,0,0,.42);
  --display-ls:-.03em;
}
[data-skin="glass"][data-mode="light"]{
  --bg:#eef1f8;
  --bg-img:
    radial-gradient(60vw 60vw at 10% 5%,rgba(150,120,255,.42),transparent 60%),
    radial-gradient(55vw 55vw at 90% 15%,rgba(0,200,230,.36),transparent 62%),
    radial-gradient(60vw 60vw at 50% 95%,rgba(255,120,180,.3),transparent 60%);
  --panel:rgba(255,255,255,.55); --panel-2:rgba(255,255,255,.38);
  --line:rgba(255,255,255,.8);
  --text:#15192b; --muted:#5b6178; --accent:#4a5cf0; --accent-ink:#fff;
  --tint:30%;
}
[data-skin="glass"] .lesson,[data-skin="glass"] .nowcard,
[data-skin="glass"] .breakbar,[data-skin="glass"] .btn,
[data-skin="glass"] dialog,[data-skin="glass"] .gatecard,
[data-skin="glass"] .dayswitch button{
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
}
/* specular top edge */
[data-skin="glass"] .lesson::after,[data-skin="glass"] .nowcard::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.4),transparent 42%);
}

/* ── SWISS ─ stark white, hairlines, no shadow ─────────────────── */
[data-skin="swiss"]{
  --bg:#fff; --bg-img:none; --panel:#fff; --panel-2:#f6f6f6;
  --line:#111; --text:#000; --muted:#767676; --accent:#e8112d; --accent-ink:#fff;
  --font-ui:"Space Grotesk",Helvetica,Arial,sans-serif;
  --font-display:"Space Grotesk",Helvetica,sans-serif;
  --font-num:"Space Grotesk",Helvetica,sans-serif;
  --card-radius:0px; --tint:0%; --card-accent:0px;
  --card-border:1px solid #111;
  --shadow:none; --shadow-hi:none;
  --display-ls:-.045em; --display-w:700;
}
[data-skin="swiss"][data-mode="dark"]{
  --bg:#000; --panel:#000; --panel-2:#111; --line:#fff; --text:#fff; --muted:#8c8c8c;
  --card-border:1px solid #fff;
}
[data-skin="swiss"] .lesson{border-top:5px solid var(--c,var(--accent))}
[data-skin="swiss"] .lesson:hover{background:var(--panel-2)}
[data-skin="swiss"] .colhead .dow{text-transform:uppercase;letter-spacing:.06em;font-size:12px}

/* ── TERMINAL ─ phosphor CRT ───────────────────────────────────── */
[data-skin="terminal"],[data-skin="terminal"][data-mode="light"]{
  --bg:#05080a; --bg-img:none; --panel:#0b1114; --panel-2:#0f171b;
  --line:#1d3a33; --text:#9dffc4; --muted:#3f8f6b; --accent:#39ff9e; --accent-ink:#04120a;
  --font-ui:"JetBrains Mono",ui-monospace,monospace;
  --font-display:"JetBrains Mono",monospace;
  --font-num:"JetBrains Mono",monospace;
  --card-radius:0px; --tint:16%; --card-accent:3px;
  --card-border:1px solid #1d3a33;
  --shadow:none; --shadow-hi:0 0 0 1px var(--accent);
  --display-ls:.04em; --display-tt:uppercase;
}
[data-skin="terminal"] body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
[data-skin="terminal"] .lesson .s::before{content:"> ";color:var(--accent)}
[data-skin="terminal"] .lesson:hover{box-shadow:0 0 14px rgba(57,255,158,.28)}

/* ── BLUEPRINT ─ drafting paper ────────────────────────────────── */
[data-skin="blueprint"],[data-skin="blueprint"][data-mode="light"]{
  --bg:#0b2a4a;
  --bg-img:
    repeating-linear-gradient(to right,rgba(255,255,255,.09) 0 1px,transparent 1px 28px),
    repeating-linear-gradient(to bottom,rgba(255,255,255,.09) 0 1px,transparent 1px 28px);
  --panel:rgba(255,255,255,.05); --panel-2:rgba(255,255,255,.09);
  --line:rgba(150,210,255,.42);
  --text:#e2f2ff; --muted:#8fc0e8; --accent:#67e8f9; --accent-ink:#062033;
  --font-ui:"Space Mono",monospace;
  --font-display:"Space Mono",monospace;
  --font-num:"Space Mono",monospace;
  --card-radius:0px; --tint:14%; --card-accent:0px;
  --card-border:1px dashed rgba(150,210,255,.55);
  --shadow:none; --shadow-hi:none;
  --display-tt:uppercase; --display-ls:.08em;
}
[data-skin="blueprint"] .lesson{outline:1px solid rgba(150,210,255,.14);outline-offset:3px}
[data-skin="blueprint"] .lesson:hover{border-style:solid}

/* ── BRUTAL ─ thick borders, hard shadows ──────────────────────── */
[data-skin="brutal"]{
  --bg:#ffe94a; --bg-img:none; --panel:#fffdf5; --panel-2:#fff4c2;
  --line:#000; --text:#000; --muted:#4a4a4a; --accent:#0047ff; --accent-ink:#fff;
  --card-radius:0px; --tint:34%; --card-accent:0px;
  --card-border:3px solid #000;
  --shadow:5px 5px 0 #000; --shadow-hi:8px 8px 0 #000;
  --font-ui:"Space Grotesk",system-ui,sans-serif;
  --font-display:"Archivo Black",system-ui,sans-serif;
  --font-num:"Space Grotesk",monospace;
  --display-tt:uppercase; --display-ls:-.01em;
}
[data-skin="brutal"][data-mode="dark"]{
  --bg:#12121a; --panel:#20202c; --panel-2:#2a2a38; --line:#fff;
  --text:#fff; --muted:#b3b3c4; --accent:#ffe94a; --accent-ink:#000;
  --card-border:3px solid #fff; --shadow:5px 5px 0 #fff; --shadow-hi:8px 8px 0 #fff;
}
[data-skin="brutal"] .lesson:hover{translate:-3px -3px}

/* ═══════════════ shared structure ═══════════════ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); background-image:var(--bg-img);
  background-attachment:fixed; color:var(--text); min-height:100vh;
  font:15px/1.5 var(--font-ui);
  -webkit-font-smoothing:antialiased; transition:background-color .25s, color .25s;
}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:20px 20px 70px;position:relative;z-index:1}

header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{
  margin:0;font-family:var(--font-display);font-size:clamp(24px,3.4vw,38px);
  font-weight:var(--display-w);letter-spacing:var(--display-ls);
  text-transform:var(--display-tt);line-height:1.05;
}
.brand>span{color:var(--muted);font-size:12.5px;margin-top:3px;min-height:16px}
.brand>span.err{color:#e5484d}
.idrow{display:flex;align-items:center;gap:0;margin-top:5px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);
  padding:3px 9px;max-width:max-content;transition:border-color .15s}
.idrow:focus-within{border-color:var(--accent)}
.idrow input{border:0;background:none;outline:none;padding:3px 0;width:11ch;
  font-size:13px;font-family:var(--font-num)}
.idrow .dom{color:var(--muted);font-size:12px;white-space:nowrap;opacity:.8}
@media (max-width:520px){ .idrow .dom{display:none} }
.btn{
  background:var(--panel);border:var(--card-border);border-radius:var(--radius);
  padding:8px 13px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;
  transition:transform .12s,background .15s,box-shadow .15s;
}
.btn:hover{background:var(--panel-2);box-shadow:var(--shadow-hi)}
.btn:active{transform:translateY(1px)}
.btn.icon{width:40px;padding:8px 0;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
[data-skin="brutal"] .btn.primary,[data-skin="swiss"] .btn.primary{border-color:var(--line)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeklabel{min-width:212px;text-align:center;color:var(--muted);font-size:13px;font-family:var(--font-num)}
.wk{
  display:inline-block;margin-left:7px;padding:2px 9px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;
}
[data-skin="swiss"] .wk,[data-skin="brutal"] .wk,[data-skin="blueprint"] .wk{border-radius:0}

/* now / next */
.now{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.nowcard{
  position:relative;flex:1 1 280px;background:var(--panel);border:var(--card-border);
  border-left:5px solid var(--c,var(--accent));
  border-radius:var(--card-radius);padding:13px 15px;box-shadow:var(--shadow);min-width:0;overflow:hidden;
}
.nowcard .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nowcard .subj{font-size:19px;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowcard .meta{color:var(--muted);font-size:13px;margin-top:3px}
.nowcard .count{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;margin-top:7px;font-weight:700}
.progrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog{flex:1;height:7px;background:color-mix(in srgb,var(--text) 12%,transparent);
      border-radius:99px;overflow:hidden;min-width:0}
.prog i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;
        transition:width .6s linear}
.progrow .count{margin-top:0;white-space:nowrap;color:var(--c,var(--accent))}
[data-skin="swiss"] .prog,[data-skin="brutal"] .prog,
[data-skin="terminal"] .prog,[data-skin="blueprint"] .prog{border-radius:0}
[data-skin="swiss"] .prog i,[data-skin="brutal"] .prog i,
[data-skin="terminal"] .prog i,[data-skin="blueprint"] .prog i{border-radius:0}

/* grid */
.grid{display:grid;gap:10px;align-items:stretch;grid-template-columns:84px repeat(var(--days,5),minmax(0,1fr))}
/* Sticky headers need an opaque-ish backdrop. Repainting --bg-img here would
   redraw the page gradient once per cell, so use a blurred wash instead. */
.colhead{position:sticky;top:0;z-index:5;padding:7px 2px 9px;text-align:center;
         background:color-mix(in srgb, var(--bg) 78%, transparent);
         backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.colhead .dow{font-weight:700;font-size:14px;font-family:var(--font-display);
              letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
[data-skin="paper"] .colhead .dow{font-size:22px}
.colhead .dat{color:var(--muted);font-size:12px;font-family:var(--font-num)}
.colhead.today .dow,.colhead.today .dat{color:var(--accent)}
.colhead.today::after{content:"";display:block;height:3px;background:var(--accent);margin:5px auto 0;width:34px;border-radius:2px}
.periodcell{color:var(--muted);font-size:12px;text-align:right;padding:15px 9px 0 0;
            line-height:1.35;font-family:var(--font-num)}
.periodcell b{display:block;color:var(--text);font-size:14px;font-weight:700}
.periodcell.brk{padding-top:9px}
.cell{min-height:88px;display:flex}
.cell.brk{min-height:0}

.lesson{
  position:relative;width:100%;text-align:left;cursor:pointer;
  background:color-mix(in srgb, var(--c) var(--tint), var(--panel));
  border:var(--card-border);
  border-left:var(--card-accent) solid var(--c,var(--accent));
  border-radius:var(--card-radius);padding:11px 12px;box-shadow:var(--shadow);
  overflow:hidden;transition:transform .14s ease, box-shadow .14s ease, background .15s;
  display:flex;flex-direction:column;gap:1px;
}
.lesson:hover{box-shadow:var(--shadow-hi)}
.lesson .s{
  font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere;
  font-family:var(--font-display);letter-spacing:var(--display-ls);
}
[data-skin="paper"] .lesson .s{font-size:19px;line-height:1.05}
[data-skin="glass"] .lesson .s,[data-skin="terminal"] .lesson .s{font-family:var(--font-ui)}
.lesson .r{font-size:12.5px;margin-top:4px;font-weight:700;opacity:.9}
.lesson .t{color:inherit;opacity:.86;font-size:12.5px;overflow-wrap:anywhere}
.lesson .tm{color:inherit;opacity:.85;font-size:11.5px;margin-top:auto;padding-top:6px;
            font-family:var(--font-num);font-variant-numeric:tabular-nums}
.lesson.current{outline:2.5px solid var(--c,var(--accent));outline-offset:2px}
.lesson.current{position:relative}
.dimmed{opacity:.3;filter:saturate(.5);transition:opacity .2s,filter .2s}
.colhead.dimmed .dow{color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}

.breakbar{
  width:100%;background:var(--panel-2);border:var(--card-border);border-radius:var(--card-radius);
  padding:5px 10px;color:var(--muted);font-size:11.5px;text-align:center;
  font-family:var(--font-num);opacity:.85;
}
.free{
  width:100%;border:1px dashed var(--line);border-radius:var(--card-radius);min-height:88px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;opacity:.6;
}

/* mobile */
.dayswitch{display:none;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:5px}
.dayswitch button{
  flex:0 0 auto;background:var(--panel);border:var(--card-border);border-radius:999px;
  padding:8px 15px;cursor:pointer;font-size:13px;box-shadow:var(--shadow);
}
[data-skin="swiss"] .dayswitch button,[data-skin="brutal"] .dayswitch button,
[data-skin="blueprint"] .dayswitch button,[data-skin="terminal"] .dayswitch button{border-radius:0}
.dayswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:860px){
  .grid{grid-template-columns:70px minmax(0,1fr)}
  .dayswitch{display:flex}
  .weeklabel{min-width:0;font-size:12px}
  .weeknav{order:3;width:100%;justify-content:space-between}
  [data-skin="paper"] .wrap::before{display:none}
}

/* gate */
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);background-image:var(--bg-img);
      display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden]{display:none}
.gatecard{background:var(--panel);border:var(--card-border);border-radius:var(--card-radius);
          box-shadow:var(--shadow-hi);padding:30px;width:min(430px,100%)}
.gatecard h2{margin:0 0 7px;font-family:var(--font-display);font-size:clamp(24px,5vw,32px);
             font-weight:var(--display-w);letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
.gatecard p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.emailrow{display:flex;align-items:center;border:var(--card-border);border-radius:var(--radius);
          background:var(--panel-2);overflow:hidden}
.emailrow input{flex:1;min-width:0;border:0;background:none;padding:12px 13px;outline:none}
.emailrow .dom{padding-right:13px;color:var(--muted);font-size:13px;white-space:nowrap}
.gatecard .btn{margin-top:15px;width:100%;font-weight:700}
.gateerr{color:#e5484d;font-size:13px;margin-top:11px;min-height:19px}
[data-skin="terminal"] .gateerr,[data-skin="blueprint"] .gateerr{color:#ff8a8a}

/* dialogs */
dialog{
  border:var(--card-border);background:var(--panel);color:var(--text);
  border-radius:var(--card-radius);padding:0;box-shadow:var(--shadow-hi);width:min(540px,93vw);
}

<script>
(() => {
"use strict";

/* ═══ CONFIG ═══ set ENDPOINT once and the page needs no manual setup ═══ */
const CONFIG = {
  /* The only place the endpoint lives. Not exposed in Settings. */
  ENDPOINT: "https://timetable-iota-ten.vercel.app/api/timetable",
  EMAIL_DOMAIN: "education.nsw.gov.au"
};

/* ═══ skins ═══ */
const SKINS = [
  { id:'plain',     name:'Plain',     swatch:'linear-gradient(#fff,#fff)', both:true, border:'#e5e5e8' },
  { id:'paper',     name:'Notebook',  swatch:'linear-gradient(#f7f3e8,#f7f3e8) padding-box, repeating-linear-gradient(to bottom,#f7f3e8 0 7px,#c8d4e8 7px 8px)', both:true },
  { id:'glass',     name:'Glass',     swatch:'radial-gradient(circle at 25% 20%,#7a5aff,transparent 60%),radial-gradient(circle at 80% 30%,#00becc,transparent 62%),radial-gradient(circle at 50% 90%,#ff50a0,transparent 60%),#0d1220', both:true },
  { id:'swiss',     name:'Swiss',     swatch:'linear-gradient(#fff,#fff)', both:true, border:'#111' },
  { id:'terminal',  name:'Terminal',  swatch:'repeating-linear-gradient(to bottom,#05080a 0 2px,#0d1a14 2px 4px)', both:false },
  { id:'blueprint', name:'Blueprint', swatch:'repeating-linear-gradient(to right,rgba(255,255,255,.25) 0 1px,transparent 1px 9px),repeating-linear-gradient(to bottom,rgba(255,255,255,.25) 0 1px,transparent 1px 9px),#0b2a4a', both:false },
  { id:'custom',    name:'Custom',    swatch:'conic-gradient(from 210deg,#ff5f6d,#ffc371,#7ee8fa,#a06cd5,#ff5f6d)', both:false, custom:true },
  { id:'brutal',    name:'Brutal',    swatch:'linear-gradient(135deg,#ffe94a 50%,#0047ff 50%)', both:true }
];
const SKIN_IDS = SKINS.map(s => s.id);

/* ═══ storage ═══ */
const LS = { email:'tt.email', custom:'tt.custom', skin:'tt.skin', mode:'tt.mode', colours:'tt.colours', cache:'tt.cache' };
const get = (k,d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const set = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const endpoint = CONFIG.ENDPOINT;
let email    = get(LS.email, '');
let colours  = get(LS.colours, {});
const CUSTOM_FONTS = ['DM Sans','Space Grotesk','JetBrains Mono','Space Mono',
                      'Instrument Serif','Caveat','Patrick Hand','Archivo Black'];
const CUSTOM_DEFAULTS = { bg:'#f2f4f8', panel:'#ffffff', text:'#16181d',
                          accent:'#6d4aff', line:'#d9dde5',
                          radius:12, tint:22, font:'DM Sans' };
let custom   = Object.assign({}, CUSTOM_DEFAULTS, get(LS.custom, {}));
let skin     = get(LS.skin, 'plain');
let mode     = get(LS.mode, matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
if (SKIN_IDS.indexOf(skin) === -1) skin = 'plain';

const CUSTOM_VARS = ['--bg','--bg-img','--panel','--panel-2','--line','--text','--muted',
                     '--accent','--accent-ink','--card-radius','--radius','--tint',
                     '--card-border','--card-accent','--shadow','--shadow-hi',
                     '--font-ui','--font-display','--font-num','--display-tt','--display-ls'];

/* relative luminance -> black or white text on top of the chosen accent */
function inkFor(hex){
  const h = String(hex).replace('#','');
  if (h.length !== 6) return '#fff';
  const v = [0,2,4].map(i => parseInt(h.slice(i,i+2),16)/255)
                   .map(c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4));
  return (0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2]) > 0.42 ? '#000' : '#fff';
}

function applyLook(){
  const root = document.documentElement;
  root.setAttribute('data-skin', skin);
  root.setAttribute('data-mode', mode);

  CUSTOM_VARS.forEach(v => root.style.removeProperty(v));
  if (skin !== 'custom') return;

  const c = custom, S = (k,v) => root.style.setProperty(k, v);
  S('--bg', c.bg); S('--bg-img', 'none');
  S('--panel', c.panel);
  S('--panel-2', 'color-mix(in srgb, ' + c.panel + ' 90%, ' + c.text + ')');
  S('--line', c.line);
  S('--text', c.text);
  S('--muted', 'color-mix(in srgb, ' + c.text + ' 58%, ' + c.panel + ')');
  S('--accent', c.accent);
  S('--accent-ink', inkFor(c.accent));
  S('--card-radius', c.radius + 'px');
  S('--radius', Math.max(4, Math.round(c.radius * 0.85)) + 'px');
  S('--tint', c.tint + '%');
  S('--card-border', '1px solid ' + c.line);
  S('--card-accent', '4px');
  S('--shadow', c.radius > 0 ? '0 1px 3px rgba(0,0,0,.10)' : 'none');
  S('--shadow-hi', '0 4px 16px rgba(0,0,0,.16)');
  const f = '"' + c.font + '", system-ui, sans-serif';
  S('--font-ui', f); S('--font-display', f); S('--font-num', f);
  S('--display-tt', 'normal'); S('--display-ls', '-.01em');
}
applyLook();

/* ═══ dates ═══ */
const DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CYCLE_DAYS = ['mona','tuea','weda','thua','fria','monb','tueb','wedb','thub','frib'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const sameDay = (a,b) => !!a && !!b && ymd(a) === ymd(b);
const fmtShort = d => d.getDate() + ' ' + MON[d.getMonth()];
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

function toMinutes(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v > 1440 ? null : v;
  const s = String(v).trim();
  const iso = s.match(/T(\d{1,2}):(\d{2})/);
  if (iso) return (+iso[1])*60 + (+iso[2]);
  const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])?/);
  if (!m) return null;
  let h = +m[1]; const mi = +m[2]; const ap = m[3] && m[3].toLowerCase();
  if (ap === 'p' && h < 12) h += 12;
  if (ap === 'a' && h === 12) h = 0;
  return h*60 + mi;
}
const fmtTime = mins => {
  if (mins === null || mins === undefined) return '';
  const h = Math.floor(mins/60), m = mins%60;
  return (((h+11)%12)+1) + ':' + pad(m) + (h >= 12 ? 'pm' : 'am');
};
function toDate(v){
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v);
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], (+m[2])-1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], (+m[2])-1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ═══ field pickers ═══ */
const pick = (o, keys) => {
  if (o == null || typeof o !== 'object') return undefined;
  const lower = {};
  for (const k of Object.keys(o)) lower[k.toLowerCase()] = o[k];
  for (const k of keys){
    const v = lower[k.toLowerCase()];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return undefined;
};
const deepStr = v => (v && typeof v === 'object')
  ? (pick(v, ['name','fullName','displayName','description','title','shortName','code','text']) || '')
  : (v === undefined || v === null ? '' : v);
const str = v => String(deepStr(v)).trim();
function asArray(v){
  if (Array.isArray(v)) return v;
  if (v && typeof v === 'object'){ for (const val of Object.values(v)) if (Array.isArray(val)) return val; }
  return [];
}

/* ═══ subject tidy-up ═══
   The API gives names like "11PHYS A3 Physics Yr11". Strip the leading class
   code and the trailing year suffix, but never strip down to nothing. */
/* Optional display renames, applied after the year suffix is stripped.
   Left-hand side is the cleaned CourseName. Edit freely. */
const SUBJECT_RENAMES = {
  // 'Mathematics Extension 1': 'Maths Ext 1',
  // 'Mathematics HSC': 'Maths Advanced',
};

function cleanSubject(name, code){
  const original = String(name || '').trim();
  let s = original;
  s = s.replace(/\s*[-–—,]?\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i, '');            /* "... Yr11" */
  /* Strip a leading class code, but only if a real word survives -- otherwise
     a subject that is *only* a code ("11PHYS A3") would collapse to "A3". */
  const keepsAWord = v => /[A-Za-z]{3,}/.test(v);
  const noCode = s.replace(/^\d{1,2}\s*[A-Za-z]{2,}[A-Za-z0-9]*(?:\s+[A-Za-z]?\d{1,2})?\s+(?=\S)/, '');
  if (noCode !== s && keepsAWord(noCode)) s = noCode;
  if (code){
    const c = String(code).trim();
    if (c && s.toLowerCase().startsWith(c.toLowerCase())){
      const rest = s.slice(c.length);
      if (keepsAWord(rest)) s = rest;
    }
  }
  s = s.replace(/^[\s:\-–—]+/, '').replace(/\s{2,}/g, ' ').trim();
  if (!s) s = original.replace(/\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i, '').trim();
  s = s || original || String(code || '').trim() || 'Class';
  return SUBJECT_RENAMES[s] || s;
}
/* "CR1007.118" -> "118", "ER0020.27" -> "27". The part after the final dot is
   the human room number; everything before it is the building/floor code. */
function shortRoom(r){
  const s = String(r || '').trim();
  if (!s) return '';
  const dot = s.lastIndexOf('.');
  if (dot === -1) return s;
  const tail = s.slice(dot + 1).trim();
  return tail || s;
}

/* Teachers arrive as "stephen.henne@det.nsw.edu.au" -> "Stephen Henne".
   Also handles "Doyle, Mr R" -> "Mr R Doyle" and passes plain names through. */
function tidyTeacher(t){
  const s = String(t || '').trim();
  if (!s) return '';
  if (s.includes('@')){
    const n = nameFromEmail(s);
    if (n) return n;
    return titleCase(s.split('@')[0].replace(/[._]+/g, ' ').replace(/\d+$/, ''));
  }
  const m = s.match(/^([^,]+),\s*(.+)$/);
  return m ? (m[2] + ' ' + m[1]).replace(/\s{2,}/g,' ').trim() : s;
}
const titleCase = s => String(s).split(/[-\s]+/).filter(Boolean)
  .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(' ');

/* ═══ cycle mapping ═══ */
function cycleDayFor(date, cycleStart){
  if (!cycleStart) return null;
  /* Day 0 of the cycle is a Monday. If the API's start date lands mid-week,
     snap back to that week's Monday, otherwise every column shifts and a
     Monday column would show (say) Thursday's lessons. */
  const d = midnight(date), start = midnight(startOfWeek(cycleStart));
  const dow = d.getDay();
  if (dow === 0 || dow === 6) return null;
  if (d < start) return null;
  let elapsed = 0;
  const cur = new Date(start);
  while (cur < d){ cur.setDate(cur.getDate()+1); const w = cur.getDay(); if (w !== 0 && w !== 6) elapsed++; }
  return CYCLE_DAYS[elapsed % 10];
}
/* Only a bare number ("4", "P4", "Period 4") is a period number. Labels like
   "L1"/"L2" (lunch halves) and "R" (recess) must keep their own identity --
   an unanchored match turned "L1" into "1" and clobbered period 1's bell times. */
const periodNumber = v => {
  const s = String(v == null ? '' : v).trim();
  const m = s.match(/^(?:period\s*|p)?(\d+)$/i);
  return m ? m[1] : s;
};
const classify = v => {
  const p = String(v == null ? '' : v).toLowerCase();
  if (p.includes('assembly')) return 'assembly';
  if (p.includes('recess') || p === 'break') return 'break';
  if (p.includes('lunch')) return 'lunch';
  return 'class';
};

/* ═══ state ═══ */
let weekStart = startOfWeek(new Date());
let entries = [], slots = [];
let cycleStart = null, displayName = '';
let mobileDay = Math.min(4, (new Date().getDay()+6)%7);
let loadError = '', loading = false;
let focusToday = false;        /* Today button: dim everything but the current day */

/* ═══ normalise ═══ */
function buildBellIndex(bellTimes){
  const idx = {};
  for (const bt of asArray(bellTimes)){
    const day = str(pick(bt, ['DayName','dayName'])).toLowerCase();
    const per = periodNumber(pick(bt, ['Period','period','PeriodNumber','periodNumber'])).toLowerCase();
    const start = toMinutes(pick(bt, ['StartTime','startTime','Start','start','From','from']));
    const end   = toMinutes(pick(bt, ['EndTime','endTime','End','end','To','to']));
    if (start === null && end === null) continue;
    if (day) idx[day + '|' + per] = { start, end };
    if (!idx['*|' + per]) idx['*|' + per] = { start, end };
  }
  return idx;
}

function normalise(payload){
  const bell = buildBellIndex(payload.bellTimes);
  const out = [];
  for (const raw of asArray(payload.timetable)){
    const dayName = str(pick(raw, ['DayName','dayName']));
    if (!dayName) continue;
    const dayKey = dayName.toLowerCase();
    if (CYCLE_DAYS.indexOf(dayKey) === -1) continue;

    const period = str(pick(raw, ['Period','period','PeriodNumber','periodNumber']));
    const kind = classify(period);
    const pnum = periodNumber(period).toLowerCase();
    const bt = bell[dayKey + '|' + pnum] || bell['*|' + pnum] || {};
    const rowStart = toMinutes(pick(raw, ['StartTime','startTime','Start','start']));
    const rowEnd   = toMinutes(pick(raw, ['EndTime','endTime','End','end']));

    /* CourseName is the human name ("Engineering Studies Yr11"); ClassCode is
       the roll code ("11ENGST A4"). Prefer the former, keep the latter for the
       detail sheet. */
    const rawSubject = str(pick(raw, ['CourseName','courseName','SubjectName','Subject','subjectName','subject','Description','description','ClassName','className']));
    const code    = str(pick(raw, ['ClassCode','classCode','Code','code']));
    const teacher = str(pick(raw, ['TeacherName','teacherName','TeacherFullName','teacherFullName','Teacher','teacher','DefaultTeacher','StaffName','staffName']));
    const room    = str(pick(raw, ['RoomCode','roomCode','RoomNumber','roomNumber','RoomName','roomName','Room','room','Location','location']));

    out.push({
      dayKey, dayName, period, pnum, kind, code,
      room: shortRoom(room), rawRoom: room,
      teacher: tidyTeacher(teacher), rawTeacher: teacher,
      rawSubject,
      subject: kind === 'class' ? cleanSubject(rawSubject, code) : titleCase(period),
      /* The row carries its own times and is authoritative; bell times only
         fill gaps for rows that omit them. */
      start: rowStart != null ? rowStart : bt.start,
      end:   rowEnd   != null ? rowEnd   : bt.end
    });
  }
  return out;
}

function buildSlots(){
  const map = new Map();
  for (const e of entries){
    const key = e.pnum || e.period.toLowerCase();
    const cur = map.get(key) || { key, period:e.period, kind:e.kind, start:e.start, end:e.end };
    if (e.start != null && (cur.start == null || e.start < cur.start)) cur.start = e.start;
    if (e.end   != null && (cur.end   == null || e.end   > cur.end  )) cur.end   = e.end;
    if (e.kind !== 'class') cur.kind = e.kind;
    map.set(key, cur);
  }
  slots = [...map.values()].sort((a,b) => {
    if (a.start != null && b.start != null && a.start !== b.start) return a.start - b.start;
    return String(a.key).localeCompare(String(b.key), undefined, { numeric:true });
  });
}

/* ═══ colours ═══ */
const PALETTE = ['#e0542e','#3b6ef6','#12a594','#a259e6','#e5a000','#d6409f','#2f9e44','#0e7490','#c2410c','#7c3aed','#0891b2','#be123c'];
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i))|0; return Math.abs(h); };
const colourFor = s => colours[s] || PALETTE[hash(String(s)) % PALETTE.length];

/* ═══ load ═══ */
function endpointUrl(){
  const u = new URL(endpoint, location.href);
  u.searchParams.set('email', email);
  return u.toString();
}
async function load(useCache){
  loadError = '';
  if (!endpoint || !email) return;
  if (useCache){
    const c = get(LS.cache, null);
    if (c && c.email === email && Date.now() - c.at < 6*60*60*1000){ apply(c.payload); return; }
  }
  loading = true;
  try {
    /* no-store: the browser must always revalidate, otherwise a stale timetable
       can stick around for hours. Vercel's s-maxage still shields the school API. */
    const res = await fetch(endpointUrl(), { headers:{ Accept:'application/json' }, cache:'no-store' });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || (res.status + ' ' + res.statusText));
    apply(data);
    set(LS.cache, { email, at: Date.now(), payload: data });
  } catch (err) {
    loadError = err.message;
    entries = []; slots = [];
  } finally { loading = false; }
}
function apply(payload){
  entries = normalise(payload);
  buildSlots();
  cycleStart = toDate(typeof payload.startDate === 'string' ? payload.startDate
    : pick(payload.startDate || {}, ['startDate','StartDate','date','Date']));
  const p = payload.profile;
  displayName = p ? titleCase(str(pick(p, ['FullName','fullName'])) ||
      [str(pick(p, ['FirstName','firstName'])), str(pick(p, ['LastName','lastName']))].filter(Boolean).join(' ')) : '';
  if (!displayName) displayName = nameFromEmail(payload.email || email);
  if (!entries.length) loadError = 'No lessons were returned for that address.';
}
function nameFromEmail(e){
  const parts = String(e || '').split('@')[0].split('.');
  if (parts.length < 2) return '';
  return titleCase(parts[0]) + ' ' + titleCase(parts[1].replace(/\d+$/, ''));
}

/* ═══ render ═══ */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const entryAt = (cycleDay, slotKey) => entries.find(e => e.dayKey === cycleDay && (e.pnum || e.period.toLowerCase()) === slotKey);

function render(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isMobile = matchMedia('(max-width:860px)').matches;
  const days = [0,1,2,3,4].map(i => addDays(weekStart, i));
  const cycles = days.map(d => cycleDayFor(d, cycleStart));

  $('title').textContent = displayName || 'Timetable';
  $('sub').textContent = loading ? 'Loading…' : (loadError || '');
  $('sub').className = loadError ? 'err' : '';
  if (document.activeElement !== $('whoami')) $('whoami').value = String(email || '').split('@')[0];

  /* No calendar dates on screen — the timetable is a repeating cycle, so the
     week letter is the only thing that actually identifies what is shown. */
  const wkLetter = (cycles.find(Boolean) || '').slice(-1).toUpperCase();
  $('weeklabel').innerHTML = wkLetter
    ? '<span class="wk">Week ' + wkLetter + '</span>'
    : '<span class="wk">Timetable</span>';
  $('today').setAttribute('aria-pressed', String(focusToday));

  const ds = $('dayswitch');
  ds.innerHTML = '';
  days.forEach((d, i) => {
    const b = document.createElement('button');
    b.textContent = DAY[d.getDay()].slice(0,3);
    b.setAttribute('aria-pressed', String(i === mobileDay));
    b.onclick = () => { mobileDay = i; render(); };
    ds.appendChild(b);
  });

  /* now / next */
  const todayCycle = cycleDayFor(now, cycleStart);
  const todays = entries.filter(e => e.dayKey === todayCycle && e.kind === 'class' && e.start != null)
                        .sort((a,b) => a.start - b.start);
  const current  = todays.find(e => e.start <= nowMin && nowMin < (e.end == null ? e.start+60 : e.end));
  const upcoming = todays.find(e => e.start > nowMin);
  const nowEl = $('now');
  nowEl.innerHTML = '';
  nowEl.appendChild(nowCard('Now',  current,  nowMin));
  nowEl.appendChild(nowCard('Next', upcoming, nowMin));

  /* grid */
  const idx = isMobile ? [mobileDay] : [0,1,2,3,4];
  const grid = $('grid');
  grid.style.setProperty('--days', idx.length);
  grid.innerHTML = '';
  grid.appendChild(el('div','colhead'));
  idx.forEach(i => {
    const d = days[i];
    const isToday = sameDay(d, now);
    const h = el('div','colhead' + (isToday ? ' today' : '') +
                       (focusToday && !isToday ? ' dimmed' : ''));
    h.innerHTML = '<div class="dow">' + DAY[d.getDay()] + '</div>';
    grid.appendChild(h);
  });

  let rot = 0;
  slots.forEach(slot => {
    const isBreak = slot.kind !== 'class';
    const pc = el('div','periodcell' + (isBreak ? ' brk' : ''));
    if (!isBreak){
      const time = slot.start != null ? fmtTime(slot.start) + '<br>' + fmtTime(slot.end) : '';
      pc.innerHTML = '<b>' + esc(/^\d+$/.test(slot.key) ? 'Period ' + slot.key : titleCase(slot.period)) + '</b>' + time;
    }
    grid.appendChild(pc);

    idx.forEach(i => {
      const d = days[i], cyc = cycles[i];
      const cell = el('div','cell' + (isBreak ? ' brk' : ''));
      const e = cyc ? entryAt(cyc, slot.key) : null;

      if (focusToday && cyc && !sameDay(d, now)) cell.classList.add('dimmed');
      if (isBreak){
        cell.appendChild(el('div','breakbar',
          titleCase((e && e.period) || slot.period) +
          (slot.start != null ? ' · ' + fmtTime(slot.start) + '–' + fmtTime(slot.end) : '')));
      } else if (!e){
        cell.appendChild(el('div','free', cyc ? '' : ''));
      } else {
        const c = colourFor(e.subject);
        const box = document.createElement('button');
        box.type = 'button';
        box.className = 'lesson';
        box.style.setProperty('--c', c);
        box.style.setProperty('--rot', (((rot++ % 4) - 1.5) * 0.62).toFixed(2) + 'deg');
        const endMin = e.end == null ? (e.start == null ? null : e.start + 60) : e.end;
        const isToday = sameDay(d, now);
        const isNow  = isToday && e.start != null && e.start <= nowMin && nowMin < endMin;
        if (isNow) box.classList.add('current');
        /* Nothing is greyed out by default; Today turns on focus mode. */
        if (focusToday && !isToday) box.classList.add('dimmed');
        box.innerHTML =
          '<div class="s">' + esc(e.subject) + '</div>' +
          (e.room    ? '<div class="r">' + esc(e.room) + '</div>' : '') +
          (e.teacher ? '<div class="t">' + esc(e.teacher) + '</div>' : '') +
          (e.start != null ? '<div class="tm">' + fmtTime(e.start) + '–' + fmtTime(e.end) + '</div>' : '');
        box.onclick = () => showDetail(e, d);
        cell.appendChild(box);
      }
      grid.appendChild(cell);
    });
  });
}

function nowCard(label, e, nowMin){
  const d = el('div','nowcard');
  if (!e){
    d.innerHTML = '<div class="lbl">' + label + '</div><div class="subj">Nothing scheduled</div>' +
                  '<div class="meta">Enjoy the break</div>';
    return d;
  }
  const c = colourFor(e.subject);
  d.style.setProperty('--c', c);
  const bits = [e.room, e.teacher].filter(Boolean).join(' · ');
  const endMin = e.end == null ? e.start + 60 : e.end;
  const running = e.start <= nowMin && nowMin < endMin;
  const mins = running ? endMin - nowMin : e.start - nowMin;
  const pct = running ? Math.max(0, Math.min(100, ((nowMin - e.start) / (endMin - e.start)) * 100)) : 0;
  const mm = m => m >= 60 ? Math.floor(m/60) + 'h ' + (m%60) + 'm' : m + ' min';
  const cd = mins >= 0 ? (running ? mm(mins) + ' left' : 'starts in ' + mm(mins)) : '';
  d.innerHTML =
    '<div class="lbl">' + label + '</div>' +
    '<div class="subj">' + esc(e.subject) + '</div>' +
    '<div class="meta">' + esc(bits) + (e.start != null ? ' · ' + fmtTime(e.start) + '–' + fmtTime(e.end) : '') + '</div>' +
    (running
      ? '<div class="progrow"><div class="prog"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
        '<span class="count">' + cd + '</span></div>'
      : (cd ? '<div class="count">' + cd + '</div>' : ''));
  return d;
}

/* ═══ lesson detail ═══ */
function showDetail(e, date){
  const c = colourFor(e.subject);
  const head = $('dhead');
  head.style.setProperty('--c', c);
  head.innerHTML =
    '<div class="dsub">' + esc(e.subject) + '</div>' +
    '<div class="dwhen">' + esc(DAY[date.getDay()] + ' ' + fmtShort(date)) +
    (e.start != null ? ' · ' + fmtTime(e.start) + ' – ' + fmtTime(e.end) : '') + '</div>';

  const rows = [
    ['Period', /^\d+$/.test(e.pnum) ? 'Period ' + e.pnum : titleCase(e.period)],
    ['Room', e.rawRoom && e.rawRoom !== e.room ? e.room + '  (' + e.rawRoom + ')' : e.room],
    ['Teacher', e.teacher],
    ['Email', e.rawTeacher && e.rawTeacher.includes('@') ? e.rawTeacher : ''],
    ['Class code', e.code],
    ['Cycle day', e.dayName],
    ['Full name', e.rawSubject && e.rawSubject !== e.subject ? e.rawSubject : '']
  ].filter(r => r[1]);

  $('drows').innerHTML = rows.map(r =>
    '<div class="drow"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>').join('');
  $('detail').showModal();
}
$('dclose').onclick = () => $('detail').close();
$('detail').onclick = ev => { if (ev.target === $('detail')) $('detail').close(); };

/* ═══ email gate ═══ */
const gate = $('gate');
$('gatedomain').textContent = '@' + CONFIG.EMAIL_DOMAIN;
function showGate(msg){
  $('gateerr').textContent = msg || '';
  $('gateemail').value = String(email || '').split('@')[0];
  gate.hidden = false;
  setTimeout(() => $('gateemail').focus(), 30);
}
$('gateform').onsubmit = async ev => {
  ev.preventDefault();
  const v = $('gateemail').value.trim().toLowerCase();
  if (!v) return;
  const user = v.includes('@') ? v.split('@')[0] : v;
  if (!/^[a-z0-9][a-z0-9._-]*$/.test(user)){ $('gateerr').textContent = 'That does not look like a school username.'; return; }
  email = user + '@' + CONFIG.EMAIL_DOMAIN;
  $('gatego').textContent = 'Loading…';
  $('gateerr').textContent = '';
  await load(false);
  $('gatego').textContent = 'Show my timetable';
  if (loadError){ $('gateerr').textContent = loadError; return; }
  set(LS.email, email);
  gate.hidden = true;
  render();
};

/* ═══ username field on the page ═══ */
$('whoamidom').textContent = '@' + CONFIG.EMAIL_DOMAIN;
async function setUser(raw){
  const v = String(raw || '').trim().toLowerCase();
  const user = v.includes('@') ? v.split('@')[0] : v;
  if (!user || !/^[a-z0-9][a-z0-9._-]*$/.test(user)){
    loadError = 'That does not look like a school username.'; render(); return;
  }
  const next = user + '@' + CONFIG.EMAIL_DOMAIN;
  if (next === email){
    if (loadError){ loadError = ''; render(); }   /* clear a stale rejection */
    return;
  }
  email = next;
  localStorage.removeItem(LS.cache);
  await load(false);
  if (!loadError) set(LS.email, email);
  render();
}
$('whoami').addEventListener('keydown', ev => {
  if (ev.key === 'Enter'){ ev.preventDefault(); $('whoami').blur(); }
});
$('whoami').addEventListener('change', ev => setUser(ev.target.value));
$('whoami').addEventListener('blur', ev => setUser(ev.target.value));

/* ═══ settings ═══ */
const dlg = $('dlg');
function renderSkins(){
  const host = $('skins');
  host.innerHTML = '';
  SKINS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'skinbtn';
    b.setAttribute('aria-pressed', String(s.id === skin));
    b.innerHTML = '<span class="sw" style="background:' + s.swatch +
                  (s.border ? ';box-shadow:inset 0 0 0 1px ' + s.border : '') + '"></span>' +
                  '<span class="nm">' + s.name + '</span>';
    b.onclick = () => { skin = s.id; set(LS.skin, skin); applyLook();
                        renderSkins(); renderModes(); renderCustom(); render(); };
    host.appendChild(b);
  });
}
function renderCustom(){
  const on = skin === 'custom';
  $('customwrap').hidden = !on;
  if (!on) return;
  const sel = $('c_font');
  if (!sel.options.length) CUSTOM_FONTS.forEach(f => sel.add(new Option(f, f)));
  $('c_bg').value     = custom.bg;
  $('c_panel').value  = custom.panel;
  $('c_text').value   = custom.text;
  $('c_accent').value = custom.accent;
  $('c_line').value   = custom.line;
  $('c_radius').value = custom.radius; $('c_radius_v').textContent = custom.radius + 'px';
  $('c_tint').value   = custom.tint;   $('c_tint_v').textContent   = custom.tint + '%';
  sel.value = custom.font;
}
function bindCustom(){
  const touch = (id, key, after) => {
    $(id).addEventListener('input', ev => {
      custom[key] = (key === 'radius' || key === 'tint') ? +ev.target.value : ev.target.value;
      set(LS.custom, custom);
      applyLook();
      if (after) after();
      render();
    });
  };
  touch('c_bg','bg'); touch('c_panel','panel'); touch('c_text','text');
  touch('c_accent','accent'); touch('c_line','line'); touch('c_font','font');
  touch('c_radius','radius', () => { $('c_radius_v').textContent = custom.radius + 'px'; });
  touch('c_tint','tint',     () => { $('c_tint_v').textContent   = custom.tint + '%'; });
  $('c_reset').onclick = () => {
    custom = Object.assign({}, CUSTOM_DEFAULTS);
    set(LS.custom, custom); applyLook(); renderCustom(); render();
  };
}
bindCustom();

function renderModes(){
  const cur = SKINS.find(s => s.id === skin);
  [...$('modes').children].forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    b.disabled = !cur.both;
    b.style.opacity = cur.both ? '' : '.45';
  });
  $('modehint').textContent = cur.both ? '' : cur.name + ' has one fixed palette.';
}
[...$('modes').children].forEach(b => {
  b.onclick = () => { mode = b.dataset.mode; set(LS.mode, mode); applyLook(); renderModes(); render(); };
});
$('mode').onclick = () => {
  const cur = SKINS.find(s => s.id === skin);
  if (!cur.both) return;
  mode = mode === 'dark' ? 'light' : 'dark';
  set(LS.mode, mode); applyLook(); render();
};
$('settings').onclick = () => {
  $('status').textContent = loadError || '';
  $('status').className = 'status' + (loadError ? ' err' : '');
  renderSkins(); renderModes(); renderCustom(); renderColours();
  dlg.showModal();
};
const toHex = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#3b6ef6';
function renderColours(){
  const host = $('colours');
  host.innerHTML = '';
  const subs = [...new Set(entries.filter(e => e.kind === 'class').map(e => e.subject))].filter(Boolean).sort();
  $('nocolours').hidden = subs.length > 0;
  subs.forEach(s => {
    const row = el('div','colrow');
    const sw = document.createElement('input');
    sw.type = 'color'; sw.value = toHex(colourFor(s));
    sw.oninput = () => { colours[s] = sw.value; set(LS.colours, colours); render(); };
    row.appendChild(el('span','', s));
    row.appendChild(sw);
    host.appendChild(row);
  });
}
$('resetcolours').onclick = e => { e.preventDefault(); colours = {}; set(LS.colours, colours); renderColours(); render(); };
$('save').onclick = async e => {
  e.preventDefault();
  dlg.close();
  localStorage.removeItem(LS.cache);
  await load(false);
  render();
};

/* ═══ controls ═══ */
$('prev').onclick  = () => { weekStart = addDays(weekStart,-7); render(); };
$('next').onclick  = () => { weekStart = addDays(weekStart, 7); render(); };
$('today').onclick = () => {
  focusToday = !focusToday;
  if (focusToday){
    weekStart = startOfWeek(new Date());
    mobileDay = Math.min(4, (new Date().getDay()+6)%7);
  }
  render();
};
addEventListener('keydown', e => {
  if (dlg.open || $('detail').open || !gate.hidden) return;
  if (e.key === 'ArrowLeft')  $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 't' || e.key === 'T') $('today').click();
  if (e.key === 's' || e.key === 'S') $('settings').click();
});
addEventListener('resize', render);

/* ═══ boot ═══ */
(async () => {
  render();
  if (!endpoint) return;
  if (!email){ showGate(); return; }
  await load(true);
  render();
  if (loadError){ showGate(loadError); return; }
  load(false).then(render);
})();
setInterval(render, 30000);
setInterval(() => { if (endpoint && email) load(false).then(render); }, 15*60*1000);
})();
</script>
