<!DOCTYPE html>
<html lang="en" data-skin="plain" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>·</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<!--
  The vault. Linked from nowhere; found by accident or by following the few
  clues around the site. It keeps the order people found it in (vault_visit,
  via /api/forum?vault=1) and shows it to whoever gets here.
-->
<style>
:root{--ink:#e9e6df;--dim:#8d877b;--faint:#4a463f;--line:#24221e;--bg:#0b0a09;--glow:#c9a86a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;font:400 15px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  display:flex;justify-content:center;padding:max(10vh,48px) 20px 64px;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(201,168,106,.10),transparent 70%),var(--bg)}
main{width:min(560px,100%)}
.mark{color:var(--faint);letter-spacing:.4em;font-size:12px;margin:0 0 28px;user-select:none}
h1{font-weight:700;font-size:clamp(22px,5.4vw,30px);line-height:1.3;margin:0 0 10px;letter-spacing:-.01em;min-height:1.3em}
h1 .n{color:var(--glow)}
.caret{display:inline-block;width:.55em;height:1.05em;margin-left:2px;vertical-align:-.12em;background:var(--glow);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{color:var(--dim);margin:0 0 34px;opacity:0;transition:opacity .8s}
.sub.on{opacity:1}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;gap:16px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(4px);
  transition:opacity .5s,transform .5s}
li.on{opacity:1;transform:none}
li .k{color:var(--faint);width:3ch;flex:none;text-align:right}
li .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .when{color:var(--faint);font-size:12px;flex:none}
li.me .who{color:var(--glow)}
li.me .k{color:var(--glow)}
.more{color:var(--faint);font-size:12px;margin:14px 2px 0}
.door{color:var(--dim)}
.door a,.leave a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--faint)}
.door a:hover,.leave a:hover{border-color:var(--glow)}
.leave{margin-top:44px;font-size:12px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){ .caret{animation:none} li,.sub{transition:none} }
</style>
</head>
<body>
<main id="m">
  <p class="mark" aria-hidden="true">· · ·</p>
  <h1 id="h"><span class="caret"></span></h1>
  <p class="sub" id="sub"></p>
  <div id="list"></div>
  <p class="leave"><a href="home.html">leave</a></p>
</main>
<script>
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const day = iso => { const d = new Date(iso); return isFinite(d) ? d.toLocaleDateString('en-AU', { day:'numeric', month:'short' }) : ''; };

/* the headline, typed out a letter at a time */
function type(html, text, done){
  const h = $('h');
  if (still){ h.innerHTML = html; done(); return; }
  let i = 0;
  (function step(){
    i++;
    h.innerHTML = esc(text.slice(0, i)) + '<span class="caret"></span>';
    if (i < text.length) setTimeout(step, 28 + Math.random() * 40);
    else setTimeout(() => { h.innerHTML = html + '<span class="caret"></span>'; done(); }, 250);
  })();
}

if (!(window.TT && TT.signedIn && TT.signedIn())){
  type('This door needs a key.', 'This door needs a key.', () => {
    $('sub').innerHTML = '<span class="door">Sign in first, then come back. <a href="./">Sign in</a></span>'; $('sub').classList.add('on');
  });
  return;
}

const seenKey = 'msc.vault';                      // this device: you've been before (for the wording only)
let before = false; try { before = !!localStorage.getItem(seenKey); localStorage.setItem(seenKey, '1'); } catch {}

TT.api('/api/forum', { method:'POST', params:{ vault:1 } }).then(d => {
  if (!d || !d.rank){ throw new Error('sealed'); }
  const n = ord(d.rank);
  const line = (before ? 'You were the ' : 'You’re the ') + n + ' person to find this.';
  const html = (before ? 'You were the ' : 'You’re the ') + '<span class="n">' + n + '</span> person to find this.';
  type(html, line, () => {
    $('sub').textContent = d.total === 1 ? 'No one else has, yet.' : d.total + ' have found it so far. Keep it that way.';
    $('sub').classList.add('on');
    const rows = d.list || [];
    const show = rows.slice(0, 300);
    $('list').innerHTML = '<ol>' + show.map((p, i) =>
      '<li class="' + (p.me ? 'me' : '') + '"><span class="k">' + (i + 1) + '</span><span class="who">' + esc(p.n) + (p.me ? ' · you' : '') + '</span>' +
      '<span class="when">' + day(p.at) + '</span></li>').join('') + '</ol>' +
      (rows.length > show.length ? '<p class="more">and ' + (rows.length - show.length) + ' more</p>' : '');
    const items = [...document.querySelectorAll('li')];
    items.forEach((li, i) => setTimeout(() => li.classList.add('on'), still ? 0 : 300 + Math.min(i, 40) * 45));
  });
}).catch(() => {
  type('The vault is sealed for now.', 'The vault is sealed for now.', () => {});
});
})();
</script>
</body>
</html>
