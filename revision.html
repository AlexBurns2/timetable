<!-- Same engine as the games page; data-page switches the grid from the
     side-scrolling shelves to one plain grid with every subject on screen. -->
<body data-page="revision">
<div class="wrap">
  <div class="pagehead">
    <div class="phtitle"><a class="sitename" href="home.html">MSC Unofficial</a><h1>Revision</h1></div>
    <div class="crumbs">
      <a class="btn icon" href="home.html" title="Home" aria-label="Home"><span data-icon="house"></span></a>
      <a class="btn icon" href="./" title="Timetable" aria-label="Timetable"><span data-icon="table"></span></a>
      <span class="volwrap" id="volwrap">
        <button class="btn icon" id="sfx" title="Sound (hold to set volume)" aria-label="Sound (hold to set volume)"><span data-icon="speaker-high"></span></button>
        <span class="volpop" id="volpop" hidden><input type="range" id="volsl" min="0" max="100" step="5" aria-label="Volume"></span>
      </span>
      <button class="btn icon" id="themebtn" title="Settings" aria-label="Settings"><span data-icon="gear"></span></button>
    </div>
  </div>

  <div class="gamesections" id="gamegrid"></div>
  <!-- unused: kept so a browser still running a cached older games.js (which reads it) doesn't error -->
  <div class="lbsum" id="lbsum" hidden></div>

  <div class="gamestage" id="gamestage" hidden>
    <button class="btn back" id="back"><span data-icon="arrow-left"></span> All subjects</button>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script src="suggest.js"></script>
<script src="games.js?v=20261114"></script>
<script src="hsc.js"></script>
<script src="hsc2.js"></script>
<script src="hsc3.js"></script>

<script src="settings.js?v=20261114"></script>
</body>
