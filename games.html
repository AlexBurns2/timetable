<!DOCTYPE html>
<html lang="en" data-skin="classic" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games — MSC Unofficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="site.css">
<style>
/* card grid */
.gamegrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gamegrid[hidden]{display:none}
.gamecard{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  background:var(--panel);border:var(--card-border);border-radius:var(--card-radius);
  padding:20px;box-shadow:var(--shadow);color:var(--text);min-height:160px;
  display:flex;flex-direction:column;gap:5px;
  opacity:0;transform:translateY(12px);
  animation:cardIn .45s cubic-bezier(.2,.7,.2,1) forwards;
  transition:transform .16s ease, box-shadow .16s ease, background .15s;
}
.gamecard:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);background:var(--panel-2)}
.gamecard:active{transform:translateY(-1px)}
.gamecard .ico{font-size:30px;line-height:1;margin-bottom:4px;
  transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.gamecard:hover .ico{transform:scale(1.15) rotate(-6deg)}
.gamecard h2{margin:0;font-family:var(--font-display);font-size:19px;
  font-weight:var(--display-w);letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
.gamecard p{margin:0;color:var(--muted);font-size:13px}
.gamecard .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent);
  opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .18s}
.gamecard:hover .go{opacity:1;transform:none}
@keyframes cardIn{to{opacity:1;transform:none}}

.gamestage{animation:stageIn .3s cubic-bezier(.2,.7,.2,1)}
.gamestage[hidden]{display:none}
@keyframes stageIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.gamegrid.leaving,.gamestage.leaving{opacity:0;transform:scale(.985);
  transition:opacity .12s ease,transform .12s ease;pointer-events:none}
.back{margin-bottom:14px}
.stage{
  background:var(--panel);border:var(--card-border);border-radius:var(--card-radius);
  padding:18px;box-shadow:var(--shadow);
}
html[data-motion="reduced"] .gamecard{animation:none;opacity:1;transform:none}
html[data-motion="reduced"] .gamestage{animation:none}
.stage h2{margin:0 0 4px;font-family:var(--font-display);font-size:20px;
  font-weight:var(--display-w);letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
.stage .how{color:var(--muted);font-size:13px;margin:0 0 14px}
.score{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;
  margin-left:auto;font-size:14px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
canvas{
  display:block;max-width:100%;height:auto;image-rendering:pixelated;
  border:1px solid var(--line);border-radius:calc(var(--card-radius) * .6);background:var(--panel-2);
}
/* 2048 */
.cell2048{background:var(--panel-2);border:1px solid var(--line);
  border-radius:calc(var(--card-radius) * .5)}
.tile2048{box-shadow:var(--shadow)}
/* card stat line */
.gamecard .stat{font-size:11px;color:var(--muted);font-family:var(--font-num);
  font-variant-numeric:tabular-nums}
.gwyou{font-size:12px;color:var(--muted);margin-bottom:10px}
.gwyou b{color:var(--text)}
/* minesweeper */
#mines{display:grid;gap:3px;width:min(360px,100%)}
#mines button{
  aspect-ratio:1;padding:0;font-family:var(--font-num);font-weight:700;font-size:14px;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  border-radius:4px;cursor:pointer;
}
#mines button.open{background:transparent;cursor:default}
#mines button.boom{background:#e5484d;color:#fff}
/* typing */
#typetext{
  font-size:17px;line-height:1.7;margin-bottom:12px;
  font-family:var(--font-num);word-spacing:.1em;
}
#typetext b{color:var(--muted);font-weight:400}
#typetext u{text-decoration:none;background:color-mix(in srgb,var(--accent) 26%,transparent);border-radius:3px}
#typetext i{color:#e5484d;font-style:normal;text-decoration:underline wavy}
#typein{
  width:100%;padding:11px 13px;border:var(--card-border);border-radius:var(--radius);
  background:var(--panel-2);color:var(--text);outline:none;
}
/* reaction */
#react{
  height:190px;border-radius:var(--card-radius);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-weight:700;font-size:17px;
  border:var(--card-border);background:var(--panel-2);color:var(--text);text-align:center;padding:16px;
}
#react.wait{background:#c2571f;color:#fff}
#react.go{background:#2f9e44;color:#fff}
/* guess who */
.gwhints{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.gwhint{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 13px;font-size:14px}
.gwhint.fresh{animation:hintIn .4s cubic-bezier(.2,.7,.2,1)}
.gwhint.win{border-color:#2f9e44;background:color-mix(in srgb,#2f9e44 14%,var(--panel))}
.gwhint.lose{border-color:#e5484d;background:color-mix(in srgb,#e5484d 12%,var(--panel))}
@keyframes hintIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.gwrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#gwin{flex:1;min-width:160px;padding:11px 13px;border:var(--card-border);border-radius:var(--radius);
  background:var(--panel-2);color:var(--text);outline:none}
#gwin:focus{border-color:var(--accent)}
.gwlog{display:flex;flex-direction:column;gap:5px}
.gwguessrow{padding:6px 11px;border-radius:var(--radius);font-size:13.5px;font-weight:600;
  animation:hintIn .25s ease}
.gwguessrow.miss{background:color-mix(in srgb,#e5484d 12%,var(--panel));color:var(--text)}
.gwguessrow.win{background:color-mix(in srgb,#2f9e44 16%,var(--panel));color:var(--text)}
html[data-motion="reduced"] .gwhint.fresh,html[data-motion="reduced"] .gwguessrow{animation:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehead">
    <h1>Games</h1>
    <div class="crumbs">
      <a class="btn" href="home.html">&#8962; Home</a>
      <a class="btn" href="./">&#8592; Timetable</a>
      <button class="btn icon" id="mode" title="Light / dark">&#9686;</button>
    </div>
  </div>

  <div class="gamegrid" id="gamegrid"></div>

  <div class="gamestage" id="gamestage" hidden>
    <button class="btn back" id="back">&#8592; All games</button>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
$('mode').onclick = () => {
  const st = TT.readState();
  const next = st.mode === 'dark' ? 'light' : 'dark';
  TT.set(TT.LS.mode, next);
  TT.apply(Object.assign(st, { mode: next }));
};

/* every game returns a cleanup fn so switching never leaves a timer running */
let stop = null;
const GAMES = [
  { id:'guesswho', ico:'🕵️', name:'Guess Who', blurb:'Work out a random classmate from hints' },
  { id:'snake',  ico:'🐍', name:'Snake', blurb:'Eat the dot, don’t bite yourself' },
  { id:'g2048',  ico:'🧩', name:'2048', blurb:'Slide and merge to the big number' },
  { id:'mines',  ico:'💣', name:'Minesweeper', blurb:'Clear the board, flag the mines' },
  { id:'typing', ico:'⌨️', name:'Typing race', blurb:'How fast can you type it?' },
  { id:'react',  ico:'🎯', name:'Reaction', blurb:'Click the moment it turns green' }
];

function showGrid(){
  if (stop){ stop(); stop = null; }
  $('gamestage').hidden = true;
  const grid = $('gamegrid');
  grid.hidden = false;
  grid.innerHTML = '';
  GAMES.forEach((g, i) => {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'gamecard';
    c.style.animationDelay = (i * 55) + 'ms';
    const stat = statLine(g.id);
    c.innerHTML = '<span class="ico">' + g.ico + '</span>' +
      '<h2>' + g.name + '</h2><p>' + g.blurb + '</p>' +
      (stat ? '<span class="stat">' + stat + '</span>' : '') +
      '<span class="go">Play &#8594;</span>';
    c.onclick = () => openGame(g.id);
    grid.appendChild(c);
  });
}
const reduced = () => document.documentElement.getAttribute('data-motion') === 'reduced';
function openGame(id){
  if (stop){ stop(); stop = null; }
  const grid = $('gamegrid'), st = $('gamestage');
  const go = () => {
    grid.hidden = true; grid.classList.remove('leaving');
    st.hidden = false;
    st.style.animation = 'none'; void st.offsetWidth; st.style.animation = '';
    stop = BUILD[id]($('stage'));
  };
  if (reduced()){ go(); return; }
  grid.classList.add('leaving');           /* fade the grid away, then swap in */
  setTimeout(go, 130);
}
$('back').onclick = () => {
  const grid = $('gamegrid'), st = $('gamestage');
  if (stop){ stop(); stop = null; }
  if (reduced()){ showGrid(); return; }
  st.classList.add('leaving');
  setTimeout(() => { st.classList.remove('leaving'); showGrid(); }, 130);
};

const head = (host, title, how, extra) =>
  host.innerHTML = '<div class="row"><div><h2>' + title + '</h2>' +
                   '<p class="how">' + how + '</p></div>' +
                   '<span class="score" id="sc"></span></div>' + (extra || '');

const BUILD = {};

/* ── Guess Who ─────────────────────────────────────────────────────
   Picks a random person from your combined classmates and drips hints
   (shared classes, year, name shape, letters). No privacy concern — it
   only ever names people already in a class with you.                 */
let gwData = null;              /* {pool, viewer} cached across opens this session */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── local stats / high scores (item 6) ──────────────────────────────
   recordStat updates a per-game record; mode 'max' keeps the highest,
   'min' the lowest, 'count' increments. statVal reads one back. */
function allStats(){ return TT.get('tt.stats', {}); }
function recordStat(game, { key, mode, value }){
  const s = allStats(); s[game] = s[game] || {};
  const cur = s[game][key];
  if (mode === 'max') s[game][key] = cur == null ? value : Math.max(cur, value);
  else if (mode === 'min') s[game][key] = cur == null ? value : Math.min(cur, value);
  else if (mode === 'count') s[game][key] = (cur || 0) + (value || 1);
  else s[game][key] = value;
  TT.set('tt.stats', s);
  return s[game][key];
}
const statVal = (game, key) => { const s = allStats()[game]; return s ? s[key] : undefined; };
const statLine = game => {
  const s = allStats()[game]; if (!s) return '';
  return Object.entries(s).map(([k,v]) => STAT_LABEL[k] ? STAT_LABEL[k]+' '+v : '').filter(Boolean).join(' · ');
};
const STAT_LABEL = { best:'Best', high:'High', fastest:'Fastest', plays:'Played', wpm:'Top WPM', cleared:'Cleared' };

const cleanSubject = name => String(name||'')
  .replace(/\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i,'')
  .replace(/^\d{1,2}\s*[A-Za-z]{2,}[A-Za-z0-9]*(?:\s+[A-Za-z]?\d{1,2})?\s+(?=\S)/,'')
  .replace(/^[\s:\-–—]+/,'').trim();
const personName = r => {
  const full = r.FullName||r.fullName||r.Name||r.name||'';
  const first = r.FirstName||r.firstName||r.GivenName||r.preferredName||'';
  const last  = r.LastName||r.lastName||r.Surname||r.surname||'';
  const mail  = r.Email||r.email||r.emailAddress||'';
  const nm = full || [first,last].filter(Boolean).join(' ');
  if (nm) return nm;
  if (mail){ const p = mail.split('@')[0].split('.');
    if (p.length>=2) return cap(p[0])+' '+cap(p[1].replace(/\d+$/,'')); }
  return '';
};
const cap = s => s ? s[0].toUpperCase()+s.slice(1).toLowerCase() : s;
/* students are @education.nsw.gov.au; staff are @det.nsw.edu.au or role-tagged */
const isStaff = r => {
  const mail = String(r.Email||r.email||r.emailAddress||'').toLowerCase();
  return /teacher|staff/i.test(r.Role||r.role||r.Type||r.type||'') ||
         /@det\.nsw\.edu\.au$/.test(mail);
};
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* pool of everyone sharing a class with the loaded timetable, plus that
   viewer's name so the game confirms whose classes it is drawn from */
async function buildPool(){
  const email = TT.myEmail();
  const tt = await TT.apiGet({ email });
  const viewer = personName({ Email: email }) || String(email).split('@')[0];
  const rows = (tt.timetable||[]).filter(r =>
    r.ClassCode && !/assembly|recess|lunch|roll/i.test((r.Period||'') + ' ' + (r.CourseName||'')));
  const codeSubject = {};
  rows.forEach(r => { codeSubject[r.ClassCode] = cleanSubject(r.CourseName) || r.ClassCode; });
  const codes = [...new Set(rows.map(r => r.ClassCode))].slice(0, 10);
  const me = String(email).toLowerCase();
  const people = new Map();
  for (const code of codes){
    let data;
    try { data = await TT.apiGet({ class: code }); } catch { continue; }
    const arr = Array.isArray(data) ? data : (data.roster || data.students || []);
    for (const r of arr){
      if (isStaff(r)) continue;
      const mail = String(r.Email||r.email||r.emailAddress||'').toLowerCase();
      const name = personName(r);
      if (!name || (mail && mail === me)) continue;
      const key = mail || name.toLowerCase();
      if (!people.has(key)) people.set(key,
        { name, year: String(r.Year||r.year||r.Form||r.form||'').trim(), subjects:new Set() });
      people.get(key).subjects.add(codeSubject[code]);
    }
  }
  const pool = [...people.values()].map(p => ({ name:p.name, year:p.year, subjects:[...p.subjects] }));
  return { pool, viewer };
}

BUILD.guesswho = host => {
  head(host, 'Guess Who', 'A random classmate. Guess who from the hints.', '<div id="gw"></div>');
  const box = document.getElementById('gw');
  box.innerHTML = '<p class="how">Loading your classmates…</p>';
  let alive = true;

  (async () => {
    try {
      if (!gwData) gwData = await buildPool();
      if (!alive) return;
      if (gwData.pool.length < 3){
        box.innerHTML = '<p class="how">Not enough classmates found to play. ' +
          'Open a timetable and sign in first.</p>';
        return;
      }
      play();
    } catch (err){
      if (alive) box.innerHTML = '<p class="how">Could not load classmates: ' + err.message + '</p>';
    }
  })();

  function play(){
    const pool = gwData.pool;
    const target = pool[(Math.random()*pool.length)|0];
    const names = pool.map(p => p.name).sort();
    let guesses = 0, wonlost = false;
    const first = target.name.split(' ')[0], last = target.name.split(' ').slice(1).join(' ');
    const others = pool.filter(p => p !== target);
    const classmate = shuffle(others.filter(p => p.subjects.some(s => target.subjects.includes(s))))[0];
    const someClasses = shuffle(target.subjects.slice());

    /* a shuffled mix of hint types; only ones we have data for are included */
    const hintPool = [
      () => 'They are in <b>' + target.subjects.length + '</b> of your classes.',
      () => 'One of their classes is <b>' + someClasses[0] + '</b>.',
      target.subjects.length > 1 ? () => 'They also take <b>' + someClasses[1] + '</b>.' : null,
      target.year ? () => 'They are in year/form <b>' + target.year + '</b>.' : null,
      () => 'Their first name has <b>' + first.length + '</b> letters' +
            (last ? ', surname <b>' + last.length + '</b>' : '') + '.',
      () => 'First name starts with <b>' + first[0].toUpperCase() + '</b>.',
      last ? () => 'Surname starts with <b>' + last[0].toUpperCase() + '</b>.' : null,
      classmate ? () => '<b>' + classmate.name + '</b> is in one of their classes.' : null,
      () => 'First name: <b>' + reveal(first, 0.55) + '</b>.'
    ].filter(Boolean);
    /* keep the class-count opener first, shuffle the rest */
    const hints = [hintPool[0], ...shuffle(hintPool.slice(1))];
    let level = 0;

    render();
    function render(){
      box.innerHTML =
        '<div class="gwyou">Playing from <b>' + esc(gwData.viewer) + '</b>’s classes</div>' +
        '<div class="gwhints" id="gwhints"></div>' +
        '<div class="gwrow">' +
          '<input id="gwin" list="gwlist" autocomplete="off" placeholder="Name a classmate…">' +
          '<datalist id="gwlist">' + names.map(n => '<option value="' + n.replace(/"/g,'&quot;') + '">').join('') + '</datalist>' +
          '<button class="btn primary" id="gwguess" type="button">Guess</button>' +
        '</div>' +
        '<div class="gwlog" id="gwlog"></div>';
      paintHints();
      document.getElementById('gwguess').onclick = guess;
      document.getElementById('gwin').addEventListener('keydown', e => { if (e.key==='Enter') guess(); });
      document.getElementById('gwin').focus();
    }
    function paintHints(){
      document.getElementById('gwhints').innerHTML =
        hints.slice(0, level+1).map((h,i) =>
          '<div class="gwhint' + (i===level ? ' fresh' : '') + '">' + h() + '</div>').join('');
      const left = hints.length - (level+1);
      document.getElementById('sc').textContent = wonlost ? ''
        : 'Guess ' + (guesses+1) + ' · ' + (left>0 ? left + ' hint' + (left===1?'':'s') + ' left' : 'last hint');
    }
    function guess(){
      if (wonlost) return;
      const inp = document.getElementById('gwin');
      const v = inp.value.trim();
      if (!v) return;
      guesses++;
      const right = v.toLowerCase() === target.name.toLowerCase();
      const log = document.getElementById('gwlog');
      const row = document.createElement('div');
      row.className = 'gwguessrow ' + (right ? 'win' : 'miss');
      row.textContent = (right ? '✓ ' : '✗ ') + v;
      log.prepend(row);
      inp.value = '';
      if (right){
        wonlost = true;
        recordStat('guesswho', { key:'best', mode:'min', value:guesses });
        document.getElementById('sc').textContent = 'Got them in ' + guesses + '! (best ' + statVal('guesswho','best') + ')';
        document.getElementById('gwhints').innerHTML =
          '<div class="gwhint win">It was <b>' + target.name + '</b> 🎉 — ' +
          'shared classes: ' + target.subjects.join(', ') + '.</div>';
        inp.disabled = true;
        endButton();
      } else if (level < hints.length - 1){
        level++; paintHints();
      } else {
        wonlost = true;
        document.getElementById('gwhints').innerHTML +=
          '<div class="gwhint lose">Out of hints — it was <b>' + target.name + '</b>.</div>';
        endButton();
      }
    }
    function endButton(){
      const b = document.getElementById('gwguess');
      b.textContent = 'Play again'; b.disabled = false; b.onclick = play;
    }
  }
  function reveal(word, frac){
    return [...word].map((ch,i) => (i===0 || Math.random()<frac) ? ch : '_').join(' ');
  }
  return () => { alive = false; };
};

/* ── Snake ─────────────────────────────────────────────────────── */
BUILD.snake = host => {
  head(host, 'Snake', 'Arrow keys or WASD. Eat dot, no eat snake',
       '<canvas id="cv" width="320" height="320"></canvas>');
  const ctx = $('cv').getContext('2d'), N = 16, S = 20;
  let snake = [{x:8,y:8}], dir = {x:1,y:0}, next = dir,
      food = {x:4,y:4}, score = 0, dead = false, recorded = false;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';
  const key = e => {
    const k = e.key.toLowerCase();
    const m = {arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],
               arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
    if (!m) return;
    e.preventDefault();
    if (m[0] === -dir.x && m[1] === -dir.y) return;   /* no instant reverse */
    next = {x:m[0], y:m[1]};
  };
  addEventListener('keydown', key);
  const tick = () => {
    if (dead) return;
    dir = next;
    const h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
    if (snake.some(p => p.x===h.x && p.y===h.y)){ dead = true; }
    else {
      snake.unshift(h);
      if (h.x===food.x && h.y===food.y){
        score++;
        do { food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
        while (snake.some(p => p.x===food.x && p.y===food.y));
      } else snake.pop();
    }
    if (dead && !recorded){ recorded = true; recordStat('snake', {key:'high', mode:'max', value:score}); }
    $('sc').textContent = dead ? 'Dead — score ' + score + ' (best ' + (statVal('snake','high')||score) + ') · press R'
                               : 'Score ' + score + (statVal('snake','high') ? ' · best ' + statVal('snake','high') : '');
    ctx.clearRect(0,0,320,320);
    ctx.fillStyle = css('--accent');
    snake.forEach(p => ctx.fillRect(p.x*S+1, p.y*S+1, S-2, S-2));
    ctx.fillStyle = '#e5484d';
    ctx.fillRect(food.x*S+3, food.y*S+3, S-6, S-6);
  };
  const restart = e => {
    if (e.key.toLowerCase() !== 'r' || !dead) return;
    snake=[{x:8,y:8}]; dir={x:1,y:0}; next=dir; score=0; dead=false; recorded=false;
  };
  addEventListener('keydown', restart);
  const t = setInterval(tick, 110); tick();
  return () => { clearInterval(t); removeEventListener('keydown', key); removeEventListener('keydown', restart); };
};

/* ── 2048 (animated) ───────────────────────────────────────────────
   Tiles are absolutely positioned and keep a stable id, so a move
   transitions each one to its new cell instead of teleporting.       */
BUILD.g2048 = host => {
  head(host, '2048', 'Arrow keys or WASD. Combine matching tiles.',
       '<div id="g2048wrap"><div id="g2048bg"></div><div id="g2048tiles"></div></div>');
  const CELL = 74, GAP = 8, STEP = CELL + GAP;
  const wrap = $('g2048wrap'), bg = $('g2048bg'), layer = $('g2048tiles');
  wrap.style.cssText = 'position:relative;width:' + (4*STEP-GAP) + 'px;max-width:100%;aspect-ratio:1';
  bg.style.cssText = 'position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:' + GAP + 'px';
  for (let i=0;i<16;i++){ const d=document.createElement('div'); d.className='cell2048'; bg.appendChild(d); }
  layer.style.cssText = 'position:absolute;inset:0';

  let tiles = [], score = 0, uid = 0, busy = false;
  const at = (r,c) => tiles.find(t => t.r===r && t.c===c);
  const spawn = () => {
    const free = [];
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!at(r,c)) free.push([r,c]);
    if (!free.length) return;
    const [r,c] = free[(Math.random()*free.length)|0];
    tiles.push({ id:++uid, r, c, val: Math.random()<0.9?2:4, isNew:true });
  };
  const tint = v => 'color-mix(in srgb, var(--accent) ' + Math.min(82, 10+Math.log2(v)*9) + '%, var(--panel))';
  const paint = () => {
    const seen = new Set();
    tiles.forEach(t => {
      let el = layer.querySelector('[data-id="' + t.id + '"]');
      if (!el){
        el = document.createElement('div'); el.className='tile2048'; el.dataset.id=t.id;
        el.style.cssText = 'position:absolute;width:' + CELL + 'px;height:' + CELL + 'px;'+
          'display:flex;align-items:center;justify-content:center;border-radius:calc(var(--card-radius)*.5);'+
          'font-family:var(--font-num);font-weight:700;font-size:22px;color:var(--text);'+
          'transition:transform .13s ease;will-change:transform';
        el.style.transform = 'translate(' + (t.c*STEP) + 'px,' + (t.r*STEP) + 'px)';
        layer.appendChild(el);
        if (t.isNew){ el.animate([{transform:el.style.transform+' scale(.1)',opacity:0},
                                   {transform:el.style.transform+' scale(1)',opacity:1}],
                                  {duration:130,easing:'ease'}); }
      }
      el.textContent = t.val;
      el.style.background = tint(t.val);
      el.style.fontSize = (t.val>=1000?17:t.val>=100?20:22)+'px';
      el.style.transform = 'translate(' + (t.c*STEP) + 'px,' + (t.r*STEP) + 'px)';
      if (t.pop){ el.animate([{transform:el.style.transform+' scale(1)'},
                              {transform:el.style.transform+' scale(1.18)'},
                              {transform:el.style.transform+' scale(1)'}],{duration:150,easing:'ease'}); t.pop=false; }
      seen.add(String(t.id));
    });
    layer.querySelectorAll('.tile2048').forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
    $('sc').textContent = 'Score ' + score + (statVal('g2048','high') ? ' · best ' + statVal('g2048','high') : '');
  };

  /* slide/merge one ordered line of tiles (already sorted in travel direction) */
  function collapse(lineTiles){
    let moved = false;
    const out = [];
    for (let i=0;i<lineTiles.length;i++){
      const t = lineTiles[i], nxt = lineTiles[i+1];
      if (nxt && nxt.val === t.val && !t._merged && !nxt._merged){
        t._merged = true; nxt._merged = true; nxt._gone = true;
        out.push({ keep:t, absorbed:nxt, val:t.val*2 });
        i++;                                   /* skip the absorbed one */
      } else out.push({ keep:t, val:t.val });
    }
    return out;
  }
  function move(dir){
    if (busy) return;
    const before = tiles.map(t => t.id+':'+t.r+','+t.c+'='+t.val).join('|');
    tiles.forEach(t => { t._merged=false; t._gone=false; });
    const lines = [];
    for (let k=0;k<4;k++){
      let line = tiles.filter(t => (dir==='l'||dir==='r') ? t.r===k : t.c===k);
      line.sort((a,b) => (dir==='l'||dir==='u') ? (a.c+a.r)-(b.c+b.r) : (b.c+b.r)-(a.c+a.r));
      lines.push({ k, line });
    }
    lines.forEach(({k, line}) => {
      const merged = collapse(line);
      merged.forEach((m, idx) => {
        const pos = (dir==='l'||dir==='u') ? idx : 3-idx;
        if (dir==='l'){ m.keep.r=k; m.keep.c=pos; }
        if (dir==='r'){ m.keep.r=k; m.keep.c=pos; }
        if (dir==='u'){ m.keep.c=k; m.keep.r=pos; }
        if (dir==='d'){ m.keep.c=k; m.keep.r=pos; }
        if (m.absorbed){ m.absorbed.r=m.keep.r; m.absorbed.c=m.keep.c; }   /* slide onto target */
      });
    });
    /* first move the absorbed tiles onto their target (animate), then merge values */
    paint();
    const changed = tiles.map(t => t.id+':'+t.r+','+t.c).join('|') !== before.replace(/=\d+/g,'');
    const anyGone = tiles.some(t => t._gone);
    if (!changed && !anyGone) return;
    busy = true;
    setTimeout(() => {
      tiles = tiles.filter(t => !t._gone);
      tiles.forEach(t => { if (t._merged && !t._gone){ t.val*=2; score+=t.val; t.pop=true;
        recordStat('g2048', {key:'high', mode:'max', value:score}); } });
      spawn();
      paint();
      busy = false;
      if (isOver()) $('sc').textContent = 'Game over — score ' + score + ' · best ' + statVal('g2048','high');
    }, 130);
  }
  function isOver(){
    if (tiles.length < 16) return false;
    for (const t of tiles){
      for (const [dr,dc] of [[0,1],[1,0]]){ const n=at(t.r+dr,t.c+dc); if (n && n.val===t.val) return false; }
    }
    return true;
  }
  const key = e => {
    const m = {arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',arrowdown:'d',s:'d'}[e.key.toLowerCase()];
    if (!m) return; e.preventDefault(); move(m);
  };
  addEventListener('keydown', key);
  spawn(); spawn(); paint();
  return () => removeEventListener('keydown', key);
};

/* ── Minesweeper ───────────────────────────────────────────────── */
BUILD.mines = host => {
  head(host, 'Minesweeper', 'Click to open, right-click to flag. 9×9, 10 mines.',
       '<div id="mines"></div>');
  const N = 9, MINES = 10;
  const grid = $('mines');
  grid.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
  let bomb = [], open = [], flag = [], over = false, first = true;
  const idx = (r,c) => r*N+c;
  const around = i => {
    const r = (i/N)|0, c = i%N, out = [];
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      const nr=r+dr, nc=c+dc;
      if ((dr||dc) && nr>=0 && nr<N && nc>=0 && nc<N) out.push(idx(nr,nc));
    }
    return out;
  };
  const seed = safe => {
    bomb = Array(N*N).fill(false);
    let placed = 0;
    while (placed < MINES){
      const i = (Math.random()*N*N)|0;
      if (bomb[i] || i === safe) continue;
      bomb[i] = true; placed++;
    }
  };
  const dig = i => {
    if (over || open[i] || flag[i]) return;
    if (first){ seed(i); first = false; }
    open[i] = true;
    if (bomb[i]){ over = true; paint(); $('sc').textContent = 'Boom — click any square to restart'; return; }
    if (around(i).filter(j => bomb[j]).length === 0) around(i).forEach(dig);
  };
  const paint = () => {
    grid.innerHTML = '';
    for (let i=0;i<N*N;i++){
      const b = document.createElement('button');
      if (open[i]){
        b.className = bomb[i] ? 'open boom' : 'open';
        const n = bomb[i] ? '💣' : (around(i).filter(j=>bomb[j]).length || '');
        b.textContent = n;
      } else b.textContent = flag[i] ? '🚩' : '';
      b.onclick = () => { if (over) return reset(); dig(i); paint(); check(); };
      b.oncontextmenu = e => { e.preventDefault(); if (!open[i] && !over){ flag[i]=!flag[i]; paint(); } };
      grid.appendChild(b);
    }
  };
  const check = () => {
    if (over) return;
    const opened = open.filter(Boolean).length;
    if (opened === N*N - MINES){ over = true;
      recordStat('mines', {key:'cleared', mode:'count', value:1});
      $('sc').textContent = 'Cleared! (' + statVal('mines','cleared') + ' total)'; }
    else $('sc').textContent = (N*N - MINES - opened) + ' left';
  };
  const reset = () => { open=[]; flag=[]; over=false; first=true; paint(); check(); };
  reset();
  return () => {};
};

/* ── Typing race ───────────────────────────────────────────────── */
BUILD.typing = host => {
  head(host, 'Typing race', 'The clock starts on your first keystroke.',
       '<div id="typetext"></div><input id="typein" autocomplete="off" spellcheck="false" placeholder="Start typing…">');
  const LINES = [
    'the quick brown fox jumps over the lazy dog',
    'never trust a computer you cannot throw out a window',
    'a room without books is like a body without a soul',
    'simplicity is the ultimate sophistication'
  ];
  let target = LINES[(Math.random()*LINES.length)|0], started = 0, done = false;
  const paint = val => {
    $('typetext').innerHTML = [...target].map((ch,i) => {
      const c = ch === ' ' ? '&nbsp;' : ch;
      if (i >= val.length) return '<b>' + c + '</b>';
      return val[i] === ch ? '<u>' + c + '</u>' : '<i>' + c + '</i>';
    }).join('');
  };
  const onInput = () => {
    const v = $('typein').value;
    if (!started && v.length) started = Date.now();
    paint(v);
    if (!done && v === target){
      done = true;
      const secs = (Date.now() - started) / 1000;
      const wpm = Math.round((target.split(' ').length / secs) * 60);
      recordStat('typing', {key:'wpm', mode:'max', value:wpm});
      $('sc').textContent = wpm + ' wpm in ' + secs.toFixed(1) + 's · top ' + statVal('typing','wpm');
      $('typein').disabled = true;
    } else if (!done){
      const wrong = [...v].filter((ch,i) => ch !== target[i]).length;
      $('sc').textContent = wrong ? wrong + ' wrong' : v.length + '/' + target.length;
    }
  };
  $('typein').addEventListener('input', onInput);
  paint(''); $('sc').textContent = '0/' + target.length;
  return () => {};
};

/* ── Reaction test ─────────────────────────────────────────────── */
BUILD.react = host => {
  head(host, 'Reaction', 'Best of five.',
       '<div id="react">Click to start</div>');
  const el = $('react');
  let state = 'idle', t = null, at = 0, times = [];
  const show = (cls, text) => { el.className = cls; el.textContent = text; };
  const arm = () => {
    show('wait', 'Wait for green…');
    state = 'wait';
    t = setTimeout(() => { state = 'go'; at = Date.now(); show('go', 'CLICK'); },
                   900 + Math.random()*2200);
  };
  el.onclick = () => {
    if (state === 'idle'){ arm(); return; }
    if (state === 'wait'){ clearTimeout(t); state = 'idle'; show('', 'Too soon — click to retry'); return; }
    if (state === 'go'){
      const ms = Date.now() - at;
      times.push(ms);
      const avg = Math.round(times.reduce((a,b)=>a+b,0) / times.length);
      recordStat('react', {key:'fastest', mode:'min', value:ms});
      $('sc').textContent = ms + ' ms · avg ' + avg + ' · fastest ' + statVal('react','fastest');
      if (times.length >= 5){
        state = 'idle'; times = [];
        show('', ms + ' ms — done. Click to go again');
      } else { state = 'idle'; setTimeout(arm, 700); show('', ms + ' ms'); }
    }
  };
  return () => clearTimeout(t);
};
