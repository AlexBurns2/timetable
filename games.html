<script>
/* In a Games module on the beta page (/beta/, in its frame #gmframe): that page's colours,
   type and corners on the module's own colour, like hkmahjong.html. The parent calls the
   look function again whenever its look changes. */
if (window.frameElement && (window.frameElement.id === 'gmframe' || new URLSearchParams(location.search).has('beta'))) {
  const root = document.documentElement;
  window.betaLook = () => {
    const top = parent.document.documentElement, cs = parent.getComputedStyle(top), box = parent.document.querySelector('.gmstage');
    const v = k => cs.getPropertyValue(k).trim(), font = parent.getComputedStyle(parent.document.body).fontFamily;
    const mode = top.dataset.mode === 'dark' ? 'dark' : 'light', r = top.hasAttribute('data-square') ? '0' : '10px';
    const set = { '--bg': box ? parent.getComputedStyle(box).backgroundColor : v('--bg'), '--bg-img': 'none', '--panel': v('--base') || v('--bg'), '--panel-2': v('--fill'), '--line': v('--fill2'),
      '--text': v('--fg'), '--muted': v('--fg2'), '--accent': v('--blue'), '--accent-ink': '#fff', '--font-ui': font, '--font-display': font, '--font-num': font,
      '--radius': r, '--card-radius': r, '--card-border': '0 solid transparent', '--shadow': 'none', '--shadow-hi': 'none', '--display-w': '600', '--display-ls': '0', '--display-tt': 'none', 'color-scheme': mode };
    /* a stylesheet, not inline: theme.js clears inline colours whenever it reapplies the site's skin */
    const sheet = document.getElementById('betaLook') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'betaLook' }));
    sheet.textContent = `html.beta{${Object.entries(set).map(([k, val]) => `${k}:${val}!important`).join(';')}}`;
    /* the plain skin in the beta page's light or dark, whatever the main site is set to */
    if (root.dataset.skin !== 'plain') root.dataset.skin = 'plain';
    if (root.dataset.mode !== mode) root.dataset.mode = mode;
  };
  window.andreLook = window.betaLook;          // the older name the beta page still calls; drop once it calls betaLook()
  root.classList.add('beta'); betaLook();
  new MutationObserver(betaLook).observe(root, { attributes: true, attributeFilter: ['data-skin', 'data-mode'] });
  /* stays hidden on the module's colour until it has really painted */
  addEventListener('load', () => {
    const show = () => { frameElement.style.visibility = ''; };
    requestAnimationFrame(() => requestAnimationFrame(show));
    setTimeout(show, 400);      /* animation frames wait while the tab is hidden */
  });
  addEventListener('pagehide', () => { frameElement.style.visibility = 'hidden'; });
}
</script>
<style>
html.beta,html.beta body{background:var(--bg)!important;background-image:none!important;font-family:var(--font-ui)}      /* even with the site's Zen mode */
html.beta{scrollbar-color:var(--line) transparent}
html.beta .wrap{padding:8px 12px 24px}
html.beta .stage{background:none;box-shadow:none}
/* the board in the middle of the module, with its controls and leaderboard under it */
html.beta :is(#g2048wrap,#mines,#cv,#glb){margin-inline:auto}
html.beta :is(#snmodes,.minesbar,.minesfoot){justify-content:center}
</style>

<div class="wrap">

    <div class="crumbs">
      <a class="btn icon" href="home.html" title="Home" aria-label="Home"><span data-icon="house"></span></a>
      <a class="btn icon" href="./" title="Timetable" aria-label="Timetable"><span data-icon="table"></span></a>
      <span class="volwrap" id="volwrap">
        <button class="btn icon" id="sfx" title="Game sound (hold to set volume)" aria-label="Game sound (hold to set volume)"><span data-icon="speaker-high"></span></button>
        <span class="volpop" id="volpop" hidden><input type="range" id="volsl" min="0" max="100" step="5" aria-label="Volume"></span>
      </span>
      <button class="btn icon" id="themebtn" title="Settings" aria-label="Settings"><span data-icon="gear"></span></button>
    </div>
  </div>

  <div class="gamesections" id="gamegrid"></div>
  <!-- unused: kept so a browser still running a cached older games.js (which reads it) doesn't error -->
  <div class="lbsum" id="lbsum" hidden></div>

  <div class="gamestage" id="gamestage" hidden>
    <button class="btn back" id="back"><span data-icon="arrow-left"></span> All games</button>
    <div class="stage" id="stage"></div>
  </div>
</div>
