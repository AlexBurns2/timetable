<!DOCTYPE html>
<html lang="en" data-skin="classic" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games — MSC Unofficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="site.css">
<style>
/* card grid */
.gamegrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gamegrid[hidden]{display:none}
.gamecard{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  background:var(--panel);border:var(--card-border);border-radius:var(--card-radius);
  padding:20px;box-shadow:var(--shadow);color:var(--text);min-height:160px;
  display:flex;flex-direction:column;gap:5px;
  opacity:0;transform:translateY(12px);
  animation:cardIn .45s cubic-bezier(.2,.7,.2,1) forwards;
  transition:transform .16s ease, box-shadow .16s ease, background .15s;
}
.gamecard:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);background:var(--panel-2)}
.gamecard:active{transform:translateY(-1px)}
.gamecard .ico{font-size:30px;line-height:1;margin-bottom:4px;
  transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.gamecard:hover .ico{transform:scale(1.15) rotate(-6deg)}
.gamecard h2{margin:0;font-family:var(--font-display);font-size:19px;
  font-weight:var(--display-w);letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
.gamecard p{margin:0;color:var(--muted);font-size:13px}
.gamecard .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent);
  opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .18s}
.gamecard:hover .go{opacity:1;transform:none}
@keyframes cardIn{to{opacity:1;transform:none}}

.gamestage{animation:stageIn .3s cubic-bezier(.2,.7,.2,1)}
.gamestage[hidden]{display:none}
@keyframes stageIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.gamegrid.leaving,.gamestage.leaving{opacity:0;transform:scale(.985);
  transition:opacity .12s ease,transform .12s ease;pointer-events:none}
.back{margin-bottom:14px}
.stage{
  background:var(--panel);border:var(--card-border);border-radius:var(--card-radius);
  padding:18px;box-shadow:var(--shadow);
}
html[data-motion="reduced"] .gamecard{animation:none;opacity:1;transform:none}
html[data-motion="reduced"] .gamestage{animation:none}
.stage h2{margin:0 0 4px;font-family:var(--font-display);font-size:20px;
  font-weight:var(--display-w);letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
.stage .how{color:var(--muted);font-size:13px;margin:0 0 14px}
.score{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;
  margin-left:auto;font-size:14px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
canvas{
  display:block;max-width:100%;height:auto;image-rendering:pixelated;
  border:1px solid var(--line);border-radius:calc(var(--card-radius) * .6);background:var(--panel-2);
}
/* 2048 */
.cell2048{background:var(--panel-2);border:1px solid var(--line);
  border-radius:calc(var(--card-radius) * .5)}
.tile2048{box-shadow:var(--shadow)}
/* card stat line */
.gamecard .stat{font-size:11px;color:var(--muted);font-family:var(--font-num);
  font-variant-numeric:tabular-nums}
.gwyou{font-size:12px;color:var(--muted);margin-bottom:10px}
.gwyou b{color:var(--text)}
/* daily past-puzzle chips */
.dgdays{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dgday{display:flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap}
.dgday:hover{border-color:var(--accent)}
.dgday.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.dgday .dgi{font-weight:700}
.dgday.won .dgi{color:#2f9e44}
.dgday.lost .dgi{color:#e5484d}
/* tetris leaderboard */
.tlb{margin-top:16px;max-width:420px}
.tlb h3{margin:0 0 8px;font-family:var(--font-display);font-size:15px;
  font-weight:var(--display-w);letter-spacing:var(--display-ls);text-transform:var(--display-tt)}
.tlbrow{display:flex;gap:10px;align-items:baseline;padding:5px 11px;border-radius:var(--radius);font-size:13.5px}
.tlbrow:nth-child(odd){background:var(--panel-2)}
.tlbrow.me{background:color-mix(in srgb,var(--accent) 18%,var(--panel));font-weight:700}
.tlbrow .rk{width:26px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.tlbrow.me .rk{color:var(--accent)}
.tlbrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlbrow .tm{font-family:var(--font-num);font-variant-numeric:tabular-nums}
/* minesweeper */
#mines{display:grid;gap:3px;width:min(360px,100%)}
#mines button{
  aspect-ratio:1;padding:0;font-family:var(--font-num);font-weight:700;font-size:14px;
  background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  border-radius:4px;cursor:pointer;
}
#mines button.open{background:transparent;cursor:default}
#mines button.boom{background:#e5484d;color:#fff}
/* typing */
#typetext{
  font-size:17px;line-height:1.7;margin-bottom:12px;
  font-family:var(--font-num);word-spacing:.1em;
}
#typetext b{color:var(--muted);font-weight:400}
#typetext u{text-decoration:none;background:color-mix(in srgb,var(--accent) 26%,transparent);border-radius:3px}
#typetext i{color:#e5484d;font-style:normal;text-decoration:underline wavy}
#typein{
  width:100%;padding:11px 13px;border:var(--card-border);border-radius:var(--radius);
  background:var(--panel-2);color:var(--text);outline:none;
}
/* reaction */
#react{
  height:190px;border-radius:var(--card-radius);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-weight:700;font-size:17px;
  border:var(--card-border);background:var(--panel-2);color:var(--text);text-align:center;padding:16px;
}
#react.wait{background:#c2571f;color:#fff}
#react.go{background:#2f9e44;color:#fff}
/* guess who */
.gwtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gwdiffs{display:flex;gap:6px;flex-wrap:wrap}
.gwdiff{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--text)}
.gwdiff[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gwtop .gwyou{margin:0 0 0 auto}
.gwhints{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.gwhint{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 13px;font-size:14px}
.gwhint.fresh{animation:hintIn .4s cubic-bezier(.2,.7,.2,1)}
.gwhint.win{border-color:#2f9e44;background:color-mix(in srgb,#2f9e44 14%,var(--panel))}
.gwhint.lose{border-color:#e5484d;background:color-mix(in srgb,#e5484d 12%,var(--panel))}
@keyframes hintIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.gwrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#gwin{flex:1;min-width:160px;padding:11px 13px;border:var(--card-border);border-radius:var(--radius);
  background:var(--panel-2);color:var(--text);outline:none}
#gwin:focus{border-color:var(--accent)}
.gwlog{display:flex;flex-direction:column;gap:5px}
.gwguessrow{padding:6px 11px;border-radius:var(--radius);font-size:13.5px;font-weight:600;
  animation:hintIn .25s ease}
.gwguessrow.miss{background:color-mix(in srgb,#e5484d 12%,var(--panel));color:var(--text)}
.gwguessrow.win{background:color-mix(in srgb,#2f9e44 16%,var(--panel));color:var(--text)}
html[data-motion="reduced"] .gwhint.fresh,html[data-motion="reduced"] .gwguessrow{animation:none}
/* classroom */
#crin{flex:1;min-width:160px;padding:11px 13px;border:var(--card-border);border-radius:var(--radius);
  background:var(--panel-2);color:var(--text);outline:none}
#crin:focus{border-color:var(--accent)}
.crq{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;text-align:center}
.crprog{font-size:12px;color:var(--muted,var(--text));opacity:.7;margin-bottom:6px}
.crsub{font-size:22px;font-weight:700}
.crmeta{font-size:13px;opacity:.75;margin-top:4px}
/* six degrees */
.chhead{margin-bottom:10px}
.chtarget{font-size:16px}
.chyr{font-size:12px;opacity:.7}
.chmeta{font-size:12.5px;opacity:.75;margin-top:3px}
.chtrail{font-size:13px;opacity:.85;margin-bottom:12px;word-break:break-word}
.chopts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.chopt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 14px;color:var(--text);cursor:pointer;font-size:14px}
.chopt:hover{border-color:var(--accent)}
.chopt em{font-style:normal;font-size:12px;opacity:.65;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehead">
    <h1>Games</h1>
    <div class="crumbs">
      <a class="btn" href="home.html">&#8962; Home</a>
      <a class="btn" href="./">&#8592; Timetable</a>
      <button class="btn icon" id="mode" title="Light / dark">&#9686;</button>
    </div>
  </div>

  <div class="gamegrid" id="gamegrid"></div>

  <div class="gamestage" id="gamestage" hidden>
    <button class="btn back" id="back">&#8592; All games</button>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
$('mode').onclick = () => {
  const st = TT.readState();
  const next = st.mode === 'dark' ? 'light' : 'dark';
  TT.set(TT.LS.mode, next);
  TT.apply(Object.assign(st, { mode: next }));
};

/* every game returns a cleanup fn so switching never leaves a timer running */
let stop = null;
const GAMES = [
  { id:'dailyguess', ico:'📅', name:'Daily Guess Who', blurb:'One mystery student from your year — same for everyone, every day' },
  { id:'guesswho', ico:'🕵️', name:'Guess Who', blurb:'Guess the mystery person — classmates, grade or teachers' },
  { id:'classroom', ico:'🚪', name:'Classroom', blurb:'Name the room each of your classes is in' },
  { id:'chain',  ico:'🔗', name:'Six Degrees', blurb:'Hop student to student through shared classes' },
  { id:'tetris', ico:'🟦', name:'Tetris', blurb:'Clear 40 lines — fixed weekly piece order, best time resets each Monday' },
  { id:'snake',  ico:'🐍', name:'Snake', blurb:'Eat the dot, don’t bite yourself' },
  { id:'g2048',  ico:'🧩', name:'2048', blurb:'Slide and merge to the big number' },
  { id:'mines',  ico:'💣', name:'Minesweeper', blurb:'Clear the board, flag the mines' },
  { id:'typing', ico:'⌨️', name:'Typing race', blurb:'How fast can you type it?' },
  { id:'react',  ico:'🎯', name:'Reaction', blurb:'Click the moment it turns green' }
];

function showGrid(){
  if (stop){ stop(); stop = null; }
  $('gamestage').hidden = true;
  const grid = $('gamegrid');
  grid.hidden = false;
  grid.innerHTML = '';
  GAMES.forEach((g, i) => {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'gamecard';
    c.style.animationDelay = (i * 55) + 'ms';
    const stat = statLine(g.id);
    c.innerHTML = '<span class="ico">' + g.ico + '</span>' +
      '<h2>' + g.name + '</h2><p>' + g.blurb + '</p>' +
      (stat ? '<span class="stat">' + stat + '</span>' : '') +
      '<span class="go">Play &#8594;</span>';
    c.onclick = () => openGame(g.id);
    grid.appendChild(c);
  });
}
const reduced = () => document.documentElement.getAttribute('data-motion') === 'reduced';
function openGame(id){
  if (stop){ stop(); stop = null; }
  const grid = $('gamegrid'), st = $('gamestage');
  const go = () => {
    grid.hidden = true; grid.classList.remove('leaving');
    st.hidden = false;
    st.style.animation = 'none'; void st.offsetWidth; st.style.animation = '';
    stop = BUILD[id]($('stage'));
  };
  if (reduced()){ go(); return; }
  grid.classList.add('leaving');           /* fade the grid away, then swap in */
  setTimeout(go, 130);
}
$('back').onclick = () => {
  const grid = $('gamegrid'), st = $('gamestage');
  if (stop){ stop(); stop = null; }
  if (reduced()){ showGrid(); return; }
  st.classList.add('leaving');
  setTimeout(() => { st.classList.remove('leaving'); showGrid(); }, 130);
};

const head = (host, title, how, extra) =>
  host.innerHTML = '<div class="row"><div><h2>' + title + '</h2>' +
                   '<p class="how">' + how + '</p></div>' +
                   '<span class="score" id="sc"></span></div>' + (extra || '');

const BUILD = {};

/* ── Guess Who ─────────────────────────────────────────────────────
   Picks a random person from your combined classmates and drips hints
   (shared classes, year, name shape, letters). No privacy concern — it
   only ever names people already in a class with you.                 */
let gwData = null;              /* {pool, viewer} cached across opens this session */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── local stats / high scores (item 6) ──────────────────────────────
   recordStat updates a per-game record; mode 'max' keeps the highest,
   'min' the lowest, 'count' increments. statVal reads one back. */
function allStats(){ return TT.get('tt.stats', {}); }
function recordStat(game, { key, mode, value }){
  const s = allStats(); s[game] = s[game] || {};
  const cur = s[game][key];
  if (mode === 'max') s[game][key] = cur == null ? value : Math.max(cur, value);
  else if (mode === 'min') s[game][key] = cur == null ? value : Math.min(cur, value);
  else if (mode === 'count') s[game][key] = (cur || 0) + (value || 1);
  else s[game][key] = value;
  TT.set('tt.stats', s);
  return s[game][key];
}
const statVal = (game, key) => { const s = allStats()[game]; return s ? s[key] : undefined; };
const statLine = game => {
  const s = allStats()[game]; if (!s) return '';
  if (game === 'tetris')                       // weekly best, hidden once the week rolls over
    return (s.week === tetrisWeek() && s.best != null) ? 'Best this week ' + s.best.toFixed(1) + 's' : '';
  return Object.entries(s).map(([k,v]) => STAT_LABEL[k] ? STAT_LABEL[k]+' '+v : '').filter(Boolean).join(' · ');
};
const STAT_LABEL = { best:'Best', high:'High', fastest:'Fastest', plays:'Played', wpm:'Top WPM', cleared:'Cleared', streak:'Streak' };

/* Monday-anchored week index (local time); drives Tetris's weekly reset */
function tetrisWeek(){
  const n = new Date();
  const day = Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(2024,0,1)) / 86400000);
  return Math.floor(day / 7);   // 2024-01-01 was a Monday
}

const cleanSubject = name => String(name||'')
  .replace(/\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i,'')
  .replace(/^\d{1,2}\s*[A-Za-z]{2,}[A-Za-z0-9]*(?:\s+[A-Za-z]?\d{1,2})?\s+(?=\S)/,'')
  .replace(/^[\s:\-–—]+/,'').trim();
const personName = r => {
  const full = r.FullName||r.fullName||r.Name||r.name||'';
  const first = r.FirstName||r.firstName||r.firstname||r.GivenName||r.preferredName||'';
  const last  = r.LastName||r.lastName||r.lastname||r.Surname||r.surname||'';
  const mail  = r.Email||r.email||r.emailAddress||'';
  const nm = full || [first,last].filter(Boolean).join(' ');
  if (nm) return nm;
  if (mail){ const p = mail.split('@')[0].split('.');
    if (p.length>=2) return cap(p[0])+' '+cap(p[1].replace(/\d+$/,'')); }
  return '';
};
const cap = s => s ? s[0].toUpperCase()+s.slice(1).toLowerCase() : s;
/* "stephen.henne@det.nsw.edu.au" / "HENNE, Stephen" -> "Stephen Henne" */
const tidyName = t => {
  t = String(t||'').trim();
  if (!t) return '';
  if (t.includes('@')) t = t.split('@')[0];
  if (/[.,]/.test(t)) return t.split(/[.,]\s*/).filter(Boolean).map(cap).join(' ').replace(/\s+\d+/g,'').trim();
  return t;
};
/* students are @education.nsw.gov.au; staff are @det.nsw.edu.au or role-tagged */
const isStaff = r => {
  const mail = String(r.Email||r.email||r.emailAddress||'').toLowerCase();
  return /teacher|staff/i.test(r.Role||r.role||r.Type||r.type||'') ||
         /@det\.nsw\.edu\.au$/.test(mail);
};
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* pool of everyone sharing a class with the loaded timetable, plus that
   viewer's name so the game confirms whose classes it is drawn from */
async function loadGuessData(){
  const email = TT.myEmail();
  const tt = await TT.apiGet({ email });
  const viewer = personName({ Email: email }) || String(email).split('@')[0];
  const me = String(email).toLowerCase();
  const groups = (tt.profile && (tt.profile.groups || tt.profile.Groups)) || [];
  let grade = '';
  for (const g of groups){ const m = String(g).match(/(?:yr|year)\s*(\d{1,2})/i); if (m){ grade = m[1]; break; } }

  /* people who share a class with you, tagged with the subjects you share */
  const rows = (tt.timetable||[]).filter(r =>
    r.ClassCode && !/assembly|recess|lunch|roll/i.test((r.Period||'') + ' ' + (r.CourseName||'')));
  const codeSubject = {};
  rows.forEach(r => { codeSubject[r.ClassCode] = cleanSubject(r.CourseName) || r.ClassCode; });
  const codes = [...new Set(rows.map(r => r.ClassCode))].slice(0, 10);
  const cp = new Map();
  for (const code of codes){
    let data; try { data = await TT.apiGet({ class: code }); } catch { continue; }
    const arr = Array.isArray(data) ? data : (data.roster || data.students || []);
    for (const r of arr){
      if (isStaff(r)) continue;
      const mail = String(r.Email||r.email||r.emailAddress||'').toLowerCase();
      const name = personName(r);
      if (!name || (mail && mail === me)) continue;
      const key = mail || name.toLowerCase();
      if (!cp.has(key)) cp.set(key, { name, email:mail,
        year:String(r.Year||r.year||r.Form||r.form||'').replace(/\D/g,''), subjects:new Set() });
      cp.get(key).subjects.add(codeSubject[code]);
    }
  }
  const classPool = [...cp.values()].map(p => ({ name:p.name, email:p.email, year:p.year, subjects:[...p.subjects] }));

  /* one representative room / teacher / period per class, for the Classroom
     game — take the first row of each class that actually names a room */
  const rmOf  = r => String(r.RoomCode||r.RoomNumber||r.RoomName||r.Room||r.Location||'').trim();
  const tchOf = r => String(r.TeacherName||r.TeacherFullName||r.Teacher||r.StaffName||'').trim();
  const rooms = [];
  const seenRoom = new Set();
  rows.forEach(r => {
    const room = rmOf(r);
    if (!room || seenRoom.has(r.ClassCode)) return;
    seenRoom.add(r.ClassCode);
    rooms.push({ subject: codeSubject[r.ClassCode], room,
                 teacher: tidyName(tchOf(r)), period: String(r.Period||'').trim() });
  });

  return { email:me, viewer, grade, classPool, rooms, students:null, teachers:null };
}

/* the directory doesn't name its year field consistently — pull a year number
   out of whichever of the usual fields carries it (Year / Form / Grade / roll
   class / cohort), keeping only the digits so "Year 8", "8", "8B" all give 8 */
const yearOf = r => {
  const direct = String(
    r.year || r.Year || r.grade || r.Grade || r.yearGroup || r.YearGroup ||
    r.form || r.Form || r.rollClass || r.RollClass || r.RollGroup || r.rollGroup ||
    r.cohort || r.Cohort || r.stage || r.Stage || ''
  ).replace(/\D/g, '');
  if (direct) return direct;
  const gs = r.groups || r.Groups || [];       // real directory carries year here, e.g. "yr11"
  for (const g of (Array.isArray(gs) ? gs : [])){ const m = String(g).match(/(?:yr|year)\.?\s*(\d{1,2})/i); if (m) return m[1]; }
  return '';
};

/* map a raw directory record to a person */
function dirPerson(r){
  const name = personName(r);
  const mail = String(r.emailAddress||r.Email||r.email||'').toLowerCase();
  return name ? { name, email:mail, year:yearOf(r), subjects:[] } : null;
}

/* Load the whole-school student directory once. While we still have the raw
   list, find the viewer's own record so we can read their year straight from
   the directory — far more reliable than scraping it out of the profile's
   group names, which is what left "My year" empty and unplayable before. */
async function loadStudents(){
  if (gwData.students) return;
  const d = await TT.apiGet({ group:'student' });
  const all = (Array.isArray(d) ? d : (d.people || d)).map(dirPerson).filter(Boolean);
  if (!gwData.grade){
    const mine = all.find(p => p.email && p.email === gwData.email);
    if (mine && mine.year) gwData.grade = mine.year;
  }
  gwData.students = all.filter(p => p.email !== gwData.email);
}

async function poolFor(diff){
  if (diff === 'myclasses') return gwData.classPool;
  if (diff === 'teachers'){
    if (!gwData.teachers){
      const d = await TT.apiGet({ group:'teacher' });
      gwData.teachers = (Array.isArray(d)?d:(d.people||d)).map(dirPerson).filter(Boolean);
    }
    return gwData.teachers.filter(p => p.email !== gwData.email);
  }
  await loadStudents();
  if (diff === 'grade'){
    if (!gwData.grade)
      throw new Error("Couldn't work out which year you're in — try another mode.");
    return gwData.students.filter(p => p.year && p.year === gwData.grade);
  }
  return gwData.students;   /* whole school */
}

const DIFFS = [
  { id:'myclasses', name:'My classes', desc:'People in a class with you' },
  { id:'grade',     name:'My grade',   desc:'Everyone in your year' },
  { id:'school',    name:'Whole school', desc:'Any student' },
  { id:'teachers',  name:'Teachers',   desc:'Any teacher' }
];

BUILD.guesswho = host => {
  head(host, 'Guess Who', 'Guess the mystery person from the hints.', '<div id="gw"></div>');
  const box = document.getElementById('gw');
  let alive = true, diff = TT.get('tt.gwdiff', 'myclasses');

  (async () => {
    box.innerHTML = '<p class="how">Loading…</p>';
    try {
      if (!gwData) gwData = await loadGuessData();
      if (!alive) return;
      start();
    } catch (err){
      if (alive) box.innerHTML = '<p class="how">Could not load: ' + esc(err.message) + '</p>';
    }
  })();

  async function start(){
    box.innerHTML =
      '<div class="gwtop"><div class="gwdiffs" id="gwdiffs"></div>' +
      '<div class="gwyou">as <b>' + esc(gwData.viewer) + '</b></div></div>' +
      '<div id="gwbody"><p class="how">Loading people…</p></div>';
    const dd = document.getElementById('gwdiffs');
    DIFFS.forEach(d => {
      const b = document.createElement('button');
      b.type='button'; b.className='gwdiff'; b.textContent=d.name; b.title=d.desc;
      b.setAttribute('aria-pressed', String(d.id===diff));
      b.onclick = () => { diff=d.id; TT.set('tt.gwdiff',diff);
        [...dd.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b))); load(); };
      dd.appendChild(b);
    });
    load();
  }

  async function load(){
    const body = document.getElementById('gwbody');
    body.innerHTML = '<p class="how">Loading people…</p>';
    let pool;
    try { pool = await poolFor(diff); } catch(err){ body.innerHTML = '<p class="how">Could not load: '+esc(err.message)+'</p>'; return; }
    if (!alive) return;
    if (!pool || pool.length < 3){
      body.innerHTML = '<p class="how">Not enough people in this pool to play. Try another difficulty, or open a timetable first.</p>';
      return;
    }
    play(pool.slice());
  }

  function play(pool){
    const body = document.getElementById('gwbody');
    const target = pool[(Math.random()*pool.length)|0];
    const names = [...new Set(pool.map(p => p.name))].sort();
    let guesses = 0, wonlost = false;
    const first = target.name.split(' ')[0], last = target.name.split(' ').slice(1).join(' ');
    const subs = shuffle(target.subjects.slice());
    const hasClasses = target.subjects.length > 0;
    /* a classmate who shares a class the target has but that we never NAME in a
       hint, so "shares a class with X" can't overlap a class we already gave.
       (With ≤2 classes every class gets named, so there's simply no peer hint.) */
    const firstClass = subs[0];
    const namedClasses = new Set([firstClass, subs[1]].filter(Boolean));
    const peer = shuffle(pool.filter(p => p !== target &&
        p.subjects.some(s => target.subjects.includes(s) && !namedClasses.has(s))))[0];

    /* hints grouped by how much they give away; revealed weakest-first,
       shuffled within each tier, so the near-answer hints come last */
    const T = [[], [], [], []];
    if (target.year && diff !== 'grade')                    // pointless in My-grade — all one year
      T[0].push(() => 'They are in year <b>' + target.year + '</b>.');
    if (hasClasses){
      T[0].push(() => 'They are in <b>' + target.subjects.length + '</b> of your classes.');
      T[0].push(() => 'One of their classes is <b>' + firstClass + '</b>.');
      if (subs[1]) T[1].push(() => 'They also take <b>' + subs[1] + '</b>.');
    }
    /* first-name and surname length kept in separate tiers — together they give too much away */
    T[1].push(() => 'Their first name has <b>' + first.length + '</b> letters.');
    if (last) T[2].push(() => 'Their surname has <b>' + last.length + '</b> letters.');
    T[2].push(() => 'Their first name starts with <b>' + first[0].toUpperCase() + '</b>.');
    if (last) T[2].push(() => 'Their surname starts with <b>' + last[0].toUpperCase() + '</b>.');
    if (peer) T[2].push(() => 'They share a class with <b>' + peer.name + '</b>.');
    T[3].push(() => 'Their first name looks like <b>' + reveal(first, 0.5) + '</b>.');
    if (last) T[3].push(() => 'Their surname looks like <b>' + reveal(last, 0.45) + '</b>.');
    const hints = [].concat(...T.map(shuffle));
    let level = 0;

    render();
    function render(){
      body.innerHTML =
        '<div class="gwhints" id="gwhints"></div>' +
        '<div class="gwrow">' +
          '<input id="gwin" list="gwlist" autocomplete="off" placeholder="Name the mystery person…">' +
          '<datalist id="gwlist">' + names.map(n => '<option value="' + n.replace(/"/g,'&quot;') + '">').join('') + '</datalist>' +
          '<button class="btn primary" id="gwguess" type="button">Guess</button>' +
        '</div><div class="gwlog" id="gwlog"></div>';
      paintHints();
      document.getElementById('gwguess').onclick = guess;
      document.getElementById('gwin').addEventListener('keydown', e => { if (e.key==='Enter') guess(); });
      document.getElementById('gwin').focus();
    }
    function paintHints(){
      document.getElementById('gwhints').innerHTML =
        hints.slice(0, level+1).map((h,i) =>
          '<div class="gwhint' + (i===level ? ' fresh' : '') + '">' + h() + '</div>').join('');
      const leftN = hints.length - (level+1);
      document.getElementById('sc').textContent = wonlost ? ''
        : 'Guess ' + (guesses+1) + ' · ' + (leftN>0 ? leftN + ' hint' + (leftN===1?'':'s') + ' left' : 'last hint');
    }
    function guess(){
      if (wonlost) return;
      const inp = document.getElementById('gwin'), v = inp.value.trim();
      if (!v) return;
      guesses++;
      const right = v.toLowerCase() === target.name.toLowerCase();
      const row = document.createElement('div');
      row.className = 'gwguessrow ' + (right ? 'win' : 'miss');
      row.textContent = (right ? '✓ ' : '✗ ') + v;
      document.getElementById('gwlog').prepend(row);
      inp.value = '';
      if (right){
        wonlost = true;
        recordStat('guesswho', { key:'best', mode:'min', value:guesses });
        document.getElementById('sc').textContent = 'Got them in ' + guesses + '! (best ' + statVal('guesswho','best') + ')';
        document.getElementById('gwhints').innerHTML =
          '<div class="gwhint win">It was <b>' + esc(target.name) + '</b> 🎉' +
          (target.subjects.length ? ' — shares: ' + esc(target.subjects.join(', ')) : '') + '.</div>';
        inp.disabled = true; endBtn();
      } else if (level < hints.length - 1){ level++; paintHints(); }
      else { wonlost = true;
        document.getElementById('gwhints').innerHTML +=
          '<div class="gwhint lose">Out of hints — it was <b>' + esc(target.name) + '</b>.</div>';
        endBtn();
      }
    }
    function endBtn(){ const b=document.getElementById('gwguess'); b.textContent='Play again'; b.disabled=false; b.onclick=()=>play(pool); }
  }
  function reveal(word, frac){
    return [...word].map((ch,i) => (i===0 || Math.random()<frac) ? ch : '_').join(' ');
  }
  return () => { alive = false; };
};

/* ── Daily Guess Who ───────────────────────────────────────────────
   The same mystery student for everyone in your year, once a day. The
   server picks and grades — the answer never reaches the browser. One
   hint to start, one more per wrong guess. Streak counts winning days. */
BUILD.dailyguess = host => {
  head(host, 'Daily Guess Who', 'One mystery student from your year — same for everyone. Replay past days, or go Unlimited.', '<div id="dg"></div>');
  const box = document.getElementById('dg');
  let alive = true;

  const shiftISO = (d, delta) => { const x=new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+delta); return x.toISOString().slice(0,10); };
  const shortDate = d => new Date(d+'T00:00:00Z').toLocaleDateString('en-AU',{month:'short',day:'numeric',timeZone:'UTC'});

  async function loadDay(date){       // date=null → today
    box.innerHTML = '<p class="how">Loading…</p>';
    let s;
    try { s = await TT.api('/api/daily', { params: date ? { date } : {} }); }
    catch (err){ if (alive) box.innerHTML = '<p class="how">Could not load: ' + esc(err.message) + '</p>'; return; }
    if (alive) render(s);
  }
  loadDay(null);

  function render(s){
    const isToday = s.date === s.today;
    box.innerHTML =
      '<div class="gwtop"><div class="gwyou">Year <b>' + esc(s.year) + '</b> · <b>' + esc(isToday ? 'Today' : shortDate(s.date)) + '</b></div>' +
      '<div style="margin-left:auto;display:flex;gap:10px;align-items:center">' +
        '<span class="gwyou" style="margin:0">🔥 streak <b id="dgstreak">' + (s.streak||0) + '</b></span>' +
        '<button class="btn" id="dgunlimited" type="button">Unlimited →</button></div></div>' +
      '<div class="dgdays" id="dgdays"></div>' +
      '<div class="gwhints" id="dghints"></div>' +
      '<div class="gwrow" id="dgrow">' +
        '<input id="dgin" list="dglist" autocomplete="off" placeholder="Name the mystery student…">' +
        '<datalist id="dglist">' + (s.candidates||[]).map(n => '<option value="' + esc(n).replace(/"/g,'&quot;') + '">').join('') + '</datalist>' +
        '<button class="btn primary" id="dgguess" type="button">Guess</button>' +
      '</div><div class="gwlog" id="dglog"></div>';

    document.getElementById('dgunlimited').onclick = () => openGame('guesswho');
    renderDays(s);

    const hintsEl = document.getElementById('dghints');
    const cur = (s.hints || []).slice();
    const paint = fresh => hintsEl.innerHTML = cur.map((h,i) =>
      '<div class="gwhint' + (i===fresh?' fresh':'') + '">' + h + '</div>').join('');
    paint(-1);

    const sc = document.getElementById('sc');
    const setScore = st => sc.textContent = st.done ? '' : 'Guess ' + (st.guesses+1) + ' of ' + st.totalHints;
    setScore(s);
    recordStat('dailyguess', { key:'streak', mode:'set', value:s.streak||0 });

    if (s.done){ dgFinish(s, hintsEl, isToday); return; }

    const input = document.getElementById('dgin'), btn = document.getElementById('dgguess');
    async function doGuess(){
      const v = input.value.trim(); if (!v) return;
      btn.disabled = true;
      let r;
      try { r = await TT.api('/api/daily', { method:'POST', body:{ guess:v, date:s.date } }); }
      catch(err){ if (alive){ btn.disabled = false; } return; }
      if (!alive) return;
      const row = document.createElement('div');
      row.className = 'gwguessrow ' + (r.correct ? 'win' : 'miss');
      row.textContent = (r.correct ? '✓ ' : '✗ ') + v;
      document.getElementById('dglog').prepend(row);
      input.value = '';
      if (r.nextHint){ cur.push(r.nextHint); paint(cur.length-1); }
      recordStat('dailyguess', { key:'streak', mode:'set', value:r.streak||0 });
      document.getElementById('dgstreak').textContent = r.streak||0;
      if (r.done){ dgFinish(r, hintsEl, isToday); }
      else { setScore(r); btn.disabled = false; input.focus(); }
    }
    btn.onclick = doGuess;
    input.addEventListener('keydown', e => { if (e.key==='Enter') doGuess(); });
    input.focus();
  }

  /* a chip per day for the last two weeks: ✓ won, ✗ lost, plain = unplayed */
  function renderDays(s){
    const daysEl = document.getElementById('dgdays');
    const hist = {}; (s.history||[]).forEach(h => hist[h.date] = h);
    let html = '';
    for (let i=0;i<14;i++){
      const d = shiftISO(s.today, -i), h = hist[d];
      const status = h && h.won ? 'won' : (h && h.done ? 'lost' : 'open');
      const icon = h && h.won ? '✓' : (h && h.done ? '✗' : '');
      html += '<button class="dgday ' + status + (d===s.date ? ' cur' : '') + '" data-date="' + d + '">' +
        '<span class="dgd">' + (i===0 ? 'Today' : esc(shortDate(d))) + '</span>' +
        (icon ? '<span class="dgi">' + icon + '</span>' : '') + '</button>';
    }
    daysEl.innerHTML = html;
    [...daysEl.querySelectorAll('.dgday')].forEach(b => b.onclick = () => loadDay(b.dataset.date));
  }

  function dgFinish(s, hintsEl, isToday){
    const row = document.getElementById('dgrow'); if (row) row.style.display = 'none';
    const sc = document.getElementById('sc'); if (sc) sc.textContent = '';
    const st = document.getElementById('dgstreak'); if (st) st.textContent = s.streak||0;
    const banner = document.createElement('div');
    banner.className = 'gwhint ' + (s.won ? 'win' : 'lose');
    banner.innerHTML = s.won
      ? 'You got it in <b>' + s.guesses + '</b>! It was <b>' + esc(s.answer) + '</b> 🎉'
      : 'Out of guesses — it was <b>' + esc(s.answer) + '</b>.';
    hintsEl.appendChild(banner);
    // reflect the result on the current chip without a refetch
    const chip = document.querySelector('.dgday.cur');
    if (chip){ chip.classList.remove('open','won','lost'); chip.classList.add(s.won?'won':'lost');
      let ic = chip.querySelector('.dgi'); if(!ic){ ic=document.createElement('span'); ic.className='dgi'; chip.appendChild(ic); }
      ic.textContent = s.won ? '✓' : '✗'; }
    const note = document.createElement('p');
    note.className = 'gwyou'; note.style.marginTop = '12px';
    note.innerHTML = (isToday ? 'Come back tomorrow for a new one. ' : 'Pick another day above. ') +
                     'Current streak: <b>' + (s.streak||0) + '</b>.';
    hintsEl.parentNode.insertBefore(note, hintsEl.nextSibling);
  }

  return () => { alive = false; };
};

/* ── Tetris ────────────────────────────────────────────────────────
   Sprint to 40 lines. The piece order is a deterministic 7-bag seeded
   by the week number, so it's identical for everyone and resets each
   Monday; your best clear time is kept per-week and resets with it.   */
BUILD.tetris = host => {
  head(host, 'Tetris',
    'Clear 40 lines. Fixed weekly piece order — your best time resets each Monday.',
    '<div class="row" style="align-items:flex-start;gap:16px;flex-wrap:wrap">' +
      '<canvas id="tcan" width="240" height="480"></canvas>' +
      '<div id="tside" style="min-width:150px;display:flex;flex-direction:column;gap:6px">' +
        '<div style="display:flex;gap:12px">' +
          '<div><div class="crmeta" style="margin:0">Hold</div><canvas id="thold" width="72" height="60"></canvas></div>' +
          '<div><div class="crmeta" style="margin:0">Next</div><canvas id="tnext" width="72" height="60"></canvas></div>' +
        '</div>' +
        '<div>Lines left: <b id="tlines">40</b></div>' +
        '<div>Time: <b id="ttime" style="font-variant-numeric:tabular-nums">0.0s</b></div>' +
        '<div>Best (week): <b id="tbest">—</b></div>' +
        '<div class="crmeta" style="margin-top:6px">← → move · ↑/X rotate (hold to spin)<br>Z ccw · space drop · Shift hold · P pause</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">' +
          '<button class="btn" id="tpause" type="button">Pause</button>' +
          '<button class="btn" id="trestart" type="button">Restart</button></div>' +
      '</div>' +
    '</div>' +
    '<div class="tlb" id="tlb"></div>');

  const COLS = 10, ROWS = 20, CELL = 24, TARGET = 40;
  const can = document.getElementById('tcan'), ctx = can.getContext('2d');
  const ncan = document.getElementById('tnext'), nctx = ncan.getContext('2d');
  const hcan = document.getElementById('thold'), hctx = hcan.getContext('2d');
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const SHAPES = {
    I:[[1,1,1,1]], O:[[1,1],[1,1]], T:[[0,1,0],[1,1,1]],
    S:[[0,1,1],[1,1,0]], Z:[[1,1,0],[0,1,1]], J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]]
  };
  const COLORS = { I:'#38bdf8', O:'#facc15', T:'#c084fc', S:'#4ade80', Z:'#f87171', J:'#60a5fa', L:'#fb923c' };
  const KEYS = Object.keys(SHAPES);

  /* deterministic weekly piece stream: mulberry32 seeded by the week number,
     feeding shuffled 7-bags so every player gets the same order all week */
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  // handling — DAS/ARR a touch gentler; rotate auto-repeats after a brief pause
  const GRAVITY = 750, DAS = 160, ARR = 45, ROT_DAS = 250, ROT_ARR = 130, LOCK_DELAY = 500, MAX_RESETS = 15;

  const wk = tetrisWeek();
  let rnd = mulberry32(0x9e3779b9 ^ wk);
  let bag = [];
  function nextType(){
    if (!bag.length){ bag = KEYS.slice();
      for (let i=bag.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; [bag[i],bag[j]]=[bag[j],bag[i]]; } }
    return bag.shift();
  }

  let grid, piece, nextT, hold, holdUsed, cleared, startAt, over, paused, alive = true;
  let loopId, lastTick, dropAcc = 0, pauseStart = 0;
  let moveDir = 0, dasStart = 0, arrLast = 0, dasCharged = false;
  let rotHeld = false, rotStart = 0, rotLast = 0, rotCharged = false;
  let grounded = false, lockStart = 0, lockResets = 0;

  function collides(cells, px, py){
    for (let r=0;r<cells.length;r++) for (let c=0;c<cells[r].length;c++){
      if (!cells[r][c]) continue;
      const x = px+c, y = py+r;
      if (x<0 || x>=COLS || y>=ROWS) return true;
      if (y>=0 && grid[y][x]) return true;
    }
    return false;
  }
  function rotate(cells){                 // clockwise: transpose + reverse rows
    const h=cells.length, w=cells[0].length, out=[];
    for (let c=0;c<w;c++){ out[c]=[]; for (let r=h-1;r>=0;r--) out[c].push(cells[r][c]); }
    return out;
  }
  /* Re-check whether we're resting on something and run the lock timer. A
     successful move/rotate (isAction) restarts the timer, up to MAX_RESETS —
     that's what lets you slide a piece under an overhang instead of it setting
     the instant it touches down. Falling clear of everything clears the count. */
  function updateGround(now, isAction){
    if (!collides(piece.cells, piece.x, piece.y+1)){ grounded = false; if (isAction) lockResets = 0; }
    else {
      if (!grounded){ grounded = true; lockStart = now; }
      else if (isAction && lockResets < MAX_RESETS){ lockStart = now; lockResets++; }
    }
  }
  function tryMove(dx, now){
    if (collides(piece.cells, piece.x+dx, piece.y)) return false;
    piece.x += dx; updateGround(now, true); return true;
  }
  function tryRotate(dir, now){
    const rc = dir>0 ? rotate(piece.cells) : rotate(rotate(rotate(piece.cells)));
    for (const dx of [0,-1,1,-2,2]) if (!collides(rc, piece.x+dx, piece.y)){
      piece.cells = rc; piece.x += dx; updateGround(now, true); return;
    }
  }
  function spawnFrom(type, now){
    const cells = SHAPES[type].map(r => r.slice());
    piece = { type, cells, x:(COLS-cells[0].length)>>1, y:0 };
    grounded = false; lockStart = 0; lockResets = 0; dropAcc = 0;
    if (collides(piece.cells, piece.x, piece.y)) end(false);   // block out
  }
  function spawnNext(now){ const type = nextT; nextT = nextType(); spawnFrom(type, now); }
  function doHold(now){
    if (holdUsed) return; holdUsed = true;              // one hold per piece
    const cur = piece.type;
    if (hold == null){ hold = cur; spawnNext(now); }
    else { const h = hold; hold = cur; spawnFrom(h, now); }
  }
  function hardDrop(now){ while (!collides(piece.cells, piece.x, piece.y+1)) piece.y++; commitLock(now); }
  function commitLock(now){
    piece.cells.forEach((row,r) => row.forEach((v,c) => {
      if (v && piece.y+r>=0) grid[piece.y+r][piece.x+c] = piece.type; }));
    let lines = 0;
    for (let r=ROWS-1;r>=0;r--){
      if (grid[r].every(Boolean)){ grid.splice(r,1); grid.unshift(new Array(COLS).fill(null)); lines++; r++; }
    }
    if (lines){ cleared += lines; document.getElementById('tlines').textContent = Math.max(0, TARGET-cleared); }
    if (cleared >= TARGET){ end(true); return; }
    holdUsed = false;                                   // hold frees up once a piece locks
    spawnNext(now);
  }

  function end(won){
    over = true; clearInterval(loopId);
    const el = (Date.now()-startAt)/1000;
    document.getElementById('sc').textContent = won ? 'Cleared 40 in ' + el.toFixed(1) + 's!' : 'Topped out.';
    if (won){
      const s = allStats(); const t = (s.tetris && s.tetris.week===wk) ? s.tetris : { week:wk, best:null };
      if (t.best==null || el<t.best) t.best = el;
      s.tetris = { week:wk, best:t.best }; TT.set('tt.stats', s);
      document.getElementById('tbest').textContent = t.best.toFixed(1)+'s';
      submitScore(el);                       // to the shared weekly board (if signed in)
    }
    draw();
  }

  /* weekly leaderboard — shared, keyed by the same week number as the pieces */
  async function submitScore(elSec){
    if (!TT.myEmail()) return;
    try { renderLB(await TT.api('/api/tetris', { method:'POST', body:{ week:wk, timeMs: Math.round(elSec*1000) } })); }
    catch (e) {}
  }
  async function loadLB(){
    const el = document.getElementById('tlb'); if (!el) return;
    if (!TT.myEmail()){ el.innerHTML = ''; return; }
    try { renderLB(await TT.api('/api/tetris', { params:{ week: wk } })); }
    catch (e) { el.innerHTML = ''; }          // 401 / 503 → just hide it
  }
  function renderLB(d){
    const el = document.getElementById('tlb'); if (!el || !alive) return;
    const rows = (d && d.top) || [];
    if (!rows.length && (!d || d.meBest == null)){
      el.innerHTML = '<h3>This week’s top times</h3><p class="how">No times yet — set the first.</p>'; return;
    }
    let html = '<h3>This week’s top times</h3>' + rows.map((r,i) =>
      '<div class="tlbrow' + (r.you ? ' me' : '') + '"><span class="rk">' + (i+1) + '</span>' +
      '<span class="nm">' + esc(r.name) + '</span><span class="tm">' + (r.time_ms/1000).toFixed(1) + 's</span></div>').join('');
    if (d.meRank && d.meRank > rows.length)    // your row, if you're off the bottom of the top-20
      html += '<div class="tlbrow me"><span class="rk">' + d.meRank + '</span>' +
              '<span class="nm">You</span><span class="tm">' + (d.meBest/1000).toFixed(1) + 's</span></div>';
    el.innerHTML = html;
  }

  /* one time-based loop drives gravity, DAS/ARR auto-shift and the lock timer */
  function loop(){
    if (over || paused) return;
    const now = performance.now();
    const dt = Math.min(100, now - lastTick); lastTick = now;
    // horizontal auto-shift: initial delay (DAS), then repeat every ARR ms
    if (moveDir !== 0 && now - dasStart >= DAS){
      if (!dasCharged){ dasCharged = true; arrLast = now; tryMove(moveDir, now); }
      else while (now - arrLast >= ARR){ arrLast += ARR; if (!tryMove(moveDir, now)) break; }
    }
    // held rotate: one spin, a brief pause, then keep spinning
    if (rotHeld && now - rotStart >= ROT_DAS){
      if (!rotCharged){ rotCharged = true; rotLast = now; tryRotate(1, now); }
      else while (now - rotLast >= ROT_ARR){ rotLast += ROT_ARR; tryRotate(1, now); }
    }
    // gravity
    dropAcc += dt;
    while (dropAcc >= GRAVITY){ dropAcc -= GRAVITY;
      if (!collides(piece.cells, piece.x, piece.y+1)) piece.y++;
      updateGround(now, false);
    }
    if (grounded && now - lockStart >= LOCK_DELAY){ commitLock(now); if (over) return; }
    document.getElementById('ttime').textContent = ((Date.now()-startAt)/1000).toFixed(1)+'s';
    draw();
  }

  function cellPx(cx,cy,type,g){
    g.fillStyle = COLORS[type]; g.fillRect(cx+1, cy+1, CELL-2, CELL-2);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(cx+1, cy+1, CELL-2, 4);
  }
  function miniDraw(g, cv, type){
    g.clearRect(0,0,cv.width,cv.height);
    if (!type) return;
    const sh=SHAPES[type], w=sh[0].length, h=sh.length, s=15, ox=(cv.width-w*s)/2, oy=(cv.height-h*s)/2;
    sh.forEach((row,r)=>row.forEach((v,c)=>{ if(v){
      g.fillStyle=COLORS[type]; g.fillRect(ox+c*s+1,oy+r*s+1,s-2,s-2);
      g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(ox+c*s+1,oy+r*s+1,s-2,3); } }));
  }
  function draw(){
    ctx.fillStyle = cssVar('--panel-2') || '#111'; ctx.fillRect(0,0,can.width,can.height);
    ctx.strokeStyle = 'rgba(128,128,128,.15)'; ctx.lineWidth = 1;
    for (let x=0;x<=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
    for (let y=0;y<=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (grid[r][c]) cellPx(c*CELL, r*CELL, grid[r][c], ctx);
    if (piece && !over){
      // landing preview: a coloured outline where the piece will settle (no fill)
      let gy = piece.y; while (!collides(piece.cells, piece.x, gy+1)) gy++;
      ctx.strokeStyle = COLORS[piece.type]; ctx.lineWidth = 2;
      piece.cells.forEach((row,r) => row.forEach((v,c) => { if (v) ctx.strokeRect((piece.x+c)*CELL+2,(gy+r)*CELL+2,CELL-4,CELL-4); }));
      ctx.lineWidth = 1;
      piece.cells.forEach((row,r) => row.forEach((v,c) => { if (v && piece.y+r>=0) cellPx((piece.x+c)*CELL,(piece.y+r)*CELL,piece.type,ctx); }));
    }
    miniDraw(nctx, ncan, nextT);
    miniDraw(hctx, hcan, hold);
  }

  function reset(){
    grid = Array.from({length:ROWS}, () => new Array(COLS).fill(null));
    rnd = mulberry32(0x9e3779b9 ^ wk);   // same weekly piece order every attempt
    bag = []; nextT = null; hold = null; holdUsed = false; cleared = 0; over = false; paused = false;
    moveDir = 0; dasCharged = false; rotHeld = false; rotCharged = false; grounded = false; lockStart = 0; lockResets = 0; dropAcc = 0;
    startAt = Date.now(); lastTick = performance.now();
    document.getElementById('tlines').textContent = TARGET;
    document.getElementById('ttime').textContent = '0.0s';
    document.getElementById('tpause').textContent = 'Pause';
    document.getElementById('sc').textContent = '';
    const s = allStats().tetris;
    document.getElementById('tbest').textContent = (s && s.week===wk && s.best!=null) ? s.best.toFixed(1)+'s' : '—';
    nextT = nextType(); spawnNext(performance.now());
    clearInterval(loopId); loopId = setInterval(loop, 16);
    draw();
  }

  function onKey(e){
    if (over) return;
    const now = performance.now(), k = e.key;
    if (k==='ArrowLeft'){ if(!e.repeat){ moveDir=-1; dasStart=now; dasCharged=false; tryMove(-1,now); draw(); } }
    else if (k==='ArrowRight'){ if(!e.repeat){ moveDir=1; dasStart=now; dasCharged=false; tryMove(1,now); draw(); } }
    else if (k==='ArrowUp' || k==='x' || k==='X'){ if(!e.repeat){ rotHeld=true; rotStart=now; rotCharged=false; tryRotate(1,now); draw(); } }
    else if (k==='z' || k==='Z'){ if(!e.repeat){ tryRotate(-1,now); draw(); } }
    else if (k===' '){ if(!e.repeat){ hardDrop(now); draw(); } }
    else if (k==='Shift'){ if(!e.repeat){ doHold(now); draw(); } }
    else if (k==='p' || k==='P'){ if(!e.repeat) togglePause(); }
    else return;
    e.preventDefault();
  }
  function onKeyUp(e){
    const k = e.key;
    if (k==='ArrowLeft'){ if (moveDir===-1){ moveDir=0; dasCharged=false; } }
    else if (k==='ArrowRight'){ if (moveDir===1){ moveDir=0; dasCharged=false; } }
    else if (k==='ArrowUp' || k==='x' || k==='X'){ rotHeld=false; rotCharged=false; }
  }
  function togglePause(){
    if (over) return;
    paused = !paused;
    if (paused){ pauseStart = Date.now(); document.getElementById('sc').textContent = 'Paused'; }
    else { startAt += Date.now() - pauseStart; lastTick = performance.now(); document.getElementById('sc').textContent = ''; }  // don't count paused time
    document.getElementById('tpause').textContent = paused ? 'Resume' : 'Pause';
  }
  document.getElementById('tpause').onclick = togglePause;
  document.getElementById('trestart').onclick = reset;
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);

  reset();
  loadLB();
  return () => { alive = false; clearInterval(loopId);
                 document.removeEventListener('keydown', onKey);
                 document.removeEventListener('keyup', onKeyUp); };
};

/* ── Classroom ─────────────────────────────────────────────────────
   Uses the rooms from your own timetable: each round names a class and
   you type which room it runs in. Self-contained — no directory calls. */
BUILD.classroom = host => {
  head(host, 'Classroom', 'Name the room each of your classes runs in.', '<div id="cr"></div>');
  const box = document.getElementById('cr');
  let alive = true;
  (async () => {
    box.innerHTML = '<p class="how">Loading…</p>';
    try {
      if (!gwData) gwData = await loadGuessData();
      if (!alive) return;
      start();
    } catch (err){
      if (alive) box.innerHTML = '<p class="how">Could not load: ' + esc(err.message) + '</p>';
    }
  })();

  function start(){
    const rooms = (gwData.rooms || []).filter(r => r.room && r.subject);
    if (rooms.length < 3){
      box.innerHTML = '<p class="how">Your timetable doesn’t list enough rooms to play. Open your timetable first.</p>';
      return;
    }
    const allRooms = [...new Set(rooms.map(r => r.room))].sort();
    const norm = s => String(s).toLowerCase().replace(/\s+/g,'');
    let queue = shuffle(rooms.slice()), i = 0, correct = 0, history = [];

    render();
    function render(){
      if (i >= queue.length){ finish(); return; }
      const q = queue[i];
      box.innerHTML =
        '<div class="crq">' +
          '<div class="crprog">Class ' + (i+1) + ' of ' + queue.length + '</div>' +
          '<div class="crsub">' + esc(q.subject) + '</div>' +
          (q.teacher ? '<div class="crmeta">with ' + esc(q.teacher) + '</div>' : '') +
          (q.period ? '<div class="crmeta">' + esc(/^\d+$/.test(q.period) ? 'Period ' + q.period : q.period) + '</div>' : '') +
        '</div>' +
        '<div class="gwrow">' +
          '<input id="crin" list="crlist" autocomplete="off" placeholder="Room…">' +
          '<datalist id="crlist">' + allRooms.map(r => '<option value="' + esc(r) + '">').join('') + '</datalist>' +
          '<button class="btn primary" id="crgo" type="button">Check</button>' +
        '</div>' +
        '<div class="gwlog">' + history.map(h =>
          '<div class="gwguessrow ' + (h.right ? 'win' : 'miss') + '">' +
          (h.right ? '✓ ' : '✗ ') + esc(h.subject) + ' → ' + esc(h.room) + '</div>').join('') + '</div>';
      const inp = document.getElementById('crin');
      document.getElementById('crgo').onclick = check;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      inp.focus();
      document.getElementById('sc').textContent = correct + ' correct';
    }
    function check(){
      const inp = document.getElementById('crin'), v = inp.value.trim();
      if (!v) return;
      const q = queue[i];
      const right = norm(v) === norm(q.room);
      if (right) correct++;
      history.unshift({ subject:q.subject, room:q.room, right });
      i++;
      render();
    }
    function finish(){
      const best = recordStat('classroom', { key:'high', mode:'max', value:correct });
      box.innerHTML =
        '<div class="crq"><div class="crsub">' + correct + ' / ' + queue.length + '</div>' +
          '<div class="crmeta">best ' + best + '</div></div>' +
        '<div class="gwlog">' + history.map(h =>
          '<div class="gwguessrow ' + (h.right ? 'win' : 'miss') + '">' +
          (h.right ? '✓ ' : '✗ ') + esc(h.subject) + ' → ' + esc(h.room) + '</div>').join('') + '</div>' +
        '<div class="gwrow"><button class="btn primary" id="crgo" type="button">Play again</button></div>';
      document.getElementById('sc').textContent = correct + ' / ' + queue.length;
      document.getElementById('crgo').onclick = start;
    }
  }
  return () => { alive = false; };
};

/* ── Six Degrees ───────────────────────────────────────────────────
   Builds a graph of your classmates, linking any two who share one of
   your classes, then drops you on one and asks you to hop through the
   shared classes to reach a target person in as few hops as possible. */
BUILD.chain = host => {
  head(host, 'Six Degrees', 'Hop student to student through classes they share, and reach the target.', '<div id="ch"></div>');
  const box = document.getElementById('ch');
  let alive = true;
  (async () => {
    box.innerHTML = '<p class="how">Loading…</p>';
    try {
      if (!gwData) gwData = await loadGuessData();
      if (!alive) return;
      start();
    } catch (err){
      if (alive) box.innerHTML = '<p class="how">Could not load: ' + esc(err.message) + '</p>';
    }
  })();

  function start(){
    const nodes = (gwData.classPool || []).filter(p => p.subjects && p.subjects.length);
    if (nodes.length < 6){
      box.innerHTML = '<p class="how">Not enough classmates with shared classes to play. Open your timetable first.</p>';
      return;
    }
    /* link classmates who share one of your classes (same subject bucket) */
    const bySubj = new Map();
    nodes.forEach((p,i) => p.subjects.forEach(s => {
      if (!bySubj.has(s)) bySubj.set(s, []);
      bySubj.get(s).push(i);
    }));
    const adj = nodes.map(() => new Set());
    for (const arr of bySubj.values())
      for (let a=0; a<arr.length; a++) for (let b=a+1; b<arr.length; b++){
        adj[arr[a]].add(arr[b]); adj[arr[b]].add(arr[a]);
      }
    const bfs = src => {
      const dist = nodes.map(() => Infinity); dist[src] = 0;
      const q = [src];
      for (let h=0; h<q.length; h++){ const c = q[h];
        for (const n of adj[c]) if (dist[n] === Infinity){ dist[n] = dist[c]+1; q.push(n); } }
      return dist;
    };
    const rand = n => (Math.random()*n)|0;
    const sharedClass = (a,b) => nodes[a].subjects.find(s => nodes[b].subjects.includes(s));

    /* choose a start/target pair that sits 2–4 hops apart */
    let game = null;
    for (let t=0; t<80 && !game; t++){
      const target = rand(nodes.length);
      const dist = bfs(target);
      const cands = [];
      for (let i=0; i<nodes.length; i++) if (dist[i] >= 2 && dist[i] <= 4) cands.push(i);
      if (cands.length) game = { start: cands[rand(cands.length)], target, dist };
    }
    if (!game){
      box.innerHTML = '<p class="how">Couldn’t find two classmates far enough apart to make a puzzle. Try again.</p>';
      return;
    }

    let cur = game.start, steps = 0, path = [game.start], won = false;
    const par = game.dist[game.start], dist = game.dist;

    render();
    function render(){
      const nbrs = [...adj[cur]];
      const good = nbrs.filter(n => dist[n] < dist[cur]);       /* moves toward target */
      const rest = shuffle(nbrs.filter(n => dist[n] >= dist[cur]));
      let show = [...good, ...rest].slice(0, 14);
      if (nbrs.includes(game.target) && !show.includes(game.target)) show[show.length-1] = game.target;
      show = shuffle(show);
      box.innerHTML =
        '<div class="chhead">' +
          '<div class="chtarget">Reach <b>' + esc(nodes[game.target].name) + '</b>' +
            (nodes[game.target].year ? ' <span class="chyr">Yr ' + esc(nodes[game.target].year) + '</span>' : '') + '</div>' +
          '<div class="chmeta">On <b>' + esc(nodes[cur].name) + '</b> · ' + steps + ' hop' + (steps===1?'':'s') + ' · par ' + par + '</div>' +
        '</div>' +
        '<div class="chtrail">' + path.map(p => esc(nodes[p].name)).join(' → ') + '</div>' +
        '<div class="chopts" id="chopts"></div>' +
        '<div class="gwrow"><button class="btn" id="chnew" type="button">New pair</button></div>';
      const opts = document.getElementById('chopts');
      show.forEach(n => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chopt';
        b.innerHTML = '<span>' + esc(nodes[n].name) + '</span><em>via ' + esc(sharedClass(cur,n) || 'shared class') + '</em>';
        b.onclick = () => move(n);
        opts.appendChild(b);
      });
      document.getElementById('chnew').onclick = start;
      document.getElementById('sc').textContent = steps + ' hop' + (steps===1?'':'s');
    }
    function move(n){
      if (won) return;
      cur = n; steps++; path.push(n);
      if (n === game.target){
        won = true;
        recordStat('chain', { key:'cleared', mode:'count', value:1 });
        const best = recordStat('chain', { key:'best', mode:'min', value:steps });
        box.innerHTML =
          '<div class="chhead"><div class="chtarget">Reached <b>' + esc(nodes[game.target].name) + '</b> 🎉</div>' +
            '<div class="chmeta">' + steps + ' hop' + (steps===1?'':'s') + ' (par ' + par + ') · fewest ' + best + '</div></div>' +
          '<div class="chtrail">' + path.map(p => esc(nodes[p].name)).join(' → ') + '</div>' +
          '<div class="gwrow"><button class="btn primary" id="chnew" type="button">New pair</button></div>';
        document.getElementById('sc').textContent = 'Done in ' + steps + '!';
        document.getElementById('chnew').onclick = start;
        return;
      }
      render();
    }
  }
  return () => { alive = false; };
};

/* ── Snake ─────────────────────────────────────────────────────── */
BUILD.snake = host => {
  head(host, 'Snake', 'Arrow keys or WASD. Eat dot, no eat snake',
       '<canvas id="cv" width="320" height="320"></canvas>');
  const ctx = $('cv').getContext('2d'), N = 16, S = 20;
  let snake = [{x:8,y:8}], dir = {x:1,y:0}, next = dir,
      food = {x:4,y:4}, score = 0, dead = false, recorded = false;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';
  const key = e => {
    const k = e.key.toLowerCase();
    const m = {arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],
               arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
    if (!m) return;
    e.preventDefault();
    if (m[0] === -dir.x && m[1] === -dir.y) return;   /* no instant reverse */
    next = {x:m[0], y:m[1]};
  };
  addEventListener('keydown', key);
  const tick = () => {
    if (dead) return;
    dir = next;
    const h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
    if (snake.some(p => p.x===h.x && p.y===h.y)){ dead = true; }
    else {
      snake.unshift(h);
      if (h.x===food.x && h.y===food.y){
        score++;
        do { food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
        while (snake.some(p => p.x===food.x && p.y===food.y));
      } else snake.pop();
    }
    if (dead && !recorded){ recorded = true; recordStat('snake', {key:'high', mode:'max', value:score}); }
    $('sc').textContent = dead ? 'Dead — score ' + score + ' (best ' + (statVal('snake','high')||score) + ') · press R'
                               : 'Score ' + score + (statVal('snake','high') ? ' · best ' + statVal('snake','high') : '');
    ctx.clearRect(0,0,320,320);
    ctx.fillStyle = css('--accent');
    snake.forEach(p => ctx.fillRect(p.x*S+1, p.y*S+1, S-2, S-2));
    ctx.fillStyle = '#e5484d';
    ctx.fillRect(food.x*S+3, food.y*S+3, S-6, S-6);
  };
  const restart = e => {
    if (e.key.toLowerCase() !== 'r' || !dead) return;
    snake=[{x:8,y:8}]; dir={x:1,y:0}; next=dir; score=0; dead=false; recorded=false;
  };
  addEventListener('keydown', restart);
  const t = setInterval(tick, 110); tick();
  return () => { clearInterval(t); removeEventListener('keydown', key); removeEventListener('keydown', restart); };
};

/* ── 2048 (animated) ───────────────────────────────────────────────
   Tiles are absolutely positioned and keep a stable id, so a move
   transitions each one to its new cell instead of teleporting.       */
BUILD.g2048 = host => {
  head(host, '2048', 'Arrow keys or WASD. Combine matching tiles.',
       '<div id="g2048wrap"><div id="g2048bg"></div><div id="g2048tiles"></div></div>');
  const CELL = 74, GAP = 8, STEP = CELL + GAP;
  const wrap = $('g2048wrap'), bg = $('g2048bg'), layer = $('g2048tiles');
  wrap.style.cssText = 'position:relative;width:' + (4*STEP-GAP) + 'px;max-width:100%;aspect-ratio:1';
  bg.style.cssText = 'position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:' + GAP + 'px';
  for (let i=0;i<16;i++){ const d=document.createElement('div'); d.className='cell2048'; bg.appendChild(d); }
  layer.style.cssText = 'position:absolute;inset:0';

  let tiles = [], score = 0, uid = 0, busy = false;
  const at = (r,c) => tiles.find(t => t.r===r && t.c===c);
  const spawn = () => {
    const free = [];
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!at(r,c)) free.push([r,c]);
    if (!free.length) return;
    const [r,c] = free[(Math.random()*free.length)|0];
    tiles.push({ id:++uid, r, c, val: Math.random()<0.9?2:4, isNew:true });
  };
  const tint = v => 'color-mix(in srgb, var(--accent) ' + Math.min(82, 10+Math.log2(v)*9) + '%, var(--panel))';
  const paint = () => {
    const seen = new Set();
    tiles.forEach(t => {
      let el = layer.querySelector('[data-id="' + t.id + '"]');
      if (!el){
        el = document.createElement('div'); el.className='tile2048'; el.dataset.id=t.id;
        el.style.cssText = 'position:absolute;width:' + CELL + 'px;height:' + CELL + 'px;'+
          'display:flex;align-items:center;justify-content:center;border-radius:calc(var(--card-radius)*.5);'+
          'font-family:var(--font-num);font-weight:700;font-size:22px;color:var(--text);'+
          'transition:transform .13s ease;will-change:transform';
        el.style.transform = 'translate(' + (t.c*STEP) + 'px,' + (t.r*STEP) + 'px)';
        layer.appendChild(el);
        if (t.isNew){ el.animate([{transform:el.style.transform+' scale(.1)',opacity:0},
                                   {transform:el.style.transform+' scale(1)',opacity:1}],
                                  {duration:130,easing:'ease'}); }
      }
      el.textContent = t.val;
      el.style.background = tint(t.val);
      el.style.fontSize = (t.val>=1000?17:t.val>=100?20:22)+'px';
      el.style.transform = 'translate(' + (t.c*STEP) + 'px,' + (t.r*STEP) + 'px)';
      if (t.pop){ el.animate([{transform:el.style.transform+' scale(1)'},
                              {transform:el.style.transform+' scale(1.18)'},
                              {transform:el.style.transform+' scale(1)'}],{duration:150,easing:'ease'}); t.pop=false; }
      seen.add(String(t.id));
    });
    layer.querySelectorAll('.tile2048').forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
    $('sc').textContent = 'Score ' + score + (statVal('g2048','high') ? ' · best ' + statVal('g2048','high') : '');
  };

  /* slide/merge one ordered line of tiles (already sorted in travel direction) */
  function collapse(lineTiles){
    let moved = false;
    const out = [];
    for (let i=0;i<lineTiles.length;i++){
      const t = lineTiles[i], nxt = lineTiles[i+1];
      if (nxt && nxt.val === t.val && !t._merged && !nxt._merged){
        t._merged = true; nxt._merged = true; nxt._gone = true;
        out.push({ keep:t, absorbed:nxt, val:t.val*2 });
        i++;                                   /* skip the absorbed one */
      } else out.push({ keep:t, val:t.val });
    }
    return out;
  }
  function move(dir){
    if (busy) return;
    const before = tiles.map(t => t.id+':'+t.r+','+t.c+'='+t.val).join('|');
    tiles.forEach(t => { t._merged=false; t._gone=false; });
    const lines = [];
    for (let k=0;k<4;k++){
      let line = tiles.filter(t => (dir==='l'||dir==='r') ? t.r===k : t.c===k);
      line.sort((a,b) => (dir==='l'||dir==='u') ? (a.c+a.r)-(b.c+b.r) : (b.c+b.r)-(a.c+a.r));
      lines.push({ k, line });
    }
    lines.forEach(({k, line}) => {
      const merged = collapse(line);
      merged.forEach((m, idx) => {
        const pos = (dir==='l'||dir==='u') ? idx : 3-idx;
        if (dir==='l'){ m.keep.r=k; m.keep.c=pos; }
        if (dir==='r'){ m.keep.r=k; m.keep.c=pos; }
        if (dir==='u'){ m.keep.c=k; m.keep.r=pos; }
        if (dir==='d'){ m.keep.c=k; m.keep.r=pos; }
        if (m.absorbed){ m.absorbed.r=m.keep.r; m.absorbed.c=m.keep.c; }   /* slide onto target */
      });
    });
    /* first move the absorbed tiles onto their target (animate), then merge values */
    paint();
    const changed = tiles.map(t => t.id+':'+t.r+','+t.c).join('|') !== before.replace(/=\d+/g,'');
    const anyGone = tiles.some(t => t._gone);
    if (!changed && !anyGone) return;
    busy = true;
    setTimeout(() => {
      tiles = tiles.filter(t => !t._gone);
      tiles.forEach(t => { if (t._merged && !t._gone){ t.val*=2; score+=t.val; t.pop=true;
        recordStat('g2048', {key:'high', mode:'max', value:score}); } });
      spawn();
      paint();
      busy = false;
      if (isOver()) $('sc').textContent = 'Game over — score ' + score + ' · best ' + statVal('g2048','high');
    }, 130);
  }
  function isOver(){
    if (tiles.length < 16) return false;
    for (const t of tiles){
      for (const [dr,dc] of [[0,1],[1,0]]){ const n=at(t.r+dr,t.c+dc); if (n && n.val===t.val) return false; }
    }
    return true;
  }
  const key = e => {
    const m = {arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',arrowdown:'d',s:'d'}[e.key.toLowerCase()];
    if (!m) return; e.preventDefault(); move(m);
  };
  addEventListener('keydown', key);
  spawn(); spawn(); paint();
  return () => removeEventListener('keydown', key);
};

/* ── Minesweeper ───────────────────────────────────────────────── */
BUILD.mines = host => {
  head(host, 'Minesweeper', 'Click to open, right-click to flag. 9×9, 10 mines.',
       '<div id="mines"></div>');
  const N = 9, MINES = 10;
  const grid = $('mines');
  grid.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
  let bomb = [], open = [], flag = [], over = false, first = true;
  const idx = (r,c) => r*N+c;
  const around = i => {
    const r = (i/N)|0, c = i%N, out = [];
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      const nr=r+dr, nc=c+dc;
      if ((dr||dc) && nr>=0 && nr<N && nc>=0 && nc<N) out.push(idx(nr,nc));
    }
    return out;
  };
  const seed = safe => {
    bomb = Array(N*N).fill(false);
    let placed = 0;
    while (placed < MINES){
      const i = (Math.random()*N*N)|0;
      if (bomb[i] || i === safe) continue;
      bomb[i] = true; placed++;
    }
  };
  const dig = i => {
    if (over || open[i] || flag[i]) return;
    if (first){ seed(i); first = false; }
    open[i] = true;
    if (bomb[i]){ over = true; paint(); $('sc').textContent = 'Boom — click any square to restart'; return; }
    if (around(i).filter(j => bomb[j]).length === 0) around(i).forEach(dig);
  };
  const paint = () => {
    grid.innerHTML = '';
    for (let i=0;i<N*N;i++){
      const b = document.createElement('button');
      if (open[i]){
        b.className = bomb[i] ? 'open boom' : 'open';
        const n = bomb[i] ? '💣' : (around(i).filter(j=>bomb[j]).length || '');
        b.textContent = n;
      } else b.textContent = flag[i] ? '🚩' : '';
      b.onclick = () => { if (over) return reset(); dig(i); paint(); check(); };
      b.oncontextmenu = e => { e.preventDefault(); if (!open[i] && !over){ flag[i]=!flag[i]; paint(); } };
      grid.appendChild(b);
    }
  };
  const check = () => {
    if (over) return;
    const opened = open.filter(Boolean).length;
    if (opened === N*N - MINES){ over = true;
      recordStat('mines', {key:'cleared', mode:'count', value:1});
      $('sc').textContent = 'Cleared! (' + statVal('mines','cleared') + ' total)'; }
    else $('sc').textContent = (N*N - MINES - opened) + ' left';
  };
  const reset = () => { open=[]; flag=[]; over=false; first=true; paint(); check(); };
  reset();
  return () => {};
};

/* ── Typing race ───────────────────────────────────────────────── */
BUILD.typing = host => {
  head(host, 'Typing race', 'The clock starts on your first keystroke.',
       '<div id="typetext"></div><input id="typein" autocomplete="off" spellcheck="false" placeholder="Start typing…">');
  const LINES = [
    'the quick brown fox jumps over the lazy dog',
    'never trust a computer you cannot throw out a window',
    'a room without books is like a body without a soul',
    'simplicity is the ultimate sophistication'
  ];
  let target = LINES[(Math.random()*LINES.length)|0], started = 0, done = false;
  const paint = val => {
    $('typetext').innerHTML = [...target].map((ch,i) => {
      const c = ch === ' ' ? '&nbsp;' : ch;
      if (i >= val.length) return '<b>' + c + '</b>';
      return val[i] === ch ? '<u>' + c + '</u>' : '<i>' + c + '</i>';
    }).join('');
  };
  const onInput = () => {
    const v = $('typein').value;
    if (!started && v.length) started = Date.now();
    paint(v);
    if (!done && v === target){
      done = true;
      const secs = (Date.now() - started) / 1000;
      const wpm = Math.round((target.split(' ').length / secs) * 60);
      recordStat('typing', {key:'wpm', mode:'max', value:wpm});
      $('sc').textContent = wpm + ' wpm in ' + secs.toFixed(1) + 's · top ' + statVal('typing','wpm');
      $('typein').disabled = true;
    } else if (!done){
      const wrong = [...v].filter((ch,i) => ch !== target[i]).length;
      $('sc').textContent = wrong ? wrong + ' wrong' : v.length + '/' + target.length;
    }
  };
  $('typein').addEventListener('input', onInput);
  paint(''); $('sc').textContent = '0/' + target.length;
  return () => {};
};

/* ── Reaction test ─────────────────────────────────────────────── */
BUILD.react = host => {
  head(host, 'Reaction', 'Best of five.',
       '<div id="react">Click to start</div>');
  const el = $('react');
  let state = 'idle', t = null, at = 0, times = [];
  const show = (cls, text) => { el.className = cls; el.textContent = text; };
  const arm = () => {
    show('wait', 'Wait for green…');
    state = 'wait';
    t = setTimeout(() => { state = 'go'; at = Date.now(); show('go', 'CLICK'); },
                   900 + Math.random()*2200);
  };
  el.onclick = () => {
    if (state === 'idle'){ arm(); return; }
    if (state === 'wait'){ clearTimeout(t); state = 'idle'; show('', 'Too soon — click to retry'); return; }
    if (state === 'go'){
      const ms = Date.now() - at;
      times.push(ms);
      const avg = Math.round(times.reduce((a,b)=>a+b,0) / times.length);
      recordStat('react', {key:'fastest', mode:'min', value:ms});
      $('sc').textContent = ms + ' ms · avg ' + avg + ' · fastest ' + statVal('react','fastest');
      if (times.length >= 5){
        state = 'idle'; times = [];
        show('', ms + ' ms — done. Click to go again');
      } else { state = 'idle'; setTimeout(arm, 700); show('', ms + ' ms'); }
    }
  };
  return () => clearTimeout(t);
};
