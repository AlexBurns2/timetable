<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="MSCU">
  <!-- MS over CU, white on steel blue. Each row forced to 356 wide (textLength);
       a white stroke of the same colour thickens the letters into blocks and
       closes up the gaps between them. -->
  <rect width="400" height="400" fill="#3b5f82"/>
  <g font-family="Archivo Black, Arial Black, Impact, sans-serif" font-size="252" fill="#fff"
     stroke="#fff" stroke-width="7" stroke-linejoin="miter" letter-spacing="-8">
    <text x="22" y="196" textLength="356" lengthAdjust="spacingAndGlyphs">MS</text>
    <text x="22" y="378" textLength="356" lengthAdjust="spacingAndGlyphs">CU</text>
  </g>
</svg>
