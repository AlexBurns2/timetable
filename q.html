<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MSC Unofficial</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<!-- without JavaScript: straight on to the timetable after a moment -->
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
<!--
  The QR landing page. Every printed QR code points at /q/<name> (vercel.json
  rewrites that here), e.g. /q/library or /q/canteen, so each one is counted
  on its own. It notes the scan (POST /api/forum?scan=<name>: the name, the
  time, phone / tablet / computer, whether this device has scanned one before,
  whether it's already signed in to the site; nothing about who) and goes on
  to the timetable. For now that's all it does; later it can show something
  first. The counts are in the moderator page, under QR scans.
-->
<style>
html,body{margin:0;height:100%;background:#1244a3}
body{display:grid;place-items:center}
img{width:96px;height:96px;border-radius:22px;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ img{animation:none} }
</style>
</head>
<body>
<img src="/images/favicon-192.png" alt="MSC Unofficial">
<script>
(function(){
  const code = (decodeURIComponent(location.pathname.split('/q/')[1] || new URLSearchParams(location.search).get('c') || 'none')
    .toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32)) || 'none';
  let first = true, signedIn = false;
  try { first = !localStorage.getItem('msc.qrseen'); localStorage.setItem('msc.qrseen', '1'); } catch {}
  try { const c = JSON.parse(localStorage.getItem('tt.creds') || 'null'); signedIn = !!(c && c.email); } catch {}
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches, small = Math.min(screen.width, screen.height) < 600;
  const device = coarse ? (small ? 'phone' : 'tablet') : 'computer';
  const url = '/api/forum?scan=' + encodeURIComponent(code) + '&device=' + device + '&first=' + (first ? 1 : 0) + '&signedin=' + (signedIn ? 1 : 0);
  /* send it in a way that survives leaving the page, then go */
  try { if (!(navigator.sendBeacon && navigator.sendBeacon(url))) fetch(url, { method:'POST', keepalive:true }).catch(() => {}); } catch {}
  setTimeout(() => location.replace('/'), 120);
})();
</script>
</body>
</html>
