<!DOCTYPE html>
<html lang="en" data-skin="classic" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes — MSC Unofficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="site.css">
<style>
.notebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.notesel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.notesel select{
  font:inherit;font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;
  color:var(--text);background:var(--panel);border:var(--card-border);border-radius:var(--radius);
  padding:8px 12px;box-shadow:var(--shadow);cursor:pointer;max-width:min(70vw,340px);
}
.notehint{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehead">
    <h1>Notes</h1>
    <div class="crumbs">
      <a class="btn" href="home.html">&#8962; Home</a>
      <a class="btn" href="./">&#8592; Timetable</a>
      <button class="btn icon" id="mode" title="Light / dark">&#9686;</button>
    </div>
  </div>

  <div class="notebar">
    <label class="notesel">Subject <select id="subj"></select></label>
    <span class="notehint" id="subjhint"></span>
  </div>

  <textarea class="pad" id="pad" placeholder="Notes for this subject. Saved to your account and synced across devices."></textarea>
  <div class="padbar">
    <span id="padstate">Saved</span>
    <span><span id="padcount">0</span> characters &middot;
      <button class="btn" id="padclear" style="padding:5px 10px;font-size:12px">Clear subject</button></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('mode').onclick = () => {
  const st = TT.readState();
  const next = st.mode === 'dark' ? 'light' : 'dark';
  TT.set(TT.LS.mode, next);
  TT.apply(Object.assign(st, { mode: next }));
};

/* Notes are stored per subject as { subject: text } under tt.subjectnotes, which
   syncs with the rest of your settings. (The old single scratchpad lived at
   tt.notes on the device; it's migrated into "General" once.) */
const NKEY = 'tt.subjectnotes', GENERAL = 'General';
const allNotes = () => TT.get(NKEY, {}) || {};
function saveNote(subj, text){ const n = allNotes(); if (text && text.length) n[subj] = text; else delete n[subj]; TT.set(NKEY, n); }

const cleanSubject = name => String(name||'')
  .replace(/\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i,'')
  .replace(/^\d{1,2}\s*[A-Za-z]{2,}[A-Za-z0-9]*(?:\s+[A-Za-z]?\d{1,2})?\s+(?=\S)/,'')
  .replace(/^[\s:\-–—]+/,'').trim();

/* one-time migration of the old device scratchpad into General */
(function migrate(){
  const n = allNotes();
  if (n[GENERAL] == null){ let old=''; try { old = localStorage.getItem('tt.notes') || ''; } catch {}
    if (old){ n[GENERAL] = old; TT.set(NKEY, n); } }
})();

const pad = $('pad'), subjSel = $('subj');
let subjectList = [GENERAL];
let current = TT.get('tt.notesubj', GENERAL);

function paintOptions(){
  const n = allNotes();
  subjSel.innerHTML = subjectList.map(s =>
    '<option value="'+esc(s)+'">'+esc(s)+(n[s] && n[s].trim() ? ' •' : '')+'</option>').join('');
  subjSel.value = current;
}
function loadSubject(subj){
  current = subj;
  TT.set('tt.notesubj', subj);
  pad.value = allNotes()[subj] || '';
  $('padcount').textContent = pad.value.length;
  $('padstate').textContent = 'Saved';
  subjSel.value = subj;          // keep the dropdown in sync after any repaint
}
let saveTimer = null;
function flush(){ clearTimeout(saveTimer); saveNote(current, pad.value); paintOptions(); $('padstate').textContent = 'Saved'; }

async function buildSubjects(){
  let tt = null;
  const cache = TT.get('tt.cache', null);
  if (cache && cache.payload && cache.payload.timetable) tt = cache.payload;
  if (!tt && TT.myEmail()){ try { tt = await TT.apiGet({ email: TT.myEmail() }); } catch(e){} }

  const subs = new Set();
  if (tt && tt.timetable) for (const r of tt.timetable){
    if (r.ClassCode && !/assembly|recess|lunch|roll/i.test((r.Period||'') + ' ' + (r.CourseName||''))){
      const s = cleanSubject(r.CourseName); if (s) subs.add(s);
    }
  }
  subjectList = [GENERAL, ...[...subs].sort()];
  Object.keys(allNotes()).forEach(k => { if (!subjectList.includes(k)) subjectList.push(k); });  // keep notes whose class dropped off
  if (!subjectList.includes(current)) current = GENERAL;
  $('subjhint').textContent = subs.size ? '' :
    (TT.myEmail() ? 'No subjects found — open your timetable first.' : 'Sign in on the timetable to load your subjects.');
  paintOptions();
  loadSubject(current);
}

subjSel.onchange = () => { const chosen = subjSel.value; flush(); loadSubject(chosen); };
pad.addEventListener('input', () => {
  $('padcount').textContent = pad.value.length;
  $('padstate').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
});
addEventListener('pagehide', flush);
$('padclear').onclick = () => {
  if (!pad.value || !confirm('Clear notes for ' + current + '?')) return;
  pad.value = ''; $('padcount').textContent = 0; saveNote(current, ''); paintOptions(); $('padstate').textContent = 'Cleared';
};

buildSubjects();
</script>
</body>
</html>
