<!DOCTYPE html>
<html lang="en" data-skin="classic" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes — MSC Unofficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Patrick+Hand&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
  <div class="pagehead">
    <h1>Notes</h1>
    <div class="crumbs">
      <a class="btn" href="home.html">&#8962; Home</a>
      <a class="btn" href="./">&#8592; Timetable</a>
      <button class="btn icon" id="mode" title="Light / dark">&#9686;</button>
    </div>
  </div>

  <textarea class="pad" id="pad" placeholder="Anything you want to remember. Saves to this device as you type."></textarea>
  <div class="padbar">
    <span id="padstate">Saved automatically to this device</span>
    <span><span id="padcount">0</span> characters &middot;
      <button class="btn" id="padclear" style="padding:5px 10px;font-size:12px">Clear</button></span>
  </div>
</div>
<script>
document.getElementById('mode').onclick = () => {
  const st = TT.readState();
  const next = st.mode === 'dark' ? 'light' : 'dark';
  TT.set(TT.LS.mode, next);
  TT.apply(Object.assign(st, { mode: next }));
};

const pad = document.getElementById('pad');
const KEY = 'tt.notes';
try { pad.value = localStorage.getItem(KEY) || ''; } catch {}
const count = () => document.getElementById('padcount').textContent = pad.value.length;
count();
let saveTimer = null;
pad.addEventListener('input', () => {
  count();
  document.getElementById('padstate').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, pad.value); document.getElementById('padstate').textContent = 'Saved to this device'; }
    catch { document.getElementById('padstate').textContent = 'Could not save — storage is full or blocked'; }
  }, 350);
});
document.getElementById('padclear').onclick = () => {
  if (!pad.value || !confirm('Clear these notes?')) return;
  pad.value = ''; count();
  try { localStorage.removeItem(KEY); } catch {}
  document.getElementById('padstate').textContent = 'Cleared';
};

</script>
</body>
</html>
