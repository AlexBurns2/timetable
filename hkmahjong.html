<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hong Kong Mahjong</title>
<script>/* only ever a frame, on the games page (which has the focus lock) or Andre's page */ if (window.top === window) location.replace("/games.html?play=hkmj");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif&family=Orbitron:wght@500;700&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script>
/* In a Games module on Andre's page: that page's colours and type, on the module's own colour */
const ANDRE = new URLSearchParams(location.search).has('andre');
function andreLook() {
  const top = parent.document.documentElement, cs = parent.getComputedStyle(top), box = parent.document.querySelector('.gmstage');
  const v = k => cs.getPropertyValue(k).trim(), font = parent.getComputedStyle(parent.document.body).fontFamily;
  const set = { '--bg': box ? parent.getComputedStyle(box).backgroundColor : v('--bg'), '--bg-img': 'none', '--panel': v('--base') || v('--bg'), '--panel-2': v('--fill'), '--line': v('--fill2'),
    '--text': v('--fg'), '--muted': v('--fg2'), '--accent': v('--blue'), '--accent-ink': '#fff', '--font-ui': font, '--font-display': font, '--font-num': font,
    '--radius': '10px', '--card-radius': '10px', '--card-border': '0 solid transparent', '--shadow': 'none', '--shadow-hi': 'none', '--display-w': '600', '--display-ls': '0', '--display-tt': 'none' };
  /* a stylesheet, not inline: theme.js clears inline colours whenever it reapplies the site's skin */
  const sheet = document.getElementById('andreLook') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'andreLook' }));
  sheet.textContent = `html.andre{${Object.entries(set).map(([k, val]) => `${k}:${val}!important`).join(';')}}`;
}
if (ANDRE) {
  document.documentElement.classList.add('andre'); andreLook();
  /* stays hidden on the module's colour until it has really painted, and again across the reload after saved settings arrive */
  addEventListener('load', () => {
    const show = () => { frameElement.style.visibility = ''; };
    requestAnimationFrame(() => requestAnimationFrame(show));
    setTimeout(show, 400);      /* animation frames wait while the tab is hidden */
  });
  addEventListener('pagehide', () => { frameElement.style.visibility = 'hidden'; });
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E8%90%AC%E6%9D%B1%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E7%99%BC%E6%A2%85%E8%98%AD%E8%8F%8A%E7%AB%B9%E6%98%A5%E5%A4%8F%E7%A7%8B%E5%86%AC%E9%BA%BB%E9%9B%80%E6%A9%9F%E9%96%8B%E5%85%A5%E6%9B%B8&display=block" rel="stylesheet">
<style>
:root{
  --ink:var(--text); --card:var(--panel); --accent2:var(--accent); --felt:#3c7d48; --felt2:#2f6a3b; --wood:#7a4a2a; --wood2:#5c3519;
  --tileface:#fffcf3; --tileface2:#efe6cf; --tileedge:#2f9a5c;
  --tw:clamp(28px,4.1vw,56px); --to:clamp(17px,1.75vw,27px); --td:clamp(20px,2.35vw,36px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
header.top{height:54px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.2px;cursor:pointer;user-select:none}
.logo .badge{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-family:'Noto Serif TC',serif;font-weight:700;font-size:18px;background:#fff6f3}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--muted)}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#aab2bd}
.dot.ok{background:#2fb067}.dot.warn{background:#e0a020}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.iconbtn{background:none;border:1px solid transparent;border-radius:8px;padding:5px 8px;color:var(--muted)}
.iconbtn:hover{border-color:var(--line);color:var(--ink)}

main{min-height:calc(100vh - 54px)}
.screen{padding:28px 20px 40px;max-width:1100px;margin:0 auto}
.hero{text-align:center;margin:10px 0 26px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted)}
.hero .tiles{display:flex;gap:8px;justify-content:center;margin-bottom:18px;--w:46px}
.namebar{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 24px;flex-wrap:wrap}
.namebar label{color:var(--muted)}
input[type=text]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
input[type=text]:focus{outline:2px solid #9cc0f0;border-color:#7aa7e6}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--panel);border:2px solid #7ea7e0;border-radius:6px;padding:26px 16px 22px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,60,110,.14)}
.card svg{width:40px;height:40px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:12px 0 6px;font-size:21px}
.card p{margin:0;color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 22px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel h3{margin:18px 0 8px;font-size:16px}
.sub{color:var(--muted);margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 16px;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.primary:hover{background:#1d54a0}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:#23955a;border-color:#23955a;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.lvls{display:flex;gap:6px;flex-wrap:wrap}
.lvl{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px}
.lvl.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seatrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.seatrow:last-child{border-bottom:0}
.seatrow .nm{flex:1;font-weight:600}
.seatrow .nm small{font-weight:400;color:var(--muted)}
.seatno{width:30px;height:30px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-weight:700;color:var(--muted)}
select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.settings select{color:var(--ink)}
.code{font:800 44px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:8px;color:var(--accent);background:#fff6f3;border:2px dashed #f1b7b2;border-radius:10px;padding:14px 18px;display:inline-block}
.note{background:#f5f8fc;border:1px solid #dce6f3;border-radius:8px;padding:10px 12px;color:#3a4a62;font-size:13.5px;margin-top:12px}
.err{color:var(--accent);font-weight:600;margin-top:10px;min-height:1.2em}
.tag{font-size:11px;font-weight:700;letter-spacing:.1px;padding:2px 7px;border-radius:5px;background:#eef1f5;color:#556}
.tag.easy{background:#e4f6ea;color:#1f7a44}.tag.medium{background:#e6f0fc;color:#245ea8}.tag.hard{background:#fdf0dc;color:#a35a00}.tag.pro{background:#fbe3e4;color:#a31c25}
.tag.off{background:#ffe9c7;color:#8a5200}.tag.you{background:#1d2330;color:#fff}

/* ---------- Tiles ---------- */
.tile{position:relative;width:var(--w);height:calc(var(--w)*1.32);flex:none;border-radius:calc(var(--w)*.12);
  background:linear-gradient(170deg,var(--tileface),var(--tileface2));border:1px solid var(--tileborder);
  box-shadow:0 calc(var(--w)*.075) 0 var(--tileedge),0 calc(var(--w)*.1) calc(var(--w)*.12) rgba(0,0,0,.35)}
.tile svg{position:absolute;left:5%;top:4%;width:90%;height:92%}
.tile.back{background:linear-gradient(160deg,var(--back1),var(--back2));border-color:var(--backborder);box-shadow:0 calc(var(--w)*.075) 0 var(--tileface2),0 calc(var(--w)*.1) calc(var(--w)*.12) rgba(0,0,0,.35)}
.tile.dim{filter:brightness(.82) saturate(.7)}
.tile.hl{outline:3px solid #ff9d1c;outline-offset:1px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#ffd38a}}
.tile.claimed{transform:translateY(-3px)}
.tile.win{outline:3px solid #f5c400;outline-offset:1px}
.tiles{display:flex;gap:2px;align-items:flex-end}

/* ---------- Game layout ---------- */
.game{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:12px 14px;height:calc(100vh - 54px);min-height:620px}
.board{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.seat-top{display:flex;align-items:center;gap:8px 12px;justify-content:center;flex-wrap:wrap;min-height:calc(var(--to)*1.6 + 8px)}
.mid{flex:1;display:flex;gap:8px;min-height:0}
.seat-side{width:calc(var(--to)*4.2 + 16px);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;overflow:hidden}
.plate{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(#8a5631,#6a3e1f);color:#fff;border:2px solid #4b2a12;border-radius:6px;padding:4px 9px;font-weight:600;white-space:nowrap;max-width:100%;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.plate .pn{overflow:hidden;text-overflow:ellipsis;max-width:130px}
.plate .wb{background:#fffcf3;color:#1f2340;border-radius:4px;font-family:'Noto Serif TC',serif;font-weight:700;padding:0 4px;font-size:15px;box-shadow:0 2px 0 var(--tileedge)}
.plate .psc{background:rgba(0,0,0,.25);border-radius:4px;padding:0 6px;font-variant-numeric:tabular-nums}
.plate.turn{border-color:#ffc54d;box-shadow:0 0 0 3px rgba(255,197,77,.55),0 2px 5px rgba(0,0,0,.25)}
.plate .dealer{color:#ffd76a;font-size:12px}
.seat-side .plate{flex-direction:column;gap:3px;padding:5px 6px}
.vstack{display:flex;flex-direction:column;align-items:center}
.vback{width:calc(var(--to)*1.35);height:calc(var(--to)*.62);border-radius:3px;background:linear-gradient(var(--back1),var(--back2));border:1px solid var(--backborder);box-shadow:0 2px 0 var(--tileface2);margin-bottom:1px}
.melds{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;--w:var(--to)}
.seat-side .melds{flex-direction:column;align-items:center;gap:4px}
.meld{display:flex;gap:1px}
.flw{display:flex;gap:2px;flex-wrap:wrap;--w:calc(var(--to)*.85);justify-content:center}
.felt{flex:1;position:relative;border-radius:10px;border:10px solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood2),inset 0 0 40px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25);
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.08),transparent 60%),repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.025) 0 2px,transparent 2px 4px),var(--felt);
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto 1fr;grid-template-areas:". top ." "left center right" ". bottom .";gap:8px;padding:10px;min-height:0;overflow:hidden}
.pool{display:flex;flex-wrap:wrap;gap:3px 2px;--w:var(--td);align-content:flex-start}
.pool-top{grid-area:top;transform:rotate(180deg);max-width:calc(var(--td)*9.6);align-self:end}
.pool-bottom{grid-area:bottom;max-width:calc(var(--td)*9.6);align-self:start}
.pool-left{grid-area:left;justify-self:end;align-self:center;max-width:calc(var(--td)*4.5);flex-direction:row-reverse}
.pool-right{grid-area:right;justify-self:start;align-self:center;max-width:calc(var(--td)*4.5)}
.center{grid-area:center;align-self:center;justify-self:center;width:clamp(130px,15vw,190px);background:linear-gradient(#e7c79a,#d3ad78);border:4px solid #8b5a2b;border-radius:8px;box-shadow:inset 0 0 12px rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.3);padding:10px;text-align:center;color:#3b2410;position:relative}
.center .cw{font-family:'Noto Serif TC',serif;font-size:30px;font-weight:700;line-height:1}
.center .ci{font-size:12.5px;font-weight:600}
.center .wall{font-size:19px;font-weight:800;margin-top:4px}
.center .arrow{position:absolute;font-size:18px;color:#ffcf4a;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.arrow.p0{bottom:-26px;left:50%;transform:translateX(-50%)}
.arrow.p1{right:-24px;top:50%;transform:translateY(-50%)}
.arrow.p2{top:-26px;left:50%;transform:translateX(-50%)}
.arrow.p3{left:-24px;top:50%;transform:translateY(-50%)}
.timerbar{height:5px;background:rgba(0,0,0,.15);border-radius:3px;margin-top:6px;overflow:hidden}
.timerbar i{display:block;height:100%;background:#c8202a;width:0}
.ttext{font-size:12px;font-weight:700;margin-top:2px}

.mine{display:flex;flex-direction:column;gap:6px}
.actions{min-height:46px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.actions .msg{color:var(--muted);font-weight:600;margin-right:4px}
.actions .msg b{color:var(--ink)}
.act{border:0;border-radius:8px;padding:8px 14px;font-weight:700;color:#fff;background:#4a5568;display:inline-flex;align-items:center;gap:6px}
.act.win{background:linear-gradient(#e83a3a,#b71d24);box-shadow:0 0 0 3px rgba(232,58,58,.25)}
.act.kong{background:#7b3fb8}.act.pung{background:#c76a00}.act.chow{background:#1f7a9c}.act.pass{background:#8a94a3}.act.disc{background:#2563b8}
.act:disabled{opacity:.4;cursor:default}
.act .tiles{--w:16px}
.mtimer{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.rack{display:flex;align-items:flex-end;gap:14px;background:linear-gradient(#d7b07c,#b98b55);border:3px solid #7a4a2a;border-radius:8px;padding:18px 12px 12px;min-height:calc(var(--tw)*1.32 + 34px);overflow-x:auto}
.rack .melds{--w:calc(var(--tw)*.72)}
.hand{display:flex;gap:3px;align-items:flex-end;--w:var(--tw)}
.hand .tile{cursor:pointer;transition:transform .08s}
.hand.active .tile:hover{transform:translateY(-5px)}
.hand .tile.sel{transform:translateY(-12px)!important;box-shadow:0 calc(var(--w)*.075) 0 var(--tileedge),0 0 0 3px #2563b8,0 10px 16px rgba(0,0,0,.35)}
.drawn{--w:var(--tw);margin-left:8px}
.myinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hints{font-size:13px;color:#2d3a4d;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px}
.hints .tiles{--w:17px}
.hints .bad{opacity:.45}

.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:11px 2px;white-space:nowrap;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent2);border-bottom-color:var(--accent2);font-weight:600}
.tabbody{padding:14px;overflow:auto;flex:1;min-height:0}
.scores{width:100%;border-collapse:collapse;margin:8px 0}
.scores td{padding:5px 4px;border-bottom:1px solid #f0f2f5}
.scores td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.kv b{color:var(--ink)}
.log{font-size:13px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.log .k-h{font-weight:700;color:var(--accent2)}.log .k-c{color:#7b3fb8}.log .k-w{font-weight:700;color:var(--accent)}
.chatlog{font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.chatlog b{color:var(--accent2)}
.chatform{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chatform input{flex:1}
.reftable{width:100%;border-collapse:collapse;font-size:13px}
.reftable td,.reftable th{padding:4px 4px;border-bottom:1px solid #f0f2f5;text-align:left;vertical-align:top}
.reftable td:last-child,.reftable th:last-child{text-align:right;white-space:nowrap}
.reftable th{color:var(--muted);font-weight:600}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 4px}
.wintiles{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:14px 0;--w:36px;background:var(--panel-2);border-radius:8px;padding:12px}
.wintiles .meld{gap:1px}
.wintiles .tile.claimed{transform:none}
.wintiles .tiles{gap:1px}
.faanrow{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f0f2f5}
.faantotal{display:flex;justify-content:space-between;padding:8px 0;font-weight:800;font-size:17px}
.pays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pay{background:var(--panel-2);border-radius:8px;padding:8px;text-align:center}
.pay .v{font-weight:800;font-size:17px}
.pay .v.pos{color:#1f8a4c}.pay .v.neg{color:var(--accent)}
.otherhands{margin-top:14px;font-size:13px;color:var(--muted)}
.otherhands .oh{display:flex;align-items:center;gap:8px;margin:5px 0;--w:20px}
.otherhands .oh span{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guide h3{margin:16px 0 6px}
.guide p,.guide li{color:var(--text)}

@media (max-width:980px){
  .cards{grid-template-columns:1fr 1fr}
  .game{grid-template-columns:1fr;height:auto}
  .side{min-height:360px}
  .felt{min-height:340px}
  :root{--tw:clamp(22px,6vw,46px)}
}
@media (max-width:600px){
  :root{--to:13px;--td:19px;--tw:min(30px,calc((100vw - 58px) / 14.6))}
  .hand{gap:1px}
  .status,.who span:first-child{display:none}
  .logo{font-size:15px}
  header.top{gap:10px;padding:0 10px}
  .game{padding:8px}
  .seat-side .plate .pn{max-width:58px;font-size:12px}
  .plate{font-size:13px;padding:3px 6px}
  .rack{flex-wrap:wrap;gap:8px}
  .hand{flex-wrap:wrap}
  .felt{border-width:6px;padding:6px}
  .center{width:110px;padding:6px}.center .cw{font-size:22px}.center .wall{font-size:15px}
  .grid2,.settings{grid-template-columns:1fr}
  .seat-side{width:calc(var(--to)*2.6)}
  .pays{grid-template-columns:1fr 1fr}
  .nav{display:none}
}

/* appearance + guide */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.theme{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--panel);text-align:left}
.theme:hover{border-color:#9db8e0}
.theme.on{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(37,99,184,.18)}
.theme .tiles{--w:28px;gap:3px;margin-bottom:8px;padding:8px;border-radius:7px;background:var(--felt)}

/* ===== Parlour look (overrides) ===== */
:root{--jade-night:var(--bg);--jade:var(--accent);--jade-soft:var(--panel-2);--lacquer:var(--accent);--lacquer-dark:color-mix(in srgb,var(--accent) 78%,#000);--brass:var(--line);--paper:var(--panel)}
html,body{font-family:var(--font-ui);background-color:var(--jade-night);
  background-image:linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%),linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%);

:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.status{color:#a9c9bb}.who{color:#cfe5da}.iconbtn{color:#cfe5da}.iconbtn:hover{border-color:rgba(255,255,255,.25);color:#fff}
.btn{border-radius:6px;border:1.5px solid #cfc5ad;background:var(--paper);font-weight:700}

.btn.primary,.btn.red{background:var(--lacquer);border-color:var(--lacquer-dark);color:#fff;box-shadow:0 2px 0 var(--lacquer-dark)}
.btn.primary:hover,.btn.red:hover{background:#d61a39}
.btn.small{padding:6px 12px;font-size:14px}
.panel{background:var(--paper);border:0;border-top:5px solid var(--brass);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.panel h2{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:.3px}
.sub{color:var(--muted)}
.lvl{border-radius:6px;border:1.5px solid var(--line);background:var(--panel);font-weight:600}
.lvl.on{background:var(--jade);border-color:var(--jade);color:#fff}
.lvl[data-l=easy].on{background:#2f8f4e;border-color:#2f8f4e}.lvl[data-l=medium].on{background:#1f5fae;border-color:#1f5fae}.lvl[data-l=hard].on{background:#c06a00;border-color:#c06a00}.lvl[data-l=pro].on{background:var(--lacquer);border-color:var(--lacquer)}

/* home */
.home-hero{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;max-width:1000px;margin:18px auto 30px}

/* reactions + quick chat */
.reacts{display:inline-flex;gap:2px;margin-left:auto;padding-left:6px;border-left:1px solid var(--line)}
.reacts button{background:none;border:0;font-size:19px;padding:3px 4px;border-radius:6px;cursor:pointer;line-height:1}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:90;background:#082c24;color:#fff6dc;border:2px solid var(--brass);border-radius:999px;padding:10px 20px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;transition:opacity .5s,transform .5s}

/* stats */

.mode{background:rgba(255,255,255,.06);border:1.5px solid rgba(226,177,60,.45);border-radius:10px;padding:12px 16px;text-align:left;color:#f3ead2;cursor:pointer}

/* Always use light-style controls, even when the browser or claude.ai is in dark mode */

<script>
/* Multiplayer is off for now, so nothing here talks to Firebase. To bring it back,
   put the Firebase config here and set MULTIPLAYER to true. */
const MULTIPLAYER = false;
window.HKMJ_FIREBASE_CONFIG = null;
</script>
<script>
// ===================== Hong Kong Mahjong engine =====================
// Tile ids: 0-8 Dots 1-9, 9-17 Bamboo 1-9, 18-26 Characters 1-9,
// 27-30 Winds E S W N, 31 Red, 32 Green, 33 White dragon,
// 34-37 Flowers 1-4 (Plum, Orchid, Chrysanthemum, Bamboo), 38-41 Seasons 1-4.
const WIND_CN = ['東', '南', '西', '北'];
const WIND_EN = ['East', 'South', 'West', 'North'];
const SUIT_EN = ['Dots', 'Bamboo', 'Characters'];
const DRAGON_EN = ['Red Dragon', 'Green Dragon', 'White Dragon'];
const suitOf = t => Math.floor(t / 9);
const numOf = t => (t % 9) + 1;
const isHonor = t => t >= 27 && t < 34;
const isWindT = t => t >= 27 && t <= 30;
const isDragonT = t => t >= 31 && t <= 33;
const isTermOrHonor = t => isHonor(t) || (t < 27 && (t % 9 === 0 || t % 9 === 8));
const ORPHANS = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
function tileName(t) {
  if (t < 27) return `${numOf(t)} ${SUIT_EN[suitOf(t)]}`;
  if (t <= 30) return `${WIND_EN[t - 27]} Wind`;
  if (t <= 33) return DRAGON_EN[t - 31];
  if (t <= 37) return ['Plum', 'Orchid', 'Chrysanthemum', 'Bamboo'][t - 34] + ' (Flower ' + (t - 33) + ')';
  return ['Spring', 'Summer', 'Autumn', 'Winter'][t - 38] + ' (Season ' + (t - 37) + ')';
}
const enc = arr => arr.map(t => String.fromCharCode(48 + t)).join('');
const dec = s => [...(s || '')].map(ch => ch.charCodeAt(0) - 48);
function counts(arr) { const c = new Array(34).fill(0); for (const t of arr) if (t < 34) c[t]++; return c; }
function fromCounts(c) { const a = []; for (let t = 0; t < 34; t++) for (let k = 0; k < c[t]; k++) a.push(t); return a; }
const sortTiles = a => a.sort((x, y) => x - y);
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = r ? Math.floor(r() * (i + 1)) : rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry32(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function meldTiles(m) { if (m.k === 'chow') return [m.t, m.t + 1, m.t + 2]; return new Array(m.k === 'kong' ? 4 : 3).fill(m.t); }
const round2 = x => Math.round(x * 100) / 100;

const HALF_SPICY = [1, 2, 4, 8, 16, 24, 32, 48, 64, 96, 128, 192, 256, 384];
const FULL_SPICY = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192];

const DEFAULT_SETTINGS = { minFaan: 3, maxFaan: 13, rounds: 1, payment: 'all', spicy: 'half', sevenPairs: true, turnTime: 0, claimTime: 0, speed: 'normal' };

// ---------- hand decomposition ----------
function decompose(c, need) {
  const out = [], sets = [];
  (function rec(i, pair) {
    while (i < 34 && c[i] === 0) i++;
    if (i >= 34) { if (sets.length === need && pair >= 0) out.push({ sets: sets.slice(), pair }); return; }
    if (pair < 0 && c[i] >= 2) { c[i] -= 2; rec(i, i); c[i] += 2; }
    if (sets.length < need) {
      if (c[i] >= 3) { c[i] -= 3; sets.push({ k: 'pung', t: i }); rec(i, pair); sets.pop(); c[i] += 3; }
      if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
        c[i]--; c[i + 1]--; c[i + 2]--; sets.push({ k: 'chow', t: i }); rec(i, pair); sets.pop(); c[i]++; c[i + 1]++; c[i + 2]++;
      }
    }
  })(0, -1);
  return out;
}
function isThirteen(c) {
  let pair = false, total = 0;
  for (let t = 0; t < 34; t++) total += c[t];
  if (total !== 14) return false;
  for (const t of ORPHANS) { if (!c[t]) return false; if (c[t] === 2) pair = true; }
  return pair;
}
function isSevenPairs(c) { let p = 0; for (let t = 0; t < 34; t++) { if (c[t] === 2) p++; else if (c[t]) return false; } return p === 7; }

function flowerFaan(fl, sw) {
  if (!fl.length) return [['No Flowers', 1]];
  const items = [], f = fl.filter(t => t <= 37), s = fl.filter(t => t >= 38);
  if (f.length === 4) items.push(['All Four Flowers', 2]); else if (f.includes(34 + sw)) items.push(['Own Flower', 1]);
  if (s.length === 4) items.push(['All Four Seasons', 2]); else if (s.includes(38 + sw)) items.push(['Own Season', 1]);
  return items;
}
function suitItems(types) {
  const suits = new Set(types.filter(t => t < 27).map(suitOf));
  const hon = types.some(isHonor);
  if (suits.size === 1 && !hon) return [['All One Suit', 7]];
  if (suits.size === 1 && hon) return [['Mixed One Suit', 3]];
  return [];
}

// conc: concealed tiles INCLUDING the winning tile. melds: declared melds.
// ctx: {settings, seatWind, prevWind, flowers, selfDraw, winTile, robbing, lastCatch, kongWin, doubleKong, heavenly, earthly}
function evaluateWin(conc, melds, ctx) {
  const S = ctx.settings, need = 4 - melds.length;
  if (conc.length !== need * 3 + 2) return null;
  const c = counts(conc);
  const fItems = flowerFaan(ctx.flowers || [], ctx.seatWind);
  const wItems = [];
  if (ctx.selfDraw) wItems.push(['Self-drawn', 1]);
  if (ctx.robbing) wItems.push(['Robbing the Kong', 1]);
  if (ctx.lastCatch) wItems.push(['Win by Last Catch', 1]);
  if (ctx.doubleKong) wItems.push(['Win by Double Kong', 8]);
  else if (ctx.kongWin) wItems.push(['Win by Kong', 1]);
  const cands = [];
  if (melds.length === 0) {
    if (isThirteen(c)) cands.push({ limit: true, items: [['Thirteen Orphans', 13]] });
    if (S.sevenPairs && isSevenPairs(c)) {
      const types = []; for (let t = 0; t < 34; t++) if (c[t]) types.push(t);
      if (types.every(isHonor)) cands.push({ limit: true, items: [['All Honor Tiles', 10]] });
      else cands.push({ limit: false, items: [['Seven Pairs', 4], ...suitItems(types), ...fItems, ...wItems] });
    }
  }
  for (const d of decompose(c, need)) {
    let choices = [null];
    if (!ctx.selfDraw) {
      choices = [];
      d.sets.forEach((st, i) => { if (st.k === 'pung' ? st.t === ctx.winTile : (ctx.winTile >= st.t && ctx.winTile <= st.t + 2)) choices.push(i); });
      if (d.pair === ctx.winTile) choices.push('pair');
      if (!choices.length) choices = [null];
    }
    for (const ch of choices) cands.push(Object.assign(scoreDecomp(d, ch, melds, ctx, fItems, wItems), { d, ch }));
  }
  if (!cands.length) return null;
  const anyD = (cands.find(x => x.d) || {}).d;      /* so the win screen can still lay the hand out */
  if (ctx.heavenly) return { limit: true, items: [['Heavenly Hand', 13]], faan: Math.min(13, S.maxFaan), d: anyD };

}

function scoreDecomp(d, choice, melds, ctx, fItems, wItems) {
  const groups = melds.map(m => ({ k: m.k === 'chow' ? 'chow' : 'pung', kong: m.k === 'kong', t: m.t, conc: !!m.c }))
    .concat(d.sets.map((s, i) => ({ k: s.k, kong: false, t: s.t, conc: !(choice === i) })));
  const pair = d.pair;
  const types = [pair]; groups.forEach(g => { if (g.k === 'chow') types.push(g.t, g.t + 1, g.t + 2); else types.push(g.t); });
  const allPung = groups.every(g => g.k === 'pung');
  const allChow = groups.every(g => g.k === 'chow');
  const lim = [];
  if (groups.filter(g => g.kong).length === 4) lim.push(['All Kongs', 13]);
  const windP = groups.filter(g => g.k === 'pung' && isWindT(g.t)).length;
  const dragP = groups.filter(g => g.k === 'pung' && isDragonT(g.t)).length;
  if (windP === 4) lim.push(['Great Winds', 13]);
  if (allPung && groups.every(g => g.conc)) lim.push(['Self Triplets', 10]);
  if (types.every(isHonor)) lim.push(['All Honor Tiles', 10]);
  if (types.every(t => t < 27 && (t % 9 === 0 || t % 9 === 8))) lim.push(['Orphans', 10]);
  if (melds.length === 0 && new Set(types.filter(t => t < 27).map(suitOf)).size === 1 && !types.some(isHonor)) {
    // Nine Gates: 1112345678999 + any tile of the same suit, all concealed
    const s = suitOf(types[0]) * 9; const cc = new Array(9).fill(0);
    groups.forEach(g => { if (g.k === 'chow') { cc[g.t - s]++; cc[g.t + 1 - s]++; cc[g.t + 2 - s]++; } else cc[g.t - s] += 3; });
    cc[pair - s] += 2; if (ctx.winTile != null && ctx.winTile >= s && ctx.winTile < s + 9) cc[ctx.winTile - s]--;
    const pat = [3, 1, 1, 1, 1, 1, 1, 1, 3];
    if (cc.every((v, i) => v === pat[i])) lim.push(['Nine Gates', 10]);
  }
  if (lim.length) { lim.sort((a, b) => b[1] - a[1]); return { limit: true, items: [lim[0]] }; }
  const items = [];
  if (allChow) items.push(['Common Hand', 1]);
  if (allPung) items.push(['All in Triplets', 3]);
  items.push(...suitItems(types));
  if (allPung && types.every(isTermOrHonor) && types.some(isHonor)) items.push(['Mixed Orphans', 1]);
  groups.forEach(g => { if (g.k === 'pung' && isDragonT(g.t)) items.push([DRAGON_EN[g.t - 31] + ' Pung', 1]); });
  if (dragP === 3) items.push(['Great Dragons', 5]);
  else if (dragP === 2 && isDragonT(pair)) items.push(['Small Dragons', 3]);
  groups.forEach(g => {
    if (g.k === 'pung' && g.t === 27 + ctx.seatWind) items.push(['Seat Wind (' + WIND_EN[ctx.seatWind] + ')', 1]);
    if (g.k === 'pung' && g.t === 27 + ctx.prevWind) items.push(['Prevailing Wind (' + WIND_EN[ctx.prevWind] + ')', 1]);
  });
  if (windP === 3 && isWindT(pair)) items.push(['Small Winds', 6]);
  items.push(...fItems);
  if (melds.every(m => m.c)) items.push(['Concealed Hand', 1]);
  items.push(...wItems);
  return { limit: false, items };
}

// ---------- shanten (used by bots and hints) ----------
function shantenStd(c, m) {

    if (c[i] >= 3 && sets < need) { c[i] -= 3; rec(i, sets + 1, taa, pair); c[i] += 3; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2] && sets < need) { c[i]--; c[i + 1]--; c[i + 2]--; rec(i, sets + 1, taa, pair); c[i]++; c[i + 1]++; c[i + 2]++; }
    if (c[i] >= 2) {

      if (sets + taa < need) { c[i] -= 2; rec(i, sets, taa + 1, pair); c[i] += 2; }
    }
    if (i < 27 && sets + taa < need) {
      if (i % 9 <= 7 && c[i + 1]) { c[i]--; c[i + 1]--; rec(i, sets, taa + 1, pair); c[i]++; c[i + 1]++; }
      if (i % 9 <= 6 && c[i + 2]) { c[i]--; c[i + 2]--; rec(i, sets, taa + 1, pair); c[i]++; c[i + 2]++; }
    }
    const k = c[i]; c[i] = 0; rec(i + 1, sets, taa, pair); c[i] = k;

  let s = shantenStd(c, m);

    let pairs = 0, kinds = 0; for (let t = 0; t < 34; t++) { if (c[t] >= 2) pairs++; if (c[t]) kinds++; }
    if (sp) s = Math.min(s, 6 - pairs + Math.max(0, 7 - kinds));
    let k = 0, hp = 0; for (const t of ORPHANS) { if (c[t]) k++; if (c[t] >= 2) hp = 1; }
    s = Math.min(s, 13 - k - hp);
  }
  return s;
}

// ===================== Game state machine =====================
class Game {
  constructor(settings, seats) {
    this.S = Object.assign({}, DEFAULT_SETTINGS, settings);

  L(m, k, ev) { const o = { id: ++this.logId, m, k: k || '' }; if (ev) o.e = ev; this.log.push(o); if (this.log.length > 300) this.log.shift(); }

  newHand() {
    const wall = [];
    for (let t = 0; t < 34; t++) for (let k = 0; k < 4; k++) wall.push(t);
    for (let t = 34; t < 42; t++) wall.push(t);
    shuffle(wall, this.rng);
    const h = this.h = { wall, hands: [[], [], [], []], melds: [[], [], [], []], flowers: [[], [], [], []], discards: [[], [], [], []],
      turn: this.dealer, phase: 'discard', drawn: null, last: null, claimOpts: null, claims: null, claimTile: null, claimFrom: null, claimKind: null,
      kongChain: 0, kongDraw: false, anyClaim: false, discardCount: 0, result: null, deadline: 0, hist: '' };
    this.handNo++;
    for (let r = 0; r < 13; r++) for (let i = 0; i < 4; i++) h.hands[(this.dealer + i) % 4].push(h.wall.shift());
    h.hands[this.dealer].push(h.wall.shift());
    this.L(`— Hand ${this.handNo}: ${WIND_EN[this.prev]} round, ${this.nm(this.dealer)} is East (dealer) —`, 'h');
    for (let i = 0; i < 4; i++) {
      const s = (this.dealer + i) % 4;
      let again = true;
      while (again) {
        again = false;
        for (let j = h.hands[s].length - 1; j >= 0; j--) {
          if (h.hands[s][j] >= 34) {
            h.flowers[s].push(h.hands[s].splice(j, 1)[0]);
            h.hands[s].push(h.wall.pop()); again = true;

    }

    if (h.phase === 'discard' && h.turn === s) { pv.my = 1; const r = this.tsumoEval(s); if (r && r.faan >= this.S.minFaan) pv.ts = r.faan; else if (r) pv.low = r.faan; pv.kg = this.kongOptions(s); }
    if (h.lowRon && h.lowRon.s === s) pv.lr = [h.lowRon.t, h.lowRon.faan, h.discardCount];

    return pv;
  }
}

// ===================== Tile artwork & themes =====================
const INK = { g: 'var(--ig)', b: 'var(--in)', r: 'var(--ir)', k: 'var(--ik)', w: 'var(--tf)' };
const CJK = "'Noto Serif TC','Noto Serif SC','Songti SC','PMingLiU','SimSun',serif";
const NUM_CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
const F = c => `style="fill:${c}"`;
const SK = (c, w) => `style="fill:none;stroke:${c};stroke-width:${w};stroke-linecap:round;stroke-linejoin:round"`;
const n2 = x => +x.toFixed(2);

}

/* The winner's concealed tiles as they won: each set, then the pair, with the winning
   tile marked in the group it finished. Seven Pairs go in twos; Thirteen Orphans stay in a row. */
function winGroups(conc, r) {
  const all = [...conc, r.wt].sort((a, b) => a - b);
  let groups;
  if (r.ds) groups = [...r.ds.sets.map(s => s.k === 'chow' ? [s.t, s.t + 1, s.t + 2] : [s.t, s.t, s.t]), [r.ds.pair, r.ds.pair]];
  else if (all.length === 14 && all.every((t, i) => all[i ^ 1] === t)) groups = all.filter((_, i) => i % 2 === 0).map(t => [t, t]);
  else groups = [all];
  const home = r.dc === 'pair' ? groups.length - 1 : Number.isInteger(r.dc) ? r.dc : groups.findIndex(g => g.includes(r.wt));
  return groups.map((g, i) => { let marked = i !== home;
    return `<div class="tiles">${g.map(t => { const on = !marked && t === r.wt; if (on) marked = true; return tileHTML(t, on ? 'win' : ''); }).join('')}</div>`; }).join('');
}

const HN = { E: 27, S: 28, W: 29, N: 30, R: 31, G: 32, H: 33 };
function parseGroup(g) {
  const out = []; const m = g.match(/^(\d+)([dbc])$/);
  if (m) { const base = { d: 0, b: 9, c: 18 }[m[2]]; for (const ch of m[1]) out.push(base + +ch - 1); }
  else for (const ch of g) out.push(HN[ch]);
  return out;
}
function exampleHTML(spec) {
  return `<div class="exrow">${spec.split(' ').map(g => {
    const exp = g.endsWith('!'), cg = g.replace('!', ''), arr = parseGroup(cg);
    const hide = cg.endsWith('*');
    return `<div><div class="grp">${(hide ? parseGroup(cg.slice(0, -1)) : arr).map((t, i, a) => hide && (i === 0 || i === a.length - 1) ? backHTML() : tileHTML(t)).join('')}</div>${exp ? '<div class="lbl">exposed</div>' : hide ? '<div class="lbl">concealed kong</div>' : ''}</div>`;
  }).join('')}</div>`;
}
function exampleScore(spec, sd) {
  const conc = [], melds = [];
  for (const g of spec.split(' ')) {
    const arr = parseGroup(g.replace('!', ''));
    if (g.endsWith('!') || arr.length === 4) melds.push({ k: arr.length === 4 ? 'kong' : (arr[0] === arr[1] ? 'pung' : 'chow'), t: Math.min(...arr), c: !g.endsWith('!') });
    else conc.push(...arr);
  }
  const win = conc[conc.length - 1];
  return evaluateWin(conc, melds, { settings: Object.assign({}, DEFAULT_SETTINGS, { maxFaan: 13 }), seatWind: 1, prevWind: 0, flowers: [], selfDraw: !!sd, winTile: win });
}

async function joinRoom(code) {
  busy('Joining room ' + code + '…');
  const room = await Net.ready(); if (!room) { closeModal(); return onlineUnavailable(); }
  try {
    await Net.ensureKeys();
    Net.reset(); await Net.joinNamed(code);

      const d = msg.data; if (!d || d.code !== code || !Array.isArray(d.seats)) return;
      if (!Net.hostPeer) Net.hostPeer = msg.peer;
      if (msg.peer !== Net.hostPeer) return;
      if (!Net.myPeer) { const me = Net.named.peers().find(p => p.sameTab); if (me) Net.myPeer = me.peer; }
      if (!Net.gotLobby) { Net.gotLobby = true; closeModal(); }

      const firstLob = !App.lobby;
      App.lobby = { code, started: !!d.st, seats: d.seats.map(x => x && { n: cleanName(x.n), ty: x.ty === 'b' ? 'b' : 'h', lv: LEVELS.includes(x.lv) ? x.lv : '', p: x.p, on: x.on, a: cleanAvatar(x.a) }), S: Object.assign({}, DEFAULT_SETTINGS, d.S || {}) };

    Net.unsubs.push(Net.named.onPeers(ch => {
      if (ch.joined.some(p => !p.sameTab) && App.lobby) setTimeout(() => Net.shareProfile(), 400 + Math.random() * 800);
      if (Net.hostPeer && ch.left.some(p => p.peer === Net.hostPeer)) {
        const wasPlaying = App.screen === 'game' && App.view && !App.view.ov;
        Net.leave(); App.role = null;
        modal(`<h2>The host left</h2><p>${wasPlaying ? 'The game has ended because the host closed the room.' : 'This room was closed.'}</p><div class="btnrow"><button class="btn primary" id="hlHome">Home</button></div>`, { sticky: true });
        $('#hlHome').onclick = () => { closeModal(); show('home'); };
      }
    }));
    const hi = () => Net.emit('hi', { n: App.name, k: Net.pubB64, a: Net.presetAv() });
    Net.every(() => { if (App.lobby) Net.shareProfile(); }, 25000);
    hi();
    let tries = 0;
    Net.every(() => {
      tries++;
      if (App.seat >= 0 && Net.gotLobby) return;
      if (Net.gotLobby && App.lobby && App.lobby.seats.every(x => x)) { if (App.screen === 'lobby') renderLobby(); return; }
      hi();
      if (tries === 5 && !Net.gotLobby) {

      }

    closeModal(); Net.leave(); App.role = null;

const BAD_SUB = ['fuck', 'fuk', 'fck', 'phuck', 'shit', 'cunt', 'bitch', 'bastard', 'asshole', 'arsehole', 'dumbass', 'jackass', 'motherf', 'wank', 'twat', 'slut', 'whore',

const BAD_EXACT = ['ass', 'arse', 'dick', 'cock', 'prick', 'damn', 'crap', 'tits', 'rape', 'kys', 'fag', 'fags', 'chink', 'spic', 'kike', 'tranny', 'dyke', 'coon', 'gook', 'paki',
  'spaz', 'hoe', 'hoes', 'bugger', 'nazi', 'stfu', 'wtf', 'fu', 'mf', 'pos', 'dipshit', 'shite', 'feck', 'bloody'];
const LEET = { '0': 'o', '1': 'i', '!': 'i', '|': 'i', '3': 'e', '4': 'a', '@': 'a', '5': 's', '$': 's', '7': 't', '+': 't', '8': 'b', '9': 'g', '(': 'c' };
function normWord(w) { return [...w.toLowerCase()].map(c => LEET[c] || c).join('').replace(/[^a-z]/g, '').replace(/(.)\1{2,}/g, '$1$1'); }
const SAFE_WORDS = ['scunthorpe', 'shiitake', 'cocktail', 'cocktails', 'peacock', 'hancock', 'niggle', 'niggling', 'snigger', 'sniggering', 'swank', 'swanky', 'retardant', 'therapist', 'therapists', 'fukushima', 'assassin', 'classic', 'grape', 'drape', 'scrape', 'skyscraper', 'spicy', 'spice', 'hello', 'shell', 'hellish', 'pisces', 'dickens', 'cocky', 'cockpit', 'bassist', 'passion', 'mishit'];
function isBad(n) {
  if (!n || SAFE_WORDS.includes(n)) return false;
  const squash = n.replace(/(.)\1+/g, '$1');
  if (BAD_EXACT.includes(n) || BAD_EXACT.includes(squash)) return true;
  return BAD_SUB.some(b => n.includes(b) || squash.includes(b.replace(/(.)\1+/g, '$1')));
}
function censor(text) {
  let s = String(text || '');
  // words, including ones written with symbols or numbers (sh1t, f*ck)
  s = s.replace(/[A-Za-z0-9@$!|+(*#]+/g, w => {
    const n = normWord(w.replace(/[*#]/g, ''));
    if (isBad(n)) return '*'.repeat([...w].length);
    if (/[*#]/.test(w) && /^[a-z]/i.test(w)) { // f*ck, sh#t: try filling the gap with likely letters
      for (const fill of ['u', 'i', 'a', 'o', 'e']) if (isBad(normWord(w.replace(/[*#]/g, fill)))) return '*'.repeat([...w].length);
    }
    return w;
  });
  // spaced-out letters: "f u c k" or "s.h.i.t"
  s = s.replace(/\b(?:[A-Za-z0-9@$][\s._\-]+){2,}[A-Za-z0-9@$]\b/g, run => isBad(normWord(run)) ? run.replace(/[A-Za-z0-9@$]/g, '*') : run);
  return s;
}

  const cv = document.createElement('canvas'); cv.className = 'fxcanvas'; document.body.appendChild(cv);
  const W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext('2d');
  const cols = ['#c8102e', '#e2b13c', '#17694f', '#2563b8', '#ff7ab6', '#fff6dc'];
  const parts = [];
  const confetti = n => { for (let i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: -20 - Math.random() * H * .3, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[i % cols.length], t: 'c' }); };
  const burst = (x, y) => { const c = cols[Math.floor(Math.random() * cols.length)]; for (let i = 0; i < 70; i++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2.4, c, t: 'f', life: 1 }); } };

  for (let i = 0; i < bursts; i++) setTimeout(() => burst(W * (.2 + Math.random() * .6), H * (.15 + Math.random() * .35)), i * 330);
  const t0 = performance.now(), dur = level >= 2 ? 4600 : 3400;
  (function frame(now) {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      if (p.t === 'c') { p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
      else { p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.life -= .012; if (p.life > 0) { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; } }
    }
    if (now - t0 < dur) requestAnimationFrame(frame); else cv.remove();
  })(t0);
  if (level >= 2) {

   sent turn by turn, and without a login it all stays on this device. */
const Cloud = {
  on: !!(window.TT && TT.signedIn()),
  async pull() {
    if (!this.on) return;
    try {
      const { state } = await TT.api('/api/gamestate', { params: { mode: 'hkmj' } });
      /* shortcut: the device with more hands wins, so two devices played apart don't add up; merge them if that matters */
      if (state && state.stats && state.stats.hands > Stats.data.hands) {
        Stats.data = state.stats; Stats.save(); store.set('daily', state.daily || {});
        if (App.screen === 'home') renderHome();
      }
    } catch (e) { }
  },
  push() {
    if (!this.on) return;
    const daily = Object.fromEntries(Object.entries(store.get('daily', {})).sort().slice(-30));
    store.set('daily', daily);
    TT.api('/api/gamestate', { method: 'PUT', body: { mode: 'hkmj', state: { stats: Stats.data, daily } } }).catch(() => { });
  }
};
function toast(html) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; document.body.appendChild(t);
  setTimeout(() => t.classList.add('out'), 3600); setTimeout(() => t.remove(), 4200);
}
function showStats() {
  const d = Stats.data, pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
  const pats = Object.entries(d.patterns).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const lv = ['easy', 'medium', 'hard', 'pro', 'online'].filter(k => d.byLevel[k]);
  const o = modal(`<h2>Your stats</h2><p class="sub">${Cloud.on ? 'Saved to your account.' : 'Saved on this device.'}</p>
    <div class="statgrid">
      <div><b>${d.games}</b><span>games</span></div><div><b>${d.hands}</b><span>hands</span></div><div><b>${d.wins}</b><span>hands won</span></div>
      <div><b>${pct(d.wins, d.hands)}</b><span>win rate</span></div><div><b>${d.selfDraws}</b><span>self-drawn wins</span></div><div><b>${d.bestFaan || '—'}</b><span>biggest hand (faan)</span></div>
    </div>
    ${lv.length ? `<h3>By opponent</h3><table class="gtable"><tr><th>Toughest bot</th><th>Hands won</th><th>Games finished first</th></tr>${lv.map(k => { const b = d.byLevel[k]; return `<tr><td>${k === 'online' ? 'Online games' : cap(k)}</td><td>${b.wins} of ${b.hands} (${pct(b.wins, b.hands)})</td><td>${b.firsts} of ${b.games}</td></tr>`; }).join('')}</table>` : ''}
    ${pats.length ? `<h3>Your favourite winning patterns</h3><table class="gtable">${pats.map(([n, c]) => `<tr><td>${esc(n)}</td><td>${c}×</td></tr>`).join('')}</table>` : ''}
    <div class="btnrow"><button class="btn red" onclick="closeModal()">Close</button><button class="btn" id="stReset">Reset stats</button></div>`);
  o.querySelector('.modal').classList.add('wide');
  o.querySelector('#stReset').onclick = () => confirmBox('Reset all stats?', 'Reset', () => { Stats.data = { games: 0, hands: 0, wins: 0, selfDraws: 0, dealIns: 0, bestFaan: 0, bestItems: [], patterns: {}, byLevel: {}, gamesFirst: 0, ach: {} }; Stats.save(); showStats(); });
}

// ---------- hand replay ----------
function showReplay(V) {
  V = V || App.view; const r = V && V.rs; if (!r || !r.hx) { toast('No replay for this hand yet.'); return; }
  const ev = []; for (let i = 0; i + 2 < r.hx.length + 1; i += 3) { const ty = r.hx[i], s = +r.hx[i + 1], t = r.hx.charCodeAt(i + 2) - 48; if (ty) ev.push({ ty, s, t }); }
  let step = ev.length, timer = null;
  const names = V.P.map(p => p.n);
  const verb = { d: 'discards', p: 'pungs', k: 'kongs', c: 'chows', q: 'declares a concealed kong', a: 'adds to a kong', w: 'wins on', z: 'wins by self-draw with' };
  const o = modal('<div id="rpBody"></div>', {}); o.querySelector('.modal').classList.add('wide');
  const draw = () => {
    const pools = [[], [], [], []], sets = [[], [], [], []]; let lastD = null;
    for (let i = 0; i < step; i++) {
      const e = ev[i];
      if (e.ty === 'd') { pools[e.s].push(e.t); lastD = e.s; }
      else if (e.ty === 'p' || e.ty === 'k' || e.ty === 'c') { if (lastD != null) pools[lastD].pop(); sets[e.s].push(e.ty === 'c' ? [e.t, e.t + 1, e.t + 2] : new Array(e.ty === 'k' ? 4 : 3).fill(e.t)); }
      else if (e.ty === 'q') sets[e.s].push([e.t, e.t, e.t, e.t]);
      else if (e.ty === 'a') { const m = sets[e.s].find(x => x.length === 3 && x[0] === e.t && x[1] === e.t); if (m) m.push(e.t); }
      else if (e.ty === 'w' && lastD != null) pools[lastD].pop();
    }
    const cur = ev[step - 1];
    o.querySelector('#rpBody').innerHTML = `<h2>Hand ${V.hn} replay</h2>
      <p class="sub">${cur ? `Move ${step} of ${ev.length}: <b>${esc(names[cur.s])}</b> ${verb[cur.ty] || ''} ${esc(tileName(cur.t))}${cur.ty === 'c' ? ' (run)' : ''}` : 'Start of the hand'}</p>
      <div class="rpgrid">${[0, 1, 2, 3].map(s => `<div class="rprow"><div class="rpname">${avatarHTML(seatAvatar(V, s), names[s], 'small')}<span>${esc(names[s])}</span></div><div><div class="tiles rpsets">${sets[s].map(m => `<div class="meld">${m.map(t => tileHTML(t)).join('')}</div>`).join('')}</div><div class="tiles rppool">${pools[s].map((t, i) => tileHTML(t, cur && cur.s === s && cur.ty === 'd' && i === pools[s].length - 1 ? 'hl' : '')).join('')}</div></div></div>`).join('')}</div>
      <div class="rpctl"><button class="btn" id="rpStart" title="Start">⏮</button><button class="btn" id="rpBack">◀ Back</button><button class="btn red" id="rpPlay">${timer ? 'Pause' : 'Play'}</button><button class="btn" id="rpFwd">Next ▶</button><button class="btn" id="rpEnd" title="End">⏭</button>
      <input type="range" id="rpSlide" min="0" max="${ev.length}" value="${step}" aria-label="Replay position"><button class="btn" id="rpClose">Close</button></div>`;
    const go = n => { step = Math.max(0, Math.min(ev.length, n)); draw(); };
    o.querySelector('#rpStart').onclick = () => go(0); o.querySelector('#rpEnd').onclick = () => go(ev.length);
    o.querySelector('#rpBack').onclick = () => go(step - 1); o.querySelector('#rpFwd').onclick = () => go(step + 1);
    o.querySelector('#rpSlide').oninput = e => go(+e.target.value);
    o.querySelector('#rpPlay').onclick = () => { if (timer) { clearInterval(timer); timer = null; draw(); } else { if (step >= ev.length) step = 0; timer = setInterval(() => { if (!document.body.contains(o)) { clearInterval(timer); return; } if (step >= ev.length) { clearInterval(timer); timer = null; draw(); return; } step++; draw(); }, 650); draw(); } };
    o.querySelector('#rpClose').onclick = () => { if (timer) clearInterval(timer); closeModal(); };
  };
  step = 0; draw();
}

// ---------- modes ----------
function dailyKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function dailySeed() { return +dailyKey().replace(/-/g, ''); }

boot();

</script>
