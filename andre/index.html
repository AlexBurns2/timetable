<!--
  Andre's sandbox for the site redesign. Served at /andre/.
  Deliberately standalone: it doesn't load theme.css / site.css / theme.js, so
  nothing here changes the main site and nothing on the main site changes this.
  Current content: timetable concept art (static demo data, not wired to the API).
-->
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one full-viewport week grid (5 school days, arrow-stepped); modules sit a full screen below. */
:root{
  --bg:#FBFBFD; --fill:#F0F0F4; --fg:#1D1D1F; --fg2:#6E6E73; --fg3:#AEAEB2; --sep:rgba(0,0,0,.08);
  --mat:rgba(251,251,253,.8); --red:#FF3B30; --gap:#F2F2F5; --past:#ECECEF;
  --c1:#0A84FF; --c2:#FF9F0A; --c3:#30C05A; --c4:#AF52DE; --c5:#FF375F; --c6:#5E5CE6; --c7:#32ADE6; --c8:#A2845E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --fill:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#5A5A5F; --sep:rgba(255,255,255,.1);
  --mat:rgba(0,0,0,.72); --red:#FF453A; --gap:#111113; --past:#1A1A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --fill:#1C1C1E; --fg:#F5F5F7; --fg2:#98989D; --fg3:#5A5A5F; --sep:rgba(255,255,255,.1);
  --mat:rgba(0,0,0,.72); --red:#FF453A; --gap:#111113; --past:#1A1A1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mat)}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.in{max-width:1440px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mat);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.bar .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:60px}
.term{font-size:13px;color:var(--fg2);font-weight:500}
.term b{color:var(--fg);font-weight:600}
.email{display:flex;align-items:center;gap:8px;width:400px;height:36px;padding:0 12px;border-radius:10px;background:var(--fill);color:var(--fg2);cursor:text}
.email svg{width:15px;height:15px;flex:none}
.email input{width:11ch;min-width:3ch;height:100%;outline:none;color:var(--fg);font-size:14px;cursor:text;padding:0}
.email input::placeholder{color:var(--fg2)}
.email .dom{color:var(--fg3);font-size:14px;white-space:nowrap}
.right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.clock{font-size:13px;color:var(--fg2)}
.gear{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg2)}
.gear:hover{background:var(--fill)}
.gear svg{width:19px;height:19px}
.set{position:relative}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;padding:6px;border-radius:12px;background:var(--bg);border:1px solid var(--sep);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.menu a{display:block;padding:9px 12px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:14px;font-weight:500}
.menu a:hover{background:var(--fill)}

/* timetable */
.tt{min-height:calc(100vh - 60px);padding-block:10px 24px;overflow-x:auto}
.grid{display:grid;grid-template-columns:36px repeat(5,minmax(160px,1fr)) 36px;column-gap:8px;min-width:980px}
.arrow{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);align-self:center}
.arrow:hover{background:var(--fill);color:var(--fg)}
.arrow svg{width:16px;height:16px}
.dh{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:16px 2px 12px;border-bottom:2px solid transparent;margin-bottom:12px;position:relative}
.dh .d{font-size:17px;color:var(--fg2)}
.dh .n{font-size:17px;font-weight:500}
.dh .tag{margin-left:auto;font-size:12px;color:var(--fg3)}
.dh.today{border-bottom-color:var(--fg)}
.dh.today .d,.dh.today .n{color:var(--fg);font-weight:700}
.col{position:relative}
.blk{position:absolute;left:0;right:0;border-radius:10px;padding:10px 12px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--bg))}
.blk>*{position:relative;z-index:1;display:block}
.blk .s{font-weight:600;font-size:15px;color:color-mix(in srgb,var(--c) 55%,var(--fg));line-height:1.25;padding-right:36px}
.blk .m{font-size:13px;margin-top:2px;color:color-mix(in srgb,var(--c) 35%,var(--fg2))}
.blk .r{position:absolute;top:10px;right:12px;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--c) 55%,var(--fg))}
.blk .t{position:absolute;left:12px;bottom:9px;font-size:12px;color:color-mix(in srgb,var(--c) 30%,var(--fg2))}
.blk.sm{display:flex;align-items:center;gap:8px;padding:0 12px}
.blk.sm .t{position:static}
.blk.sm .m{display:none}
.blk.past{filter:saturate(.35);opacity:.6}
.blk.now::before{content:"";position:absolute;inset:0 0 auto 0;height:var(--p);background:color-mix(in srgb,var(--bg) 50%,transparent);backdrop-filter:saturate(.35);-webkit-backdrop-filter:saturate(.35);border-bottom:1.5px solid color-mix(in srgb,var(--c) 70%,#000)}
.gap{position:absolute;left:0;right:0;border-radius:10px;background:var(--fill);display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:2px 6px;font-size:12px;color:var(--fg2);font-weight:500}
.gap i{width:3px;height:3px;border-radius:50%;background:currentColor}
.gap .t{flex-basis:100%;text-align:center;font-weight:400;font-size:11.5px;color:var(--fg3)}
.gap.sm .t{flex-basis:auto}
.gap.past{opacity:.4}
.backtoday{display:none;height:30px;padding:0 14px;border-radius:15px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600}
.off .backtoday{display:block}

/* modules */
.mods{padding-block:22vh 80px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;gap:16px}
.mod{border-radius:20px;background:var(--fill);padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:inherit;text-decoration:none;transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod.w{grid-column:span 2}
.mod h3{margin:0;font-size:17px;font-weight:600}
.mod .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--c)}
.mod .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){.mg{grid-template-columns:repeat(2,1fr)}.mod.w{grid-column:span 1}}

/* status: no email yet, loading, or the school couldn't be reached */
.msg{grid-column:2/-2;padding:80px 0;text-align:center;color:var(--fg2);font-size:15px}
.msg.err{color:var(--red)}
.term .stale{color:var(--fg3);font-weight:400}
</style>

<script>
/* Live timetable: the same /api/timetable call and the same parsing as the main
   timetable (index.html), drawn as this page's week grid. Parsing helpers are
   copied from index.html rather than shared so this sandbox stays standalone. */
const ENDPOINT = "/api/timetable", DOMAIN = "education.nsw.gov.au";
/* own keys, so typing someone's name here doesn't change the main site */
const LS = { email:"andre.email", cache:"andre.cache" };
const get = (k,d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const set = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
/* read-only from the main site: its A/B week correction and optional login */
const cycleShift = (+get("tt.cycleshift", 0) === 5) ? 5 : 0;
const creds = get("tt.creds", null);
let email = get(LS.email, "") || get("tt.email", "");

/* ═══ dates ═══ */
const DN = ["Mon","Tue","Wed","Thu","Fri"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const CYCLE_DAYS = ["mona","tuea","weda","thua","fria","monb","tueb","wedb","thub","frib"];
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const sameDay = (a,b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

function toMinutes(v){
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return v > 1440 ? null : v;
  const s = String(v).trim();
  const iso = s.match(/T(\d{1,2}):(\d{2})/);
  if (iso) return (+iso[1])*60 + (+iso[2]);
  const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])?/);
  if (!m) return null;
  let h = +m[1]; const mi = +m[2]; const ap = m[3] && m[3].toLowerCase();
  if (ap === "p" && h < 12) h += 12;
  if (ap === "a" && h === 12) h = 0;
  return h*60 + mi;
}
const f = mins => (((Math.floor(mins/60)+11)%12)+1) + ":" + String(mins%60).padStart(2,"0");
function toDate(v){
  if (!v) return null;
  const s = String(v);
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], (+m[2])-1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], (+m[2])-1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

/* ═══ field pickers ═══ */
const pick = (o, keys) => {
  if (o == null || typeof o !== "object") return undefined;
  const lower = {};
  for (const k of Object.keys(o)) lower[k.toLowerCase()] = o[k];
  for (const k of keys){
    const v = lower[k.toLowerCase()];
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return undefined;
};
const deepStr = v => (v && typeof v === "object")
  ? (pick(v, ["name","fullName","displayName","description","title","shortName","code","text"]) || "")
  : (v === undefined || v === null ? "" : v);
const str = v => String(deepStr(v)).trim();
function asArray(v){
  if (Array.isArray(v)) return v;
  if (v && typeof v === "object"){ for (const val of Object.values(v)) if (Array.isArray(val)) return val; }
  return [];
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const titleCase = s => String(s).split(/[-\s]+/).filter(Boolean)
  .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join(" ");

/* ═══ tidy-up (same rules as index.html) ═══ */
function cleanSubject(name, code){
  const original = String(name || "").trim();
  let s = original.replace(/\s*[-–—,]?\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i, "");
  const keepsAWord = v => /[A-Za-z]{3,}/.test(v);
  const noCode = s.replace(/^\d{1,2}\s*[A-Za-z]{2,}[A-Za-z0-9]*(?:\s+[A-Za-z]?\d{1,2})?\s+(?=\S)/, "");
  if (noCode !== s && keepsAWord(noCode)) s = noCode;
  if (code){
    const c = String(code).trim();
    if (c && s.toLowerCase().startsWith(c.toLowerCase())){
      const rest = s.slice(c.length);
      if (keepsAWord(rest)) s = rest;
    }
  }
  s = s.replace(/^[\s:\-–—]+/, "").replace(/\s{2,}/g, " ").trim();
  if (!s) s = original.replace(/\s*\b(yr|year)\s*\.?\s*\d{1,2}\b\s*$/i, "").trim();
  return s || original || String(code || "").trim() || "Class";
}
/* "CR1007.118" -> "118" */
function roomNumber(r){
  const s = String(r || "").trim(), dot = s.lastIndexOf(".");
  return dot === -1 ? s : (s.slice(dot + 1).trim() || s);
}
function nameFromEmail(e){
  const parts = String(e || "").split("@")[0].split(".");
  if (parts.length < 2) return "";
  return titleCase(parts[0]) + " " + titleCase(parts[1].replace(/\d+$/, ""));
}
function tidyTeacher(t){
  const s = String(t || "").trim();
  if (!s) return "";
  if (s.includes("@")) return nameFromEmail(s) || titleCase(s.split("@")[0].replace(/[._]+/g, " ").replace(/\d+$/, ""));
  const m = s.match(/^([^,]+),\s*(.+)$/);
  return m ? (m[2] + " " + m[1]).replace(/\s{2,}/g," ").trim() : s;
}

/* ═══ cycle ═══ */
function cycleDayFor(date, start){
  if (!start) return null;
  const d = midnight(date), s = midnight(startOfWeek(start));
  const dow = d.getDay();
  if (dow === 0 || dow === 6 || d < s) return null;
  let elapsed = 0;
  const cur = new Date(s);
  while (cur < d){ cur.setDate(cur.getDate()+1); const w = cur.getDay(); if (w !== 0 && w !== 6) elapsed++; }
  return CYCLE_DAYS[(elapsed + cycleShift) % 10];
}
const periodNumber = v => {
  const s = String(v == null ? "" : v).trim();
  const m = s.match(/^(?:period\s*|p)?(\d+)$/i);
  return m ? m[1] : s;
};
const classify = v => {
  const p = String(v == null ? "" : v).toLowerCase();
  if (p.includes("assembly")) return "assembly";
  if (p.includes("recess") || p === "break" || p === "r") return "break";
  if (p.includes("lunch") || /^l\d*$/.test(p)) return "lunch";
  return "class";
};
function classifyBell(label){
  const p = String(label || "").toLowerCase();
  if (p.startsWith("l")) return "lunch";
  if (p.startsWith("r")) return "break";
  return classify(label);
}
/* both lunch halves collapse into one block */
const mergeKey = k => {
  const v = String(k).toLowerCase();
  if (/^l\d*$/.test(v) || v.includes("lunch")) return "lunch";
  if (v === "r" || v.includes("recess")) return "recess";
  return v;
};
const BREAK_NAMES = { recess:"Recess", lunch:"Lunch" };

/* ═══ normalise ═══ */
let entries = [], slots = [], bellRows = [], cycleStart = null, colourOf = {};

function buildBellIndex(bellTimes){
  const idx = {};
  bellRows = asArray(bellTimes).map(bt => ({
    day:   str(pick(bt, ["DayName","dayName"])).toLowerCase(),
    label: str(pick(bt, ["Period","period","PeriodNumber","periodNumber"])),
    type:  str(pick(bt, ["Type","type"])).toUpperCase(),
    start: toMinutes(pick(bt, ["StartTime","startTime","Start","start","From","from"])),
    end:   toMinutes(pick(bt, ["EndTime","endTime","End","end","To","to"]))
  })).filter(b => b.label);
  for (const b of bellRows){
    if (b.start === null && b.end === null) continue;
    const per = periodNumber(b.label).toLowerCase();
    if (b.day) idx[b.day + "|" + per] = b;
    if (!idx["*|" + per]) idx["*|" + per] = b;
  }
  return idx;
}

function normalise(payload){
  const bell = buildBellIndex(payload.bellTimes);
  const out = [];
  for (const raw of asArray(payload.timetable)){
    const dayKey = str(pick(raw, ["DayName","dayName"])).toLowerCase();
    if (CYCLE_DAYS.indexOf(dayKey) === -1) continue;
    const period = str(pick(raw, ["Period","period","PeriodNumber","periodNumber"]));
    const kind = classify(period);
    const pnum = periodNumber(period).toLowerCase();
    const bt = bell[dayKey + "|" + pnum] || bell["*|" + pnum] || {};
    const rowStart = toMinutes(pick(raw, ["StartTime","startTime","Start","start"]));
    const rowEnd   = toMinutes(pick(raw, ["EndTime","endTime","End","end"]));
    const rawSubject = str(pick(raw, ["CourseName","courseName","SubjectName","Subject","subjectName","subject","Description","description","ClassName","className"]));
    const code    = str(pick(raw, ["ClassCode","classCode","Code","code"]));
    const teacher = str(pick(raw, ["TeacherName","teacherName","TeacherFullName","teacherFullName","Teacher","teacher","DefaultTeacher","StaffName","staffName"]));
    const room    = str(pick(raw, ["RoomCode","roomCode","RoomNumber","roomNumber","RoomName","roomName","Room","room","Location","location"]));
    out.push({
      dayKey, period, pnum, kind, code, room,
      teacher: tidyTeacher(teacher),
      subject: kind === "class" ? cleanSubject(rawSubject, code) : titleCase(period),
      start: rowStart != null ? rowStart : bt.start,
      end:   rowEnd   != null ? rowEnd   : bt.end
    });
  }
  return out;
}

/* one row per bell slot, ordered by average start across the cycle */
function buildSlots(){
  const withLesson = new Set(entries.map(e => mergeKey(e.pnum || e.period)));
  const map = new Map();
  const note = (key, label, kind, start, end) => {
    const k = String(key).toLowerCase();
    const cur = map.get(k) || { key:k, period:label, kind, starts:[] };
    if (start != null) cur.starts.push(start);
    if (kind !== "class") cur.kind = kind;
    map.set(k, cur);
  };
  for (const b of bellRows){
    const key = mergeKey(periodNumber(b.label));
    note(key, BREAK_NAMES[key] || b.label, b.type === "R" ? classifyBell(b.label) : classify(b.label), b.start, b.end);
  }
  for (const e of entries){
    const key = mergeKey(e.pnum || e.period);
    if (!map.has(key)) note(key, e.period, e.kind, e.start, e.end);
  }
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
  slots = [...map.values()].map(v => ({ key:v.key, period:v.period, kind:v.kind, start:avg(v.starts), hasLesson:withLesson.has(v.key) }))
    .sort((a,b) => (a.start ?? 1e9) - (b.start ?? 1e9));
}

/* that day's actual times for a slot */
function bellFor(dayKey, slotKey){
  const k = mergeKey(slotKey);
  const hits = bellRows.filter(b => b.day === dayKey && mergeKey(periodNumber(b.label)) === k);
  if (!hits.length) return null;
  const starts = hits.map(h => h.start).filter(v => v != null);
  const ends   = hits.map(h => h.end).filter(v => v != null);
  return { start: starts.length ? Math.min(...starts) : null, end: ends.length ? Math.max(...ends) : null };
}
const entryAt = (cyc, slotKey) => entries.find(e => e.dayKey === cyc && mergeKey(e.pnum || e.period) === mergeKey(slotKey));

/* A day as the grid draws it: lessons (and assembly) as blocks, free periods
   and breaks as grey gaps, trimmed to the first and last lesson. Neighbouring
   gaps merge ("Free · Lunch") and a double lesson becomes one block. */
function itemsFor(cyc){
  if (!cyc) return [];
  let L = [];
  for (const slot of slots){
    const e = entryAt(cyc, slot.key), b = bellFor(cyc, slot.key);
    const s = (e && e.start != null) ? e.start : (b ? b.start : null);
    const en = (e && e.end != null) ? e.end : (b ? b.end : null);
    if (s == null || en == null || en <= s) continue;
    const kind = e ? e.kind : slot.kind;
    if (kind === "class" && e) L.push({ s, e:en, lesson:e });
    else if (kind === "assembly") L.push({ s, e:en, lesson:{ subject:"Assembly", teacher:"", room:"", asm:true } });
    else L.push({ s, e:en, ls:[kind === "class" ? "Free" : (BREAK_NAMES[mergeKey(slot.key)] || titleCase(slot.period))] });
  }
  L.sort((x,y) => x.s - y.s);
  const first = L.findIndex(x => x.lesson && !x.lesson.asm), last = L.length - 1 - [...L].reverse().findIndex(x => x.lesson && !x.lesson.asm);
  if (first === -1) return [];
  L = L.slice(first, last + 1);
  const out = [];
  for (const x of L){
    const p = out.at(-1);
    if (p && !x.lesson && !p.lesson){ p.e = x.e; if (p.ls.at(-1) !== x.ls[0]) p.ls.push(x.ls[0]); }
    else if (p && x.lesson && p.lesson && !x.lesson.asm && p.lesson.code === x.lesson.code && p.lesson.room === x.lesson.room && x.s - p.e <= 5) p.e = x.e;
    else out.push(x);
  }
  return out;
}

/* ═══ load ═══ */
let loading = false, loadError = "", staleNote = "", reqId = 0;

function apply(payload){
  entries = normalise(payload);
  buildSlots();
  cycleStart = toDate(typeof payload.startDate === "string" ? payload.startDate
    : pick(payload.startDate || {}, ["startDate","StartDate","date","Date"]));
  /* a steady colour per subject: alphabetical, round the palette */
  const subjects = [...new Set(entries.filter(e => e.kind === "class").map(e => e.subject))].sort();
  colourOf = {};
  subjects.forEach((s, i) => colourOf[s] = "--c" + (i % 8 + 1));
  if (!entries.length) loadError = "No lessons were returned for that address.";
}

async function load(){
  const id = ++reqId;
  loadError = ""; staleNote = "";
  entries = []; slots = []; cycleStart = null;
  if (!email){ render(); return; }
  const c = get(LS.cache, null);
  const cached = c && c.email === email && c.payload;
  if (cached) apply(c.payload);
  loading = !cached;
  render();
  try {
    const headers = { Accept:"application/json" };
    if (creds && creds.email && creds.password){
      headers["X-School-Email"] = creds.email;
      headers["X-School-Password"] = creds.password;
    }
    const res = await fetch(ENDPOINT + "?email=" + encodeURIComponent(email), { headers, cache:"no-store" });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch {}
    if (!res.ok){
      const isPage = /^\s*<(!doctype|html)/i.test(text);
      const e = new Error((data && data.error) || (isPage ? "The timetable service is not reachable from this address." : res.status + " " + res.statusText));
      e.status = res.status; e.hint = data && data.hint;
      throw e;
    }
    if (!data) throw new Error("The timetable service returned an unreadable response.");
    if (id !== reqId) return;
    loadError = "";
    apply(data);
    set(LS.cache, { email, at: Date.now(), payload: data });
  } catch (err) {
    if (id !== reqId) return;
    /* school or network down: keep the saved copy for this person */
    if (cached && err.hint !== "check-credentials" && err.status !== 404) staleNote = err.message;
    else { loadError = err.message; entries = []; slots = []; }
  } finally {
    if (id === reqId){ loading = false; render(); }
  }
}

/* ═══ render ═══ */
let off = 0;   /* weeks away from the current one */
/* on a weekend the useful week is the coming one */
function baseWeek(){
  const now = new Date(), dow = now.getDay();
  return addDays(startOfWeek(now), dow === 0 || dow === 6 ? 7 : 0);
}

function render(){
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const mon = addDays(baseWeek(), off*7);
  const dates = [0,1,2,3,4].map(k => addDays(mon, k));
  const cycs = dates.map(d => cycleDayFor(d, cycleStart));
  const days = cycs.map(itemsFor);

  const all = days.flat();
  const T0 = all.length ? Math.min(...all.map(x => x.s)) : toMinutes("8:55");
  const T1 = all.length ? Math.max(...all.map(x => x.e)) : toMinutes("15:25");
  const H = Math.max(560, innerHeight - 60 - 90 - 24), PX = H / (T1 - T0);

  const arrow = d => `<button class="arrow" data-d="${d}" aria-label="${d<0?"Previous":"Next"} week"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d<0?"M10 3 5 8l5 5":"M6 3l5 5-5 5"}"/></svg></button>`;
  let h = arrow(-1) + dates.map(d => `<div class="dh ${sameDay(d, now) ? "today" : ""}"><span class="d">${DN[(d.getDay()+6)%7]}</span><span class="n tnum">${d.getDate()} ${MON[d.getMonth()]}</span></div>`).join("") + arrow(1);
  h += "<div></div>";

  const msg = !email ? "Enter a school email above to see a timetable."
            : loading ? "Loading…"
            : loadError ? loadError
            : !all.length ? "No classes this week." : "";
  if (msg) h += `<div class="msg ${loadError && !loading ? "err" : ""}">${esc(msg)}</div>`;
  else days.forEach((items, k) => {
    const d = dates[k], today = sameDay(d, now), before = midnight(d) < midnight(now);
    h += `<div class="col" style="height:${H}px">`;
    for (const x of items){
      const top = (x.s - T0)*PX + 4, ht = (x.e - x.s)*PX - 8;
      const tm = `<span class="t tnum">${f(x.s)} – ${f(x.e)}</span>`;
      const past = before || (today && x.e <= nowMin), cur = today && x.s <= nowMin && nowMin < x.e;
      if (!x.lesson){
        h += `<div class="gap ${past ? "past" : ""} ${ht < 44 ? "sm" : ""}" style="top:${top}px;height:${ht}px">${x.ls.map(esc).join("<i></i>")}${ht < 44 ? "<i></i>" : ""}${tm}</div>`;
        continue;
      }
      const e = x.lesson, c = e.asm ? "--fg2" : (colourOf[e.subject] || "--c1");
      h += `<div class="blk ${past ? "past" : ""} ${cur ? "now" : ""} ${ht < 50 ? "sm" : ""}" style="--c:var(${c});top:${top}px;height:${ht}px;--p:${cur ? (nowMin - x.s)/(x.e - x.s)*100 : 0}%"` +
           ` title="${esc([e.subject, e.teacher, e.room].filter(Boolean).join(" · "))}">` +
           `<span class="r tnum">${esc(roomNumber(e.room))}</span><span class="s">${esc(e.subject)}</span><span class="m">${esc(e.teacher)}</span>${tm}</div>`;
    }
    h += "</div>";
  });
  if (!msg) h += "<div></div>";
  document.getElementById("g").innerHTML = h;
  document.querySelectorAll(".arrow").forEach(a => a.onclick = () => { off += +a.dataset.d; render(); });

  const letter = (cycs.find(Boolean) || "").slice(-1).toUpperCase();
  const range = dates[0].getDate() + (dates[0].getMonth() !== dates[4].getMonth() ? " " + MON[dates[0].getMonth()] : "") +
                " – " + dates[4].getDate() + " " + MON[dates[4].getMonth()];
  document.getElementById("term").innerHTML = (letter ? `<b>Week ${letter}</b> · ` : "") + range +
    (staleNote ? ` <span class="stale" title="${esc(staleNote)}">· saved copy</span>` : "");
  document.body.classList.toggle("off", off !== 0);
}

/* ═══ email box ═══ */
const input = document.getElementById("email");
const fit = () => input.style.width = Math.max(10, input.value.length + 1) + "ch";
input.value = email.split("@")[0];
fit();
input.addEventListener("input", fit);
function choose(){
  const user = input.value.trim().toLowerCase().split("@")[0];
  if (user && !/^[a-z0-9][a-z0-9._-]*$/.test(user)){ loadError = "That doesn't look like a school email."; entries = []; render(); return; }
  const next = user ? user + "@" + DOMAIN : "";
  input.value = user; fit();
  if (next === email) return;
  email = next; set(LS.email, email); off = 0;
  load();
}
input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); input.blur(); } });
input.addEventListener("change", choose);

document.getElementById("back").onclick = () => { off = 0; render(); };
const gear = document.getElementById("gear"), menu = document.getElementById("menu");
const setMenu = o => { menu.hidden = !o; gear.setAttribute("aria-expanded", o); };
gear.onclick = e => { e.stopPropagation(); setMenu(menu.hidden); };
addEventListener("click", e => { if (!menu.contains(e.target)) setMenu(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

addEventListener("resize", render);
setInterval(render, 30000);     /* keep "now" and past lessons current */
load();
</script>

</body></html>
