<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andre's space · MSC Unofficial</title>
<link rel="icon" type="image/png" href="/images/icon.png">
<!--
  Andre's sandbox for the site redesign. Served at /andre/.
  Deliberately standalone: it doesn't load theme.css / site.css / theme.js, so
  nothing here changes the main site and nothing on the main site changes this.
  Add as many pages and folders as you like inside andre/ — e.g.
  andre/games/index.html is served at /andre/games/. Use root-relative links
  ("/andre/...") or relative ones ("games/") between them.
-->
<style>
  :root{color-scheme:light dark;--bg:#fafafa;--text:#1a1a1a;--muted:#777}
  @media (prefers-color-scheme:dark){ :root{--bg:#111;--text:#f2f2f2;--muted:#999} }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center}
  h1{margin:0;font-size:clamp(1.25rem,4vw,2rem);font-weight:600}
  a{color:var(--muted);font-size:0.875rem}
</style>
</head>
<body>
  <h1>andre is doing something cool here</h1>
  <a href="/home.html">← back to the main site</a>
</body>
</html>
